
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expenditure Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/expenditure.css">

    <script src="/assets/js/expenditure.js" defer></script>
    <script src="/assets/js/sidebar-loader.js" defer></script>
    <script src="/assets/js/topbar-loader.js" defer></script>
</head>

<body>

    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>

    <main class="main-content ex-page expenditure-page">

        <!-- HEADER -->
        <div class="blue-bar">
            <h2>Expenditure</h2>

            <div class="blue-actions">
                <button type="button" class="blue-btn"
                        onclick="toggleFilter()" title="Filter">
                    <i class="fas fa-filter"></i>
                </button>

                <button type="button" class="blue-btn"
                        id="refreshBtn" title="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>

                <button type="button" class="blue-btn"
                        id="addBtn" title="Add Expenditure">
                    <i class="fas fa-plus"></i>
                </button>

                <button type="button" class="blue-btn"
                        id="printBtn" title="Print">
                    <i class="fas fa-print"></i>
                </button>

                <a href="/dashboard" class="blue-btn"
                   title="Back to Dashboard">
                    <i class="fas fa-arrow-left"></i>
                </a>
            </div>
        </div>

        <!-- FILTER -->
        <div class="filter-box" id="filterBox">
            <form id="filterForm">
                <input type="hidden" name="filter" value="1">

                <div class="filter-grid">

                    <div class="field">
                        <label for="filterName">Name</label>
                        <input type="text" id="filterName"
                               name="name" placeholder="Search name">
                    </div>

                    <div class="field">
                        <label for="filterType">Expenditure Type</label>
                        <select id="filterType" name="expenditure_type">
                            <option value="">All Types</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="dateFrom">From Date</label>
                        <input type="date" id="dateFrom" name="date_from">
                    </div>

                    <div class="field">
                        <label for="dateTo">To Date</label>
                        <input type="date" id="dateTo" name="date_to">
                    </div>

                    <div class="filter-actions">
                        <button type="submit" class="filter-submit">
                            <i class="fas fa-search"></i> Filter
                        </button>

                        <button type="button" id="clearFilterBtn"
                                class="btn-cancel">
                            Clear
                        </button>
                    </div>

                </div>
            </form>
        </div>

        <!-- TABS -->
        <div class="tab-bar">
            <button type="button"
                    class="tab-btn active"
                    id="tabBtnExpenditure"
                    data-tab="expenditures">
                Expenditure
            </button>

            <button type="button"
                    class="tab-btn"
                    id="tabBtnType"
                    data-tab="types">
                Expenditure Types
            </button>
        </div>

        <!-- EXPENDITURE PANEL -->
        <section id="expenditurePanel">

            <!-- SUMMARY BAR + SEARCH -->
            <div class="summary-strip">

                <div class="summary-left">
                    <span>
                        Total Records
                        <b id="totalRows">0</b>
                    </span>

                    <span>
                        Total Expenditure
                        <b id="totalAmount">0.00</b> Tk
                    </span>
                </div>

                <input type="search"
                       id="tableSearch"
                       class="summary-search"
                       placeholder="Search..."
                       aria-label="Search expenditure">
            </div>

            <!-- TABLE -->
            <div class="section-card">

                <h3>Expenditure List</h3>

                <div class="table-wrap">
                    <table id="expenditureTable">

                        <thead>
                            <tr>
                                <th data-sort="serial_no">#</th>
                                <th data-sort="expenditure_type">Expenditure Type</th>
                                <th data-sort="expense_definition">Expense Definition</th>
                                <th data-sort="name">Name</th>
                                <th data-sort="amount">Amount</th>
                                <th data-sort="created_at">Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="expenditureRows">
                            <tr>
                                <td colspan="7" class="empty">Loading...</td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </section>

        <!-- EXPENDITURE TYPES PANEL -->
        <section id="typePanel" hidden>

            <div class="summary-strip">
                <div class="summary-left">
                    <span>
                        Total Expenditure Types
                        <b id="totalTypes">0</b>
                    </span>
                </div>
            </div>

            <div class="section-card">

                <div class="section-toolbar">
                    <h3>Expenditure Types</h3>
                </div>

                <div class="table-wrap">
                    <table id="typeTable">

                        <thead>
                            <tr>
                                <th data-sort="serial_no">#</th>
                                <th data-sort="type_name">Expenditure Type</th>
                                <th data-sort="created_at">Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="typeRows">
                            <tr>
                                <td colspan="4" class="empty">Loading...</td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </section>

        <!-- STATUS -->
        <p id="statusMessage" role="status" aria-live="polite"></p>

        <!-- FOOTER -->
        <footer class="page-footer">
            ©  IT - <span id="currentYear"></span>
        </footer>

    </main>

    <!-- ADD / EDIT MODAL -->
    <div id="modalBackdrop" class="modal-overlay" hidden>

        <div class="expenditure-modal"
             role="dialog"
             aria-modal="true"
             aria-labelledby="modalTitle">

            <div class="modal-head">
                <h3 id="modalTitle">Add Expenditure</h3>

                <button type="button"
                        id="modalClose"
                        class="modal-close"
                        aria-label="Close">
                    &times;
                </button>
            </div>

            <form id="entryForm">

                <input type="hidden" id="entryId" name="id">
                <input type="hidden" id="entryKind"
                       name="kind" value="expenditure">

                <!-- EXPENDITURE FIELDS -->
                <div class="modal-body" id="expenditureFields">

                    <div class="modal-field">
                        <label for="entryType">Expenditure Type</label>

                        <select id="entryType"
                                name="expenditure_type_id" required>
                            <option value="">Select Expenditure Type</option>
                        </select>
                    </div>

                    <div class="modal-field">
                        <label for="entryDefinition">Expense Definition</label>

                        <textarea id="entryDefinition"
                                  name="expense_definition"
                                  rows="3"
                                  placeholder="Enter expense definition"></textarea>
                    </div>

                    <div class="modal-field">
                        <label for="entryName">Name</label>

                        <input type="text"
                               id="entryName"
                               name="name"
                               required
                               placeholder="Enter name">
                    </div>

                    <div class="modal-field">
                        <label for="entryAmount">Amount</label>

                        <input type="number"
                               id="entryAmount"
                               name="amount"
                               min="0"
                               step="0.01"
                               required
                               placeholder="Enter amount">
                    </div>

                </div>

                <!-- EXPENDITURE TYPE FIELD -->
                <div class="modal-body" id="typeFields" hidden>

                    <div class="modal-field">
                        <label for="typeName">Expenditure Type</label>

                        <input type="text"
                               id="typeName"
                               name="type_name"
                               placeholder="Enter expenditure type">
                    </div>

                </div>

                <!-- MODAL ACTIONS -->
                <div class="modal-body">
                    <div class="modal-footer">

                        <button type="button"
                                id="modalCancel"
                                class="btn-cancel">
                            Cancel
                        </button>

                        <button type="submit"
                                id="saveBtn"
                                class="btn-submit">
                            Save
                        </button>

                    </div>
                </div>

            </form>
        </div>
    </div>

    <script>
        document.getElementById("currentYear").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
