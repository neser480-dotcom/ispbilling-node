<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recharge History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
        :root { --topbar-height: 70px; --sidebar-width: 250px; }
        body { background: #f4f6f9; margin: 0; overflow-x: hidden; }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: calc(var(--topbar-height) + 16px) 18px 24px;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }
        .page-banner {
            background: #1e88e5; color: #fff; padding: 14px 20px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .page-banner .icon-btn {
            width: 38px; height: 36px; border-radius: 5px; background: #fff; color: #1e88e5;
            border: none; display: inline-flex; align-items: center; justify-content: center;
        }
        .filter-card {
            background: #fff; border: 1px solid #e5e9f0; border-radius: 6px;
            padding: 12px 16px; margin-bottom: 14px;
        }
        .data-toolbar {
            background: #1e88e5; color: #fff; padding: 10px 16px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .data-toolbar .search-input {
            max-width: 340px; width: 100%; border: none; border-radius: 4px;
            padding: 6px 12px; background: #fff; color: #333;
        }
        .sort-hint { font-size: 11px; color: #8c96a5; margin-left: 3px; white-space: nowrap; }
        .page-footer { text-align: center; color: #6c757d; font-size: 13px; margin-top: 32px; }
        .swal2-container { z-index: 2147483647 !important; }
        @media (max-width: 991.98px) {
            .main-content { margin-left: 0; padding: calc(var(--topbar-height) + 14px) 12px 20px; }
        }
    </style>
</head>
<body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>

    <main class="main-content">
        <div class="page-banner mb-3">
            <h4 class="m-0 fw-normal">Recharge History</h4>
            <div class="d-flex gap-2">
                <button class="icon-btn" type="button" onclick="loadData()" title="Refresh"><i class="fa fa-rotate-right"></i></button>
                <button class="icon-btn" type="button" onclick="toggleFilter()" title="Filter"><i class="fa fa-sliders"></i></button>
                <button class="icon-btn" type="button" onclick="window.print()" title="Print"><i class="fa fa-print"></i></button>
            </div>
        </div>

        <div class="filter-card d-none" id="filterBox">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <select id="statusFilter" class="form-select" style="max-width: 220px;">
                    <option value="">All Status</option>
                    <option value="paid">Paid</option>
                    <option value="unpaid">Unpaid</option>
                    <option value="pending">Pending</option>
                    <option value="rejected">Rejected</option>
                </select>
                <button type="button" class="btn btn-outline-primary px-3" onclick="loadData()">Filter</button>
                <button type="button" class="btn btn-outline-secondary px-3" onclick="resetFilter()">Reset</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-3">
            <div class="data-toolbar mb-3">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span><i class="fa fa-gear"></i> Total Data: <span class="badge bg-primary border border-light" id="totalData">0</span></span>
                    <span>Paid recharge: ৳<span id="paidTotal">0</span></span>
                    <span>Unpaid recharge: ৳<span id="unpaidTotal">0</span></span>
                </div>
                <input type="text" id="searchInput" class="search-input" placeholder="Search" />
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th># <span class="sort-hint">↓↑</span></th>
                            <th>Name <span class="sort-hint">↓↑</span></th>
                            <th>Amount <span class="sort-hint">↓↑</span></th>
                            <th>Medium <span class="sort-hint">↓↑</span></th>
                            <th>Status <span class="sort-hint">↓↑</span></th>
                            <th>Date <span class="sort-hint">↓↑</span></th>
                            <th>Comment <span class="sort-hint">↓↑</span></th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="page-footer">© Shunna IT - 2026</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebar-loader.js"></script>
    <script src="/assets/js/topbar-loader.js"></script>
    <script>
        let csrfToken = "";
        let searchTimer = null;

        async function getCsrf(forceRefresh = false) {
            if (csrfToken && !forceRefresh) return csrfToken;
            const res = await fetch("/api/csrf-token", { credentials: "same-origin" });
            const data = await res.json();
            csrfToken = data.csrf_token || "";
            return csrfToken;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "-";
            return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
        }

        function toggleFilter() {
            document.getElementById("filterBox").classList.toggle("d-none");
        }

        function resetFilter() {
            document.getElementById("statusFilter").value = "";
            document.getElementById("searchInput").value = "";
            loadData();
        }

        function statusBadge(st) {
            const s = String(st || "pending").toLowerCase();
            if (s === "paid") return `<span class="badge bg-success">Paid</span>`;
            if (s === "rejected") return `<span class="badge bg-danger">Rejected</span>`;
            if (s === "unpaid") return `<span class="badge bg-warning text-dark">Unpaid</span>`;
            return `<span class="badge bg-secondary">Pending</span>`;
        }

        async function updateStatus(id, status) {
            try {
                let token = await getCsrf();
                let res = await fetch(`/api/reseller-portal/recharges/${id}/status`, {
                    method: "PATCH",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json", "X-CSRF-Token": token },
                    body: JSON.stringify({ status })
                });
                if (res.status === 403) {
                    token = await getCsrf(true);
                    res = await fetch(`/api/reseller-portal/recharges/${id}/status`, {
                        method: "PATCH",
                        credentials: "same-origin",
                        headers: { "Content-Type": "application/json", "X-CSRF-Token": token },
                        body: JSON.stringify({ status })
                    });
                }
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || "Failed to update.");
                await loadData();
                Swal.fire({ icon: "success", title: "Updated", text: data.message, timer: 1200, showConfirmButton: false });
            } catch (err) {
                Swal.fire({ icon: "error", title: "Error", text: err.message });
            }
        }

        async function loadData() {
            const search = document.getElementById("searchInput").value.trim();
            const status = document.getElementById("statusFilter").value.trim();
            const tbody = document.getElementById("tableBody");

            try {
                const params = new URLSearchParams();
                if (search) params.set("search", search);
                if (status) params.set("status", status);
                const query = params.toString() ? `?${params.toString()}` : "";

                const res = await fetch(`/api/reseller-portal/recharges${query}`, { credentials: "same-origin" });
                const json = await res.json();
                if (!res.ok || !json.success) throw new Error(json.message || "Failed to load data.");

                const rows = Array.isArray(json.data) ? json.data : [];
                document.getElementById("totalData").textContent = rows.length;
                document.getElementById("paidTotal").textContent = Number(json.summary?.paid_total || 0);
                document.getElementById("unpaidTotal").textContent = Number(json.summary?.unpaid_total || 0);

                if (!rows.length) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No Data Found !</td></tr>`;
                    return;
                }

                tbody.innerHTML = rows.map((r, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="fw-semibold">${escapeHtml(r.reseller_name)}</td>
                        <td>৳${Number(r.amount || 0).toFixed(2)}</td>
                        <td>${escapeHtml(r.medium || "-")}</td>
                        <td>${statusBadge(r.status)}</td>
                        <td>${escapeHtml(formatDate(r.created_at))}</td>
                        <td>${escapeHtml(r.comment || "-")}</td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-success" type="button" onclick="updateStatus(${Number(r.id)}, 'paid')" title="Mark Paid">
                                    <i class="fa fa-check"></i>
                                </button>
                                <button class="btn btn-outline-danger" type="button" onclick="updateStatus(${Number(r.id)}, 'rejected')" title="Reject">
                                    <i class="fa fa-xmark"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join("");
            } catch (err) {
                document.getElementById("totalData").textContent = "0";
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${escapeHtml(err.message)}</td></tr>`;
            }
        }

        document.getElementById("searchInput").addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadData, 200);
        });

        loadData();
    </script>
</body>
</html>
