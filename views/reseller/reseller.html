<script>
"use strict";

/* =====================================================
   CONFIGURATION
===================================================== */

const API = {
    options: "/api/reseller-portal/options",
    resellers: "/api/reseller-portal/resellers"
};

let csrfToken = "";
let searchTimer = null;
let loadingOptions = false;

/* =====================================================
   PERMISSIONS
===================================================== */

const PERMISSIONS_LIST = [
    { key: "all_permission", label: "All Permission", isMaster: true },
    { key: "customer_add", label: "Customer Add" },
    { key: "customer_edit", label: "Customer Edit" },
    { key: "add_customer_with_mobile", label: "Add Customer With Mobile Number" },
    { key: "monthly_fee_edit", label: "Monthly Fee Edit" },
    { key: "create_customer_with_balance", label: "Create Customer With Balance" },
    { key: "update_customer_balance", label: "Update Customer Balance" },
    { key: "package_edit", label: "Package Edit", info: true },
    { key: "status_edit", label: "Status Edit" },
    { key: "customer_active", label: "Customer Active", info: true },
    { key: "customer_minus_balance_inactive", label: "Customer Minus Balance Inactive", info: true },
    { key: "customer_auto_disable_edit", label: "Customer Auto Disable Edit" },
    { key: "bulk_area_edit", label: "Bulk Area Edit" },
    { key: "bulk_status_edit", label: "Bulk Status Edit" },
    { key: "bulk_billing_cycle_edit", label: "Bulk BillingCycle Edit" },
    { key: "bulk_customer_recharge", label: "Bulk Customer Recharge" },
    { key: "billing_cycle_edit", label: "Billing Cycle Edit" },
    { key: "single_customer_number_edit", label: "Single Customer Number Edit" },
    { key: "daily_recharge_feature", label: "Daily Recharge Feature" },
    { key: "customer_delete", label: "Customer Delete" },
    { key: "daily_reseller_customer_auto_connection", label: "Daily Reseller Customer Auto Connection" },
    { key: "customer_recharge", label: "Customer Recharge" },
    { key: "bulk_customer_package_update", label: "Bulk Customer Package Update" },
    { key: "promise_date", label: "Promise Date" },
    { key: "olt_user_monitoring", label: "OLT User Monitoring" },
    { key: "traffic_monitoring", label: "Traffic Monitoring" },
    { key: "webhook_message_log", label: "Webhook Message Log" }
];

function renderPermissions() {
    const grid = document.getElementById("permissionsGrid");

    grid.innerHTML = PERMISSIONS_LIST.map(p => `
        <div class="col-md-4 col-sm-6">
            <div class="perm-card d-flex align-items-center justify-content-between">
                <div class="form-check m-0">
                    <input class="form-check-input perm-check ${p.isMaster ? "perm-master" : "perm-item"}"
                           type="checkbox"
                           value="${escapeHtml(p.key)}"
                           id="perm_${escapeHtml(p.key)}" />

                    <label class="form-check-label perm-label ${p.isMaster ? "fw-semibold" : ""}"
                           for="perm_${escapeHtml(p.key)}">
                        ${escapeHtml(p.label)}
                    </label>
                </div>

                ${p.info ? '<span class="info-dot" title="Reseller permission option">i</span>' : ""}
            </div>
        </div>
    `).join("");

    const master = grid.querySelector(".perm-master");

    if (master) {
        master.addEventListener("change", () => {
            grid.querySelectorAll(".perm-item").forEach(item => {
                item.checked = master.checked;
            });
        });
    }
}

/* =====================================================
   HTML ESCAPING
===================================================== */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

/* =====================================================
   CSRF
===================================================== */

async function getCsrf(forceRefresh = false) {
    if (csrfToken && !forceRefresh) return csrfToken;

    const res = await fetch("/api/csrf-token", {
        credentials: "same-origin"
    });

    if (!res.ok) {
        throw new Error("Unable to obtain security token.");
    }

    const data = await res.json();
    csrfToken = data.csrf_token || "";

    if (!csrfToken) {
        throw new Error("Security token is missing.");
    }

    return csrfToken;
}

/* =====================================================
   COMPANY-SCOPED DYNAMIC OPTIONS
   No hardcoded fallback data.
===================================================== */

function renderOptionError(element, message) {
    if (!element) return;

    element.innerHTML = `
        <div class="col-12 text-danger small">
            ${escapeHtml(message)}
        </div>
    `;
}

async function loadDynamicOptions() {
    if (loadingOptions) return;

    loadingOptions = true;

    const areaGrid = document.getElementById("areaGrid");
    const packageBox = document.getElementById("packageBox");

    areaGrid.innerHTML = `
        <div class="col-12 option-loading">Loading company areas...</div>
    `;

    packageBox.innerHTML = `
        <div class="option-loading">Loading company routers and packages...</div>
    `;

    try {
        const res = await fetch(API.options, {
            credentials: "same-origin",
            headers: {
                "Accept": "application/json"
            }
        });

        const json = await res.json();

        if (!res.ok || !json.success || !json.data) {
            throw new Error(json.message || "Unable to load reseller options.");
        }

        const areas = Array.isArray(json.data.areas) ? json.data.areas : [];
        const routers = Array.isArray(json.data.routers) ? json.data.routers : [];
        const packages = Array.isArray(json.data.packages) ? json.data.packages : [];

        renderAreas(areas);
        renderPackages(routers, packages);

    } catch (err) {
        renderOptionError(areaGrid, err.message);
        packageBox.innerHTML = `
            <div class="text-danger small">${escapeHtml(err.message)}</div>
        `;
    } finally {
        loadingOptions = false;
    }
}

/* =====================================================
   AREA RENDERING
===================================================== */

function renderAreas(areas) {
    const grid = document.getElementById("areaGrid");

    if (!areas.length) {
        grid.innerHTML = `
            <div class="col-12 text-muted small">
                No areas available for this company.
            </div>
        `;
        return;
    }

    const roots = areas.filter(a => !a.parent_id);

    const childrenMap = new Map();

    areas.forEach(area => {
        if (area.parent_id) {
            const parentId = Number(area.parent_id);
            const list = childrenMap.get(parentId) || [];

            list.push(area);
            childrenMap.set(parentId, list);
        }
    });

    const groups = roots.length ? roots : areas;

    grid.innerHTML = groups.map((group, index) => {
        const children = childrenMap.get(Number(group.id)) || [];

        const childHtml = children.map((child, childIndex) => `
            <div class="form-check ms-2">
                <input class="form-check-input area-check"
                       type="checkbox"
                       value="${escapeHtml(child.id)}"
                       data-area-id="${escapeHtml(child.id)}"
                       data-parent-id="${escapeHtml(group.id)}"
                       id="dyn_sub_${index}_${childIndex}" />

                <label class="form-check-label"
                       for="dyn_sub_${index}_${childIndex}">
                    ${escapeHtml(child.name)}
                </label>
            </div>
        `).join("");

        return `
            <div class="col-md-2 col-6">
                <div class="form-check fw-semibold mb-2">
                    <input class="form-check-input area-check"
                           type="checkbox"
                           value="${escapeHtml(group.id)}"
                           data-area-id="${escapeHtml(group.id)}"
                           id="dyn_area_${index}" />

                    <label class="form-check-label"
                           for="dyn_area_${index}">
                        ${escapeHtml(group.name)}
                    </label>
                </div>

                ${childHtml}
            </div>
        `;
    }).join("");
}

/* =====================================================
   PACKAGE RENDERING
===================================================== */

function renderPackages(routers, packages) {
    const box = document.getElementById("packageBox");

    if (!routers.length) {
        box.innerHTML = `
            <div class="text-muted small">
                No routers available for this company.
            </div>
        `;
        return;
    }

    if (!packages.length) {
        box.innerHTML = `
            <div class="text-muted small">
                No packages available for this company.
            </div>
        `;
        return;
    }

    const packageGroups = new Map();

    packages.forEach(pkg => {
        const routerId = Number(pkg.mikrotik_id ?? pkg.router_id ?? 0);
        const list = packageGroups.get(routerId) || [];

        list.push(pkg);
        packageGroups.set(routerId, list);
    });

    box.innerHTML = routers.map((router, routerIndex) => {
        const routerId = Number(router.id);
        const routerPackages = packageGroups.get(routerId) || [];

        if (!routerPackages.length) return "";

        return `
            <div class="mb-3">
                <div class="form-check fw-semibold mb-2">
                    <input class="form-check-input pkg-check router-check"
                           type="checkbox"
                           value="${escapeHtml(router.id)}"
                           data-router-id="${escapeHtml(router.id)}"
                           id="dyn_router_${routerIndex}" />

                    <label class="form-check-label"
                           for="dyn_router_${routerIndex}">
                        ${escapeHtml(router.name)}
                    </label>
                </div>

                <div class="ms-4 d-flex flex-column gap-2">
                    ${routerPackages.map((pkg, index) => `
                        <div class="form-check">
                            <input class="form-check-input pkg-check package-check"
                                   type="checkbox"
                                   value="${escapeHtml(pkg.id)}"
                                   data-package-id="${escapeHtml(pkg.id)}"
                                   data-router-id="${escapeHtml(router.id)}"
                                   id="dyn_pkg_${routerIndex}_${index}" />

                            <label class="form-check-label"
                                   for="dyn_pkg_${routerIndex}_${index}">
                                ${escapeHtml(pkg.name)}
                                <span class="text-muted">
                                    ৳${Number(pkg.price || 0)}
                                </span>
                            </label>
                        </div>
                    `).join("")}
                </div>
            </div>
        `;
    }).join("");

    if (!box.innerHTML.trim()) {
        box.innerHTML = `
            <div class="text-muted small">
                No packages available for the selected company routers.
            </div>
        `;
    }
}

/* =====================================================
   LOAD RESELLERS
===================================================== */

async function loadResellers() {
    const search = document.getElementById("searchInput").value.trim();
    const tbody = document.getElementById("tableBody");

    tbody.innerHTML = `
        <tr>
            <td colspan="9" class="text-center py-4 text-muted">
                Loading...
            </td>
        </tr>
    `;

    try {
        const query = search
            ? `?search=${encodeURIComponent(search)}`
            : "";

        const res = await fetch(`${API.resellers}${query}`, {
            credentials: "same-origin",
            headers: {
                "Accept": "application/json"
            }
        });

        const json = await res.json();

        if (!res.ok || !json.success) {
            throw new Error(json.message || "Failed to load resellers.");
        }

        const rows = Array.isArray(json.data) ? json.data : [];

        document.getElementById("totalData").textContent =
            json.summary?.total_resellers ?? rows.length;

        document.getElementById("totalCustomers").textContent =
            json.summary?.total_customers ?? 0;

        document.getElementById("totalBalance").textContent =
            json.summary?.total_balance ?? 0;

        if (!rows.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center py-4 text-muted">
                        No Data Found!
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = rows.map((row, index) => {
            const active = String(row.status || "active").toLowerCase() === "active";

            return `
                <tr>
                    <td>${index + 1}</td>
                    <td class="fw-semibold">${escapeHtml(row.name)}</td>
                    <td>${escapeHtml(row.mobile)}</td>
                    <td>${escapeHtml(row.email)}</td>
                    <td>${escapeHtml(row.address)}</td>
                    <td>
                        <span class="badge ${active ? "bg-success" : "bg-secondary"}">
                            ${active ? "Active" : "Inactive"}
                        </span>
                    </td>
                    <td>${Number(row.total_customers || 0)}</td>
                    <td>৳${Number(row.balance || 0).toFixed(2)}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger"
                                type="button"
                                onclick="deleteReseller(${Number(row.id)})"
                                title="Delete">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join("");

    } catch (err) {
        document.getElementById("totalData").textContent = "0";

        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="text-center py-4 text-danger">
                    ${escapeHtml(err.message)}
                </td>
            </tr>
        `;
    }
}

/* =====================================================
   CREATE RESELLER
===================================================== */

document.getElementById("createResellerForm").addEventListener("submit", async event => {
    event.preventDefault();

    const form = event.target;
    const fd = new FormData(form);

    const areas = Array.from(
        document.querySelectorAll(".area-check:checked")
    ).map(el => Number(el.dataset.areaId));

    const packages = Array.from(
        document.querySelectorAll(".package-check:checked")
    ).map(el => Number(el.dataset.packageId));

    const routers = Array.from(
        document.querySelectorAll(".router-check:checked")
    ).map(el => Number(el.dataset.routerId));

    const permissions = Array.from(
        document.querySelectorAll(".perm-item:checked")
    ).map(el => el.value);

    const allPermission = document.querySelector(".perm-master");

    if (allPermission?.checked) {
        permissions.push("all_permission");
    }

    const payload = {
        name: String(fd.get("name") || "").trim(),
        mobile: String(fd.get("mobile") || "").trim(),
        nid_no: String(fd.get("nid_no") || "").trim(),
        address: String(fd.get("address") || "").trim(),
        email: String(fd.get("email") || "").trim(),
        status: fd.get("status") === "inactive" ? "inactive" : "active",
        website: String(fd.get("website") || "").trim(),
        commission_type: fd.get("commission_type") === "package"
            ? "package"
            : "global",
        areas,
        routers,
        packages,
        permissions
    };

    try {
        let token = await getCsrf();

        let res = await fetch(API.resellers, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRF-Token": token
            },
            body: JSON.stringify(payload)
        });

        if (res.status === 403) {
            token = await getCsrf(true);

            res = await fetch(API.resellers, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": token
                },
                body: JSON.stringify(payload)
            });
        }

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Failed to create reseller.");
        }

        form.reset();

        const modalElement = document.getElementById("createResellerModal");
        const modal = bootstrap.Modal.getInstance(modalElement);

        if (modal) modal.hide();

        await loadResellers();
        await loadDynamicOptions();

        Swal.fire({
            icon: "success",
            title: "Created",
            text: data.message,
            timer: 1400,
            showConfirmButton: false
        });

    } catch (err) {
        Swal.fire({
            icon: "error",
            title: "Error",
            text: err.message
        });
    }
});

/* =====================================================
   DELETE RESELLER
===================================================== */

async function deleteReseller(id) {
    if (!Number.isInteger(Number(id)) || Number(id) <= 0) {
        return;
    }

    const confirmResult = await Swal.fire({
        title: "Delete reseller?",
        text: "This action cannot be undone.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#dc3545",
        confirmButtonText: "Yes, delete"
    });

    if (!confirmResult.isConfirmed) return;

    try {
        let token = await getCsrf();

        let res = await fetch(`${API.resellers}/${Number(id)}`, {
            method: "DELETE",
            credentials: "same-origin",
            headers: {
                "X-CSRF-Token": token
            }
        });

        if (res.status === 403) {
            token = await getCsrf(true);

            res = await fetch(`${API.resellers}/${Number(id)}`, {
                method: "DELETE",
                credentials: "same-origin",
                headers: {
                    "X-CSRF-Token": token
                }
            });
        }

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Failed to delete reseller.");
        }

        await loadResellers();

        Swal.fire({
            icon: "success",
            title: "Deleted",
            text: data.message,
            timer: 1300,
            showConfirmButton: false
        });

    } catch (err) {
        Swal.fire({
            icon: "error",
            title: "Error",
            text: err.message
        });
    }
}

/* =====================================================
   SEARCH
===================================================== */

document.getElementById("searchInput").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadResellers, 250);
});

/* =====================================================
   MODAL FIX
===================================================== */

document.addEventListener("show.bs.modal", event => {
    const modal = event.target;

    document.body.appendChild(modal);

    modal.style.setProperty("z-index", "2147483647", "important");

    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
        document.body.appendChild(backdrop);
        backdrop.style.setProperty("z-index", "2147483640", "important");
    });
});

document.addEventListener("hidden.bs.modal", () => {
    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
        backdrop.remove();
    });

    document.body.classList.remove("modal-open");
    document.body.style.removeProperty("overflow");
    document.body.style.removeProperty("padding-right");
});

/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener("DOMContentLoaded", async () => {
    renderPermissions();

    await Promise.all([
        loadResellers(),
        loadDynamicOptions()
    ]);
});

/* Load company options whenever the modal opens. */
document.getElementById("createResellerModal").addEventListener("show.bs.modal", () => {
    loadDynamicOptions();
});

</script>
