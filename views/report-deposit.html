<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Deposit Report - ISP Billing</title>


<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<!-- Font Awesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<!-- Reports CSS -->
<link
    rel="stylesheet"
    href="/assets/css/reports.css"
>
```

</head>

<body>

<!-- ==========================================================
     SIDEBAR
=========================================================== -->

<div id="sidebarContainer"></div>

<!-- ==========================================================
     TOPBAR
=========================================================== -->

<div id="topbarContainer"></div>

<!-- ==========================================================
     MAIN CONTENT
=========================================================== -->

<main class="main-content report-main">

```
<!-- ======================================================
     REPORT HEADER
======================================================= -->

<div class="report-header-bar">

    <div>

        <h1>
            Deposit Report
        </h1>

        <div class="report-subtitle">
            Deposit transaction report
        </div>

    </div>


    <div class="report-actions">

        <button
            type="button"
            class="report-btn"
            id="refreshBtn"
        >
            <i class="fa-solid fa-rotate"></i>
            Refresh
        </button>


        <button
            type="button"
            class="report-btn"
            id="printBtn"
        >
            <i class="fa-solid fa-print"></i>
            Print
        </button>

    </div>

</div>



<!-- ======================================================
     SUMMARY
======================================================= -->

<div class="summary-sub-bar">

    <div class="summary-info">

        <span>
            Total Data
        </span>

        <strong id="totalData">
            0
        </strong>

    </div>


    <div class="summary-info">

        <span>
            Total Deposit
        </span>

        <strong id="totalAmount">
            0.00
        </strong>

    </div>

</div>



<!-- ======================================================
     NOTICE
======================================================= -->

<div
    class="report-notice"
    id="reportNotice"
    style="display:none"
></div>



<!-- ======================================================
     FILTER
======================================================= -->

<div class="report-filter">

    <input
        type="text"
        id="search"
        placeholder="Search method, user, note..."
    >


    <input
        type="date"
        id="fromDate"
    >


    <input
        type="date"
        id="toDate"
    >


    <select id="limit">

        <option value="100">
            100
        </option>

        <option value="200">
            200
        </option>

        <option value="500">
            500
        </option>

        <option value="5000">
            5000
        </option>

        <option value="100000">
            All
        </option>

    </select>


    <button
        type="button"
        class="report-btn primary"
        id="filterBtn"
    >
        <i class="fa-solid fa-filter"></i>
        Filter
    </button>

</div>



<!-- ======================================================
     TABLE
======================================================= -->

<div class="table-container">

    <table class="custom-table">

        <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Amount
                </th>

                <th>
                    Payment Method
                </th>

                <th>
                    Created By
                </th>

                <th>
                    Note
                </th>

                <th>
                    Date
                </th>

            </tr>

        </thead>


        <tbody id="reportBody">

            <tr>

                <td
                    colspan="6"
                    class="loading"
                >
                    Loading...

                </td>

            </tr>

        </tbody>

    </table>

</div>



<!-- ======================================================
     PAGINATION
======================================================= -->

<div
    class="pagination"
    id="pagination"
></div>
```

</main>

<!-- ==========================================================
     BOOTSTRAP
=========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<!-- ==========================================================
     SIDEBAR LOADER
=========================================================== -->

<script
    src="/assets/js/sidebar-loader.js"
></script>

<!-- ==========================================================
     TOPBAR LOADER
=========================================================== -->

<script
    src="/assets/js/topbar-loader.js"
></script>

<!-- ==========================================================
     DEPOSIT REPORT JS
=========================================================== -->

<script
    src="/assets/js/report-deposit.js"
></script>

</body>

</html>
