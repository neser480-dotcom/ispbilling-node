<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLT List | ISP Billing</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/topbar.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <style>
    .main-content { margin-top: 60px; }

    .olt-list-page {
      width: 100%;
      min-width: 0;
      padding: 12px 14px 20px;
      color: #5f6b7a;
    }

    .olt-list-page,
    .olt-list-page * { box-sizing: border-box; }

    /* ---------- Heading bar ---------- */
    .olt-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 18px 24px;
      background: linear-gradient(90deg, #2d82e0 0%, #3a90e8 100%);
      color: #fff;
      border-radius: 6px;
      margin-bottom: 6px;
      box-shadow: 0 2px 6px rgba(45, 130, 224, .25);
    }

    .olt-heading h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      color: #fff;
    }

    .olt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #2d82e0;
      font-size: 15px;
      cursor: pointer;
      transition: background .15s;
    }

    .olt-btn:hover { background: #eaf3ff; }

    /* ---------- White card ---------- */
    .olt-card {
      background: #fff;
      padding: 28px 20px 14px;
      border-radius: 0;
    }

    .olt-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 8px 10px 8px 14px;
      margin-bottom: 22px;
      background: #2f8ae6;
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(47, 138, 230, .35);
    }

    .olt-summary-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
    }

    .olt-badge {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      padding: 3px 12px;
      background: #2866b8;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .olt-search {
      width: 345px;
      max-width: 100%;
      flex: 0 1 345px;
      margin-left: auto;
    }

    .olt-search input {
      display: block;
      width: 100%;
      height: 36px;
      padding: 6px 12px;
      border: 0;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
      color: #fff;
      background: rgba(0, 0, 0, .14);
    }

    .olt-search input::placeholder { color: rgba(255, 255, 255, .85); }
    .olt-search input:focus { background: rgba(0, 0, 0, .22); }

    /* ---------- Table ---------- */
    .olt-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .olt-table {
      width: 100%;
      min-width: 980px;
      margin: 0;
      border-collapse: collapse;
    }

    .olt-table th {
      padding: 12px 10px;
      background: transparent;
      color: #5a6678;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      border: 0;
      user-select: none;
    }

    .olt-table th[data-sort] { cursor: pointer; text-align: left; }
    .olt-table th:first-child { padding-left: 12px; }
    .olt-table th:last-child { text-align: center; cursor: default; }

    .olt-sort {
      color: #2f86e0;
      font-weight: 400;
      font-size: 13px;
      margin-left: 2px;
    }

    .olt-table td {
      padding: 14px 10px;
      border: 0;
      vertical-align: middle;
      font-size: 14px;
      color: #66717f;
    }

    .olt-table tbody tr:nth-child(odd) { background: #f1f1f1; }
    .olt-table tbody tr:nth-child(even) { background: #fff; }
    .olt-table tbody tr:hover { background: #e9f1fb; }

    .olt-table td:first-child { font-weight: 700; color: #4b5563; padding-left: 12px; }
    .olt-table td.olt-created { white-space: normal; min-width: 120px; max-width: 140px; line-height: 1.45; }
    .olt-table td.olt-action { white-space: nowrap; text-align: center; }

    .olt-vendor { color: #66717f; font-weight: 500; }
    .olt-name { color: #66717f; font-weight: 500; }
    .olt-muted { color: #66717f; }

    .olt-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .olt-act {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 30px;
      border: 1px solid #1f6fe0;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .olt-act.solid { background: #1f6fe0; color: #fff; }
    .olt-act.outline { background: #fff; color: #1f6fe0; }
    .olt-act:hover { opacity: .85; }
    .olt-act:disabled { opacity: .55; cursor: wait; }

    .olt-dots {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: #2f86e0;
      font-size: 16px;
      cursor: pointer;
    }

    .olt-menu {
      min-width: 160px;
      padding: 8px 0;
      border: 0;
      border-radius: 8px;
      background: #2f86e0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .22);
    }

    .olt-menu .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      color: #fff;
      font-size: 14px;
      background: transparent;
    }

    .olt-menu .dropdown-item:hover,
    .olt-menu .dropdown-item:focus {
      background: rgba(255, 255, 255, .16);
      color: #fff;
    }

    .olt-menu .dropdown-item:disabled { opacity: .6; }

    .olt-empty {
      padding: 40px 15px !important;
      text-align: center;
      color: #6b7280;
      background: #fff;
    }

    .olt-footer {
      text-align: center;
      margin-top: 34px;
      color: #6b7280;
      font-size: 16px;
    }

    @media (max-width: 576px) {
      .olt-card { padding: 16px 10px 10px; }
      .olt-search { flex-basis: 100%; width: 100%; }
    }

    /* ---------- Modal ---------- */
    #oltModal .modal-dialog { max-width: 600px; }

    #oltModal .modal-content {
      display: flex;
      max-height: calc(100vh - 2rem);
      overflow: hidden;
    }

    #oltModal #oltForm {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    #oltModal .modal-header,
    #oltModal .modal-footer {
      flex-shrink: 0;
      background: #fff;
    }

    #oltModal .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto !important;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* ---------- Toast notifications ---------- */
    #oltToastContainer {
      position: fixed;
      top: 82px;
      right: 20px;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(390px, calc(100vw - 32px));
      pointer-events: none;
    }

    .olt-toast {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 12px;
      color: #fff;
      background: #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,.22);
      pointer-events: auto;
      overflow-wrap: anywhere;
      animation: oltToastIn .25s ease-out;
    }

    .olt-toast.success { background: #15803d; }
    .olt-toast.danger { background: #b91c1c; }
    .olt-toast.warning { background: #b45309; }
    .olt-toast.info { background: #1d4ed8; }

    .olt-toast-icon { font-size: 20px; padding-top: 1px; }
    .olt-toast-content { flex: 1; min-width: 0; }
    .olt-toast-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .olt-toast-message { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .olt-toast-close { border: 0; background: transparent; color: #fff; opacity: .8; cursor: pointer; font-size: 21px; line-height: 1; padding: 0 2px; }
    .olt-toast-close:hover { opacity: 1; }

    @keyframes oltToastIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* =========================================
       OLT LIST - DARK MODE
    ========================================= */
    body.dark-mode .olt-list-page { color: #e5e7eb; }

    body.dark-mode .olt-card {
      background: #1e293b;
      color: #e5e7eb;
    }

    body.dark-mode .olt-table th { color: #cbd5e1; }
    body.dark-mode .olt-table td { color: #e2e8f0; }
    body.dark-mode .olt-table td:first-child { color: #f1f5f9; }
    body.dark-mode .olt-table tbody tr:nth-child(odd) { background: #263449; }
    body.dark-mode .olt-table tbody tr:nth-child(even) { background: #1e293b; }
    body.dark-mode .olt-table tbody tr:hover { background: #2f405a; }

    body.dark-mode .olt-vendor,
    body.dark-mode .olt-name,
    body.dark-mode .olt-muted { color: #cbd5e1; }

    body.dark-mode .olt-empty { background: #1e293b; color: #94a3b8; }
    body.dark-mode .olt-footer { color: #94a3b8; }
    body.dark-mode .olt-act.outline { background: #1e293b; }

    body.dark-mode .olt-list-page input,
    body.dark-mode .olt-list-page select,
    body.dark-mode .olt-list-page textarea {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #475569;
    }

    body.dark-mode .olt-list-page .olt-search input {
      background: rgba(0, 0, 0, .25);
      color: #fff;
      border: 0;
    }

    body.dark-mode .olt-list-page input::placeholder,
    body.dark-mode .olt-list-page textarea::placeholder { color: #94a3b8; }

    body.dark-mode #oltModal .modal-content {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #475569;
    }

    body.dark-mode #oltModal .modal-header,
    body.dark-mode #oltModal .modal-footer {
      background: #263449;
      border-color: #475569;
    }

    body.dark-mode #oltModal .modal-title { color: #f1f5f9; }
    body.dark-mode #oltModal .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }

    body.dark-mode #oltModal .form-control,
    body.dark-mode #oltModal .form-select {
      background-color: #1e293b;
      color: #e2e8f0;
      border-color: #475569;
    }

    body.dark-mode #oltModal .form-control:focus,
    body.dark-mode #oltModal .form-select:focus {
      background-color: #1e293b;
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.2);
    }
  </style>
</head>

<body>
  <div id="sidebarContainer"></div>
  <div id="topbarContainer"></div>

  <div class="main-content">
    <main class="olt-list-page">

      <!-- Heading -->
      <div class="olt-heading">
        <h2>OLT</h2>
        <div class="d-flex gap-2">
          <button type="button" class="olt-btn" id="refreshTopBtn" title="Refresh">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <button type="button" class="olt-btn" id="addOltBtn" title="Add OLT">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button type="button" class="olt-btn" id="reloadTopBtn" title="Reload">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <!-- Card -->
      <section class="olt-card">

        <div class="olt-summary">
          <div class="olt-summary-left">
            <i class="fa-solid fa-gear"></i>
            Total Data:
            <span class="olt-badge" id="totalOltCount">0</span>
          </div>

          <div class="olt-search">
            <input type="search" id="oltSearch" placeholder="Search" autocomplete="off" aria-label="Search OLTs">
          </div>
        </div>

        <div class="olt-table-wrap">
          <table class="olt-table">
            <thead>
              <tr>
                <th data-sort="idx"># <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="vendor">Vendor <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="name">Name <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="pon">PON <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="username">User Name <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="host">Host <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="port">Port <span class="olt-sort">&darr;&uarr;</span></th>
                <th data-sort="createdAt">Created At <span class="olt-sort">&darr;&uarr;</span></th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="oltTableBody">
              <tr>
                <td colspan="9" class="olt-empty">Loading OLTs...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="olt-footer">&copy; IRFAN IT - <span id="oltYear"></span></div>

    </main>
  </div>

  <!-- Add/Edit OLT Modal -->
  <div class="modal fade olt-modal" id="oltModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="oltForm">
          <div class="modal-header">
            <h5 class="modal-title" id="oltModalTitle">Create OLT</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltMikrotik">Select MikroTik <span class="text-danger">*</span></label>
              <select class="form-select" id="oltMikrotik" required>
                <option value="">Select MikroTik</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltVendor">
                Select OLT Vendor <span class="text-danger">*</span>
              </label>
              <select class="form-select" id="oltVendor" required>
                <option value="">Select OLT Vendor</option>
                <option value="CData EPon">CData</option>
                <option value="ECom EPon">ECom</option>
                <option value="V-SOL">V-SOL</option>
                <option value="BDCOM">BDCOM</option>
                <option value="Huawei">Huawei</option>
                <option value="ZTE">ZTE</option>
                <option value="FiberHome">FiberHome</option>
                <option value="Raisecom">Raisecom</option>
                <option value="Nokia">Nokia</option>
                <option value="TP-Link">TP-Link</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltName">Name <span class="text-danger">*</span></label>
              <input class="form-control" id="oltName" maxlength="150" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltPon">PON Port <span class="text-danger">*</span></label>
              <select class="form-select" id="oltPon" required>
                <option value="">Select PON Port</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="16">16</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltUsername">OLT User Name <span class="text-danger">*</span></label>
              <input class="form-control" id="oltUsername" autocomplete="username" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltPassword">
                OLT User Password <span class="text-danger">*</span>
                <span class="text-muted fw-normal" id="oltPasswordHint"></span>
              </label>

              <div class="input-group">
                <input class="form-control" id="oltPassword" type="password" autocomplete="new-password">
                <button class="btn btn-outline-secondary" type="button" id="toggleOltPassword" aria-label="Show password">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
              <small class="text-muted">Edit করার সময় ফাঁকা রাখলে বর্তমান password অপরিবর্তিত থাকবে।</small>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltHost">OLT IP <span class="text-danger">*</span></label>
              <input class="form-control" id="oltHost" autocomplete="off" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltPort">OLT Port <span class="text-danger">*</span></label>
              <input class="form-control" id="oltPort" type="number" min="1" max="65535" required>
            </div>

            <input type="hidden" id="oltSnmpVersion" value="v2c">
            <input type="hidden" id="oltCommunity" value="public">
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success btn-sm">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/sidebar-loader.js"></script>
  <script src="/assets/js/topbar-loader.js"></script>

<script>
"use strict";

(function () {
  const tableBody = document.getElementById("oltTableBody");
  const searchInput = document.getElementById("oltSearch");
  const totalCount = document.getElementById("totalOltCount");
  const modalElement = document.getElementById("oltModal");
  const oltModal = bootstrap.Modal.getOrCreateInstance(modalElement);
  const oltForm = document.getElementById("oltForm");
  const sortHeaders = document.querySelectorAll(".olt-table thead th[data-sort]");

  let oltRecords = [];
  let mikrotikRecords = [];
  let editingOltId = null;
  let loading = false;
  let loadingMikrotiks = false;
  let saving = false;
  let sortKey = "";
  let sortDir = 1;

  const busyActions = new Set();

  const yearEl = document.getElementById("oltYear");
  if (yearEl) yearEl.textContent = String(new Date().getFullYear());

  const field = {
    mikrotik: document.getElementById("oltMikrotik"),
    vendor: document.getElementById("oltVendor"),
    name: document.getElementById("oltName"),
    pon: document.getElementById("oltPon"),
    username: document.getElementById("oltUsername"),
    password: document.getElementById("oltPassword"),
    host: document.getElementById("oltHost"),
    port: document.getElementById("oltPort"),
    snmpVersion: document.getElementById("oltSnmpVersion"),
    community: document.getElementById("oltCommunity")
  };

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  function showMessage(message, type = "info") {
    let container = document.getElementById("oltToastContainer");

    if (!container) {
      container = document.createElement("div");
      container.id = "oltToastContainer";
      container.setAttribute("aria-live", "polite");
      document.body.appendChild(container);
    }

    const allowedTypes = ["success", "danger", "warning", "info"];
    if (!allowedTypes.includes(type)) type = "info";

    const icons = {
      success: "fa-circle-check",
      danger: "fa-circle-exclamation",
      warning: "fa-triangle-exclamation",
      info: "fa-circle-info"
    };

    const titles = {
      success: "Success",
      danger: "Error",
      warning: "Warning",
      info: "Information"
    };

    const toast = document.createElement("div");
    toast.className = "olt-toast " + type;

    const icon = document.createElement("i");
    icon.className = "fa-solid " + icons[type] + " olt-toast-icon";

    const content = document.createElement("div");
    content.className = "olt-toast-content";

    const title = document.createElement("div");
    title.className = "olt-toast-title";
    title.textContent = titles[type];

    const text = document.createElement("div");
    text.className = "olt-toast-message";
    text.textContent = String(message || "Operation completed.");

    const close = document.createElement("button");
    close.type = "button";
    close.className = "olt-toast-close";
    close.textContent = "\u00d7";

    content.append(title, text);
    toast.append(icon, content, close);
    container.appendChild(toast);

    let timer;

    function removeToast() {
      clearTimeout(timer);
      if (toast.isConnected) toast.remove();
    }

    close.addEventListener("click", removeToast);
    timer = setTimeout(removeToast, type === "danger" ? 7000 : 4000);
  }

  async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
      credentials: "same-origin",
      ...options,
      headers: { ...(options.headers || {}) }
    });

    const contentType = response.headers.get("content-type") || "";
    let data = {};

    if (contentType.includes("application/json")) {
      data = await response.json();
    } else {
      const responseText = await response.text();

      if (!response.ok) {
        throw new Error(responseText || "Request failed: " + response.status);
      }

      throw new Error("Server did not return JSON. Check the API route.");
    }

    if (
      !response.ok ||
      data.success === false ||
      data.status === false
    ) {
      throw new Error(
        data.message || data.error || "Request failed: " + response.status
      );
    }

    return data;
  }

  function normalizeVendor(value) {
    const raw = String(value ?? "").trim();
    const key = raw.toLowerCase().replace(/[^a-z0-9]/g, "");

    const vendorMap = {
      cdata: "CData EPon",
      cdataepon: "CData EPon",
      ecom: "ECom EPon",
      ecomepon: "ECom EPon",
      vsol: "V-SOL",
      bdcom: "BDCOM",
      huawei: "Huawei",
      zte: "ZTE",
      fiberhome: "FiberHome",
      raisecom: "Raisecom",
      nokia: "Nokia",
      tplink: "TP-Link",
      other: "Other"
    };

    return vendorMap[key] || "Other";
  }

  function normalizeOlt(row) {
    return {
      id: Number(row.id),
      mikrotik_id: row.mikrotik_id ?? row.mikrotik ?? "",
      mikrotik_name: row.mikrotik_name ?? "",
      vendor: normalizeVendor(row.vendor),
      name: row.name ?? "",
      pon: row.pon_ports ?? row.pon ?? "",
      username: row.username ?? "",
      host: row.ip ?? row.host ?? "",
      port: row.port ?? "",
      createdAt: row.created_at ?? row.createdAt ?? "",
      snmp_version: row.snmp_version ?? "v2c",
      community: row.community ?? "public"
    };
  }

  /* Format: 2026/10/08 06:32 PM */
  function formatDate(value) {
    if (!value) return "\u2014";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return String(value);

    const pad = function (n) { return String(n).padStart(2, "0"); };
    let hours = date.getHours();
    const suffix = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;

    return (
      date.getFullYear() + "/" +
      pad(date.getMonth() + 1) + "/" +
      pad(date.getDate()) + " " +
      pad(hours) + ":" +
      pad(date.getMinutes()) + " " +
      suffix
    );
  }

  /*
   * Load MikroTik routers from the existing /api/router endpoint.
   */
  async function loadMikrotiks() {
    if (loadingMikrotiks) return;

    loadingMikrotiks = true;

    const previousValue = field.mikrotik.value;
    field.mikrotik.disabled = true;

    try {
      const data = await apiRequest("/api/router");

      const rows = Array.isArray(data)
        ? data
        : (data.routers || data.data || []);

      if (!Array.isArray(rows)) {
        throw new Error("MikroTik API response format is invalid.");
      }

      mikrotikRecords = rows;

      field.mikrotik.replaceChildren();

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = rows.length
        ? "Select MikroTik"
        : "No MikroTik routers found";

      field.mikrotik.appendChild(placeholder);

      rows.forEach(function (router) {
        const id = Number(router.id);

        if (!Number.isInteger(id) || id < 1) return;

        const option = document.createElement("option");
        option.value = String(id);

        const name = String(router.name || "MikroTik");
        const ip = String(router.ip || "");

        option.textContent = ip
          ? `${name} (${ip})`
          : name;

        field.mikrotik.appendChild(option);
      });

      if (
        previousValue &&
        Array.from(field.mikrotik.options).some(
          option => option.value === String(previousValue)
        )
      ) {
        field.mikrotik.value = String(previousValue);
      }
    } catch (error) {
      field.mikrotik.replaceChildren();

      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Failed to load MikroTik";
      field.mikrotik.appendChild(option);

      showMessage(
        "MikroTik router list load failed: " + error.message,
        "danger"
      );
    } finally {
      field.mikrotik.disabled = false;
      loadingMikrotiks = false;
    }
  }

  /* ---------- Sorting ---------- */
  function sortValue(olt, key) {
    if (key === "idx") return oltRecords.indexOf(olt) + 1;

    if (key === "createdAt") {
      const t = new Date(olt.createdAt).getTime();
      return Number.isNaN(t) ? 0 : t;
    }

    return olt[key] ?? "";
  }

  function updateSortIcons() {
    sortHeaders.forEach(function (th) {
      const icon = th.querySelector(".olt-sort");
      if (!icon) return;

      icon.textContent = th.dataset.sort === sortKey
        ? (sortDir === 1 ? "\u2191" : "\u2193")
        : "\u2193\u2191";
    });
  }

  function renderTable() {
    const term = searchInput.value.trim().toLowerCase();

    const filtered = oltRecords.filter(function (olt) {
      return [
        olt.vendor,
        olt.name,
        olt.pon,
        olt.username,
        olt.host,
        olt.port,
        olt.mikrotik_name,
        formatDate(olt.createdAt)
      ].some(function (value) {
        return String(value ?? "").toLowerCase().includes(term);
      });
    });

    if (sortKey) {
      const collator = new Intl.Collator(undefined, {
        numeric: true,
        sensitivity: "base"
      });

      filtered.sort(function (a, b) {
        const x = sortValue(a, sortKey);
        const y = sortValue(b, sortKey);

        const result = (typeof x === "number" && typeof y === "number")
          ? x - y
          : collator.compare(String(x), String(y));

        return result * sortDir;
      });
    }

    updateSortIcons();

    totalCount.textContent = String(oltRecords.length);

    if (!filtered.length) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="9" class="olt-empty">
            ${oltRecords.length
              ? "No matching OLT found."
              : "No OLT records found."}
          </td>
        </tr>`;
      return;
    }

    tableBody.innerHTML = filtered.map(function (olt, index) {
      return `
        <tr data-olt-id="${olt.id}">
          <td>${index + 1}</td>
          <td><span class="olt-vendor">${escapeHtml(olt.vendor || "Unknown")}</span></td>
          <td class="olt-name">${escapeHtml(olt.name)}</td>
          <td>${escapeHtml(olt.pon)}</td>
          <td>${escapeHtml(olt.username)}</td>
          <td>${escapeHtml(olt.host)}</td>
          <td>${escapeHtml(olt.port)}</td>
          <td class="olt-created olt-muted">${escapeHtml(formatDate(olt.createdAt))}</td>
          <td class="olt-action">
            <div class="olt-actions">
              <button type="button" class="olt-act solid"
                data-action="check" data-id="${olt.id}"
                title="Test Connection">
                <i class="fa-solid fa-plug"></i>
              </button>

              <button type="button" class="olt-act outline"
                data-action="sync-customers" data-id="${olt.id}"
                title="Sync Customers &amp; Mapping">
                <i class="fa-solid fa-arrows-rotate"></i>
              </button>

              <div class="dropdown">
                <button type="button" class="olt-dots"
                  data-bs-toggle="dropdown"
                  data-bs-popper-config='{"strategy":"fixed"}'
                  aria-expanded="false" title="More">
                  <i class="fa-solid fa-ellipsis"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end olt-menu">
                  <li>
                    <button type="button" class="dropdown-item"
                      data-action="edit" data-id="${olt.id}">
                      <i class="fa-solid fa-pen"></i>Edit
                    </button>
                  </li>
                  <li>
                    <button type="button" class="dropdown-item"
                      data-action="delete" data-id="${olt.id}">
                      <i class="fa-solid fa-box-archive"></i>Delete
                    </button>
                  </li>
                </ul>
              </div>
            </div>
          </td>
        </tr>`;
    }).join("");
  }

  async function loadOlts() {
    if (loading) return;

    loading = true;

    tableBody.innerHTML = `
      <tr>
        <td colspan="9" class="olt-empty">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Loading OLTs...
        </td>
      </tr>`;

    try {
      const data = await apiRequest("/api/olt");

      const rows = Array.isArray(data)
        ? data
        : (data.olts || data.data || null);

      if (!rows) {
        throw new Error("OLT API response format is not recognized.");
      }

      oltRecords = rows.map(normalizeOlt);
      renderTable();
    } catch (error) {
      oltRecords = [];
      renderTable();

      showMessage(
        error.message || "Failed to load OLTs.",
        "danger"
      );
    } finally {
      loading = false;
    }
  }

  async function openAddModal() {
    editingOltId = null;
    oltForm.reset();

    await loadMikrotiks();

    field.mikrotik.value = "";
    field.vendor.value = "";
    field.pon.value = "";
    field.password.value = "";
    field.password.required = true;

    document.getElementById("oltPasswordHint").textContent = "";

    field.port.value = "23";

    document.getElementById("oltModalTitle").textContent = "Create OLT";
    oltForm.querySelector('[type="submit"]').textContent = "Submit";

    oltModal.show();
  }

  async function openEditModal(id) {
    const olt = oltRecords.find(item => item.id === id);

    if (!olt) {
      showMessage("OLT record not found.", "warning");
      return;
    }

    await loadMikrotiks();

    editingOltId = id;

    field.mikrotik.value = String(olt.mikrotik_id || "");
    field.vendor.value = olt.vendor;
    field.name.value = olt.name;
    field.pon.value = String(olt.pon);
    field.username.value = olt.username;
    field.host.value = olt.host;
    field.port.value = olt.port;

    field.password.value = "";
    field.password.required = false;

    document.getElementById("oltPasswordHint").textContent =
      "(leave blank to keep current)";

    document.getElementById("oltModalTitle").textContent = "Edit OLT";
    oltForm.querySelector('[type="submit"]').textContent = "Update";

    oltModal.show();
  }

  async function getCsrfToken() {
    const data = await apiRequest("/api/csrf-token");
    const token = data.csrfToken || data.csrf_token || data.token;

    if (!token) {
      throw new Error("CSRF token পাওয়া যায়নি।");
    }

    return token;
  }

  async function saveOlt(event) {
    event.preventDefault();

    if (saving || !oltForm.reportValidity()) return;

    saving = true;

    const submitButton = oltForm.querySelector('[type="submit"]');
    const originalText = submitButton.textContent;

    submitButton.disabled = true;
    submitButton.textContent = "Saving...";

    try {
      const token = await getCsrfToken();

      const payload = {
        mikrotik_id: field.mikrotik.value
          ? Number(field.mikrotik.value)
          : null,
        vendor: field.vendor.value,
        name: field.name.value.trim(),
        pon_ports: Number(field.pon.value),
        username: field.username.value.trim(),
        ip: field.host.value.trim(),
        port: Number(field.port.value),
        snmp_version: field.snmpVersion.value,
        community: field.community.value.trim(),
        csrf_token: token
      };

      if (field.password.value !== "") {
        payload.password = field.password.value;
      }

      const isEdit = editingOltId !== null;

      const url = isEdit
        ? "/api/olt/" + editingOltId
        : "/api/olt";

      const result = await apiRequest(url, {
        method: isEdit ? "PUT" : "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": token
        },
        body: JSON.stringify(payload)
      });

      oltModal.hide();

      showMessage(
        result.message ||
          (isEdit
            ? "OLT updated successfully."
            : "OLT added successfully."),
        "success"
      );

      await loadOlts();
    } catch (error) {
      showMessage(
        error.message || "Could not save OLT.",
        "danger"
      );
    } finally {
      saving = false;
      submitButton.disabled = false;
      submitButton.textContent = originalText;
    }
  }

  async function runOltAction(action, id, button) {
    if (!Number.isInteger(id) || id < 1) return;
    if (busyActions.has(id)) return;

    if (action === "edit") {
      await openEditModal(id);
      return;
    }

    if (
      action === "delete" &&
      !confirm("এই OLT delete করতে চাও? ONU ও customer mapping থেকে যাবে।")
    ) {
      return;
    }

    busyActions.add(id);

    if (button) button.disabled = true;

    try {
      const token = await getCsrfToken();
      let result;

      if (action === "delete") {
        result = await apiRequest("/api/olt/" + id, {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": token
          },
          body: JSON.stringify({
            confirm: true,
            csrf_token: token
          })
        });
      } else {
        result = await apiRequest(
          "/api/olt/" + id + "/" +
            (action === "sync-customers" ? "sync/customers" : action),
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRF-Token": token
            },
            body: JSON.stringify({
              csrf_token: token
            })
          }
        );
      }

      showMessage(
        result.message || "Action completed successfully.",
        "success"
      );

      await loadOlts();
    } catch (error) {
      showMessage(
        error.message || "OLT action failed.",
        "danger"
      );
    } finally {
      busyActions.delete(id);
      if (button) button.disabled = false;
    }
  }

  document.getElementById("addOltBtn")
    .addEventListener("click", openAddModal);

  document.getElementById("refreshTopBtn")
    .addEventListener("click", loadOlts);

  document.getElementById("reloadTopBtn")
    .addEventListener("click", loadOlts);

  document.getElementById("toggleOltPassword")
    .addEventListener("click", function () {
      const showing = field.password.type === "text";

      field.password.type = showing ? "password" : "text";

      this.innerHTML = showing
        ? '<i class="fa-solid fa-eye"></i>'
        : '<i class="fa-solid fa-eye-slash"></i>';
    });

  sortHeaders.forEach(function (th) {
    th.addEventListener("click", function () {
      const key = th.dataset.sort;

      if (sortKey === key) {
        sortDir = -sortDir;
      } else {
        sortKey = key;
        sortDir = 1;
      }

      renderTable();
    });
  });

  searchInput.addEventListener("input", renderTable);
  oltForm.addEventListener("submit", saveOlt);

  tableBody.addEventListener("click", function (event) {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    runOltAction(
      button.dataset.action,
      Number(button.dataset.id),
      button
    );
  });

  loadOlts();
  loadMikrotiks();
})();
</script>
