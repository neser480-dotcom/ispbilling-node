<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLT List | ISP Billing</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
  <style>
    .main-content { margin-top: 60px; }

    .olt-list-page {
      width: 100%;
      min-width: 0;
      padding: 20px;
      color: #1f2937;
    }

    .olt-list-page,
    .olt-list-page * { box-sizing: border-box; }

    .olt-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 15px 20px;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .olt-heading h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .olt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 6px;
      background: #fff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .olt-btn:hover { background: #f8fafc; }

    .olt-btn-primary {
      color: #fff;
      border-color: #fff;
      background: #2563eb;
    }

    .olt-btn-primary:hover {
      background: #1d4ed8;
      color: #fff;
    }

    .olt-summary {
      display: flex !important;
      align-items: center;
      justify-content: space-between !important;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 18px;
      margin-bottom: 15px;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
    }

    .olt-summary-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
    }

    .olt-badge {
      display: inline-grid;
      place-items: center;
      padding: 2px 10px;
      background: rgba(255,255,255,.2);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .olt-list-page .olt-search {
      position: relative;
      width: 300px;
      max-width: 100%;
      margin-left: auto !important;
      margin-right: 0 !important;
      flex: 0 1 300px;
    }

    .olt-search i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      font-size: 13px;
    }

    .olt-search input {
      display: block;
      width: 100%;
      height: 36px;
      padding: 6px 12px 6px 36px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      background: #fff;
    }

    .olt-search input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    .olt-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .olt-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .olt-table {
      width: 100%;
      min-width: 1050px;
      margin: 0;
      border-collapse: collapse;
      white-space: nowrap;
    }

    .olt-table th {
      padding: 12px;
      background: #f9fafb;
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border-bottom: 1px solid #e5e7eb;
    }

    .olt-table td {
      padding: 12px;
      border-bottom: 1px solid #f0f1f3;
      vertical-align: middle;
      font-size: 13px;
    }

    .olt-table tbody tr:hover { background: #fafcff; }

    .olt-vendor {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      font-weight: 600;
    }

    .olt-name { color: #111827; font-weight: 600; }
    .olt-muted { color: #6b7280; }
    .olt-actions { display: flex; gap: 6px; }

    .olt-icon-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .olt-icon-btn:hover { opacity: .9; }
    .olt-icon-btn:disabled { opacity: .55; cursor: wait; }

    .olt-empty {
      padding: 40px 15px !important;
      text-align: center;
      color: #6b7280;
    }

    #oltModal .modal-dialog { max-width: 600px; }

    #oltModal .modal-content {
      display: flex;
      max-height: calc(100vh - 2rem);
      overflow: hidden;
    }

    #oltModal #oltForm {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    #oltModal .modal-header,
    #oltModal .modal-footer {
      flex-shrink: 0;
      background: #fff;
    }

    #oltModal .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto !important;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Toast notifications */
    #oltToastContainer {
      position: fixed;
      top: 82px;
      right: 20px;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(390px, calc(100vw - 32px));
      pointer-events: none;
    }

    .olt-toast {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 12px;
      color: #fff;
      background: #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,.22);
      pointer-events: auto;
      overflow-wrap: anywhere;
      animation: oltToastIn .25s ease-out;
    }

    .olt-toast.success { background: #15803d; }
    .olt-toast.danger { background: #b91c1c; }
    .olt-toast.warning { background: #b45309; }
    .olt-toast.info { background: #1d4ed8; }

    .olt-toast-icon { font-size: 20px; padding-top: 1px; }
    .olt-toast-content { flex: 1; min-width: 0; }
    .olt-toast-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .olt-toast-message { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .olt-toast-close { border: 0; background: transparent; color: #fff; opacity: .8; cursor: pointer; font-size: 21px; line-height: 1; padding: 0 2px; }
    .olt-toast-close:hover { opacity: 1; }

    @keyframes oltToastIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }
    /* =========================================
   OLT LIST - DARK MODE FIX
========================================= */

}

body.dark-mode .olt-card {
    background: #1e293b;
    border-color: #334155;
    color: #e5e7eb;
}

body.dark-mode .olt-table {
    color: #e5e7eb;
}

body.dark-mode .olt-table th {
    background: #263449;
    color: #cbd5e1;
    border-bottom-color: #475569;
}

body.dark-mode .olt-table td {
    color: #e2e8f0;
    border-bottom-color: #334155;
}

body.dark-mode .olt-table tbody tr:hover {
    background: #29384d;
}

body.dark-mode .olt-name {
    color: #f1f5f9;
}

body.dark-mode .olt-muted {
    color: #94a3b8;
}

body.dark-mode .olt-vendor {
    background: #334155;
    color: #cbd5e1;
}

body.dark-mode .olt-search input,
body.dark-mode .olt-list-page input,
body.dark-mode .olt-list-page select,
body.dark-mode .olt-list-page textarea {
    background: #1e293b;
    color: #e2e8f0;
    border-color: #475569;
}

body.dark-mode .olt-list-page input::placeholder,
body.dark-mode .olt-list-page textarea::placeholder {

body.dark-mode .olt-list-page .form-control,
body.dark-mode .olt-list-page .form-select {
    background-color: #1e293b;

}

body.dark-mode .olt-list-page .form-control:focus,
body.dark-mode .olt-list-page .form-select:focus {
    background-color: #1e293b;
    color: #fff;
    border-color: #3b82f6;
    box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.2);
}

body.dark-mode .olt-list-page .modal-content {
    background: #1e293b;
    color: #e2e8f0;
    border-color: #475569;
}

body.dark-mode .olt-list-page .modal-header,
body.dark-mode .olt-list-page .modal-footer {
    background: #263449;
    border-color: #475569;
}

body.dark-mode .olt-list-page .modal-title {
    color: #f1f5f9;
}

body.dark-mode .olt-list-page .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
}

body.dark-mode .olt-list-page .dropdown-menu {
    background: #1e293b;
    border-color: #475569;
}

body.dark-mode .olt-list-page .dropdown-item {
    color: #e2e8f0;
}

body.dark-mode .olt-list-page .dropdown-item:hover {
    background: #334155;
    color: #fff;
}

body.dark-mode .olt-list-page .text-dark {
    color: #e2e8f0 !important;
}

body.dark-mode .olt-list-page .bg-white {
    background-color: #1e293b !important;
}

body.dark-mode .olt-list-page hr {
    border-color: #475569;
}
  </style>
</head>

<body>
  <div id="sidebarContainer"></div>
  <div id="topbarContainer"></div>

  <div class="main-content">
    <main class="olt-list-page">

      <div class="olt-heading">
        <h2>OLT</h2>
        <div class="d-flex gap-2">
          <button type="button" class="olt-btn" id="refreshTopBtn" title="Refresh">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <button type="button" class="olt-btn olt-btn-primary" id="addOltBtn" title="Add OLT">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button type="button" class="olt-btn" id="reloadTopBtn" title="Reload">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </div>

      <section class="olt-summary">
        <div class="olt-summary-left">
          <i class="fa-solid fa-gear"></i>
          Total Data:
          <span class="olt-badge" id="totalOltCount">0</span>
        </div>

        <div class="olt-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="oltSearch" placeholder="Search" autocomplete="off" aria-label="Search OLTs">
        </div>
      </section>

      <section class="olt-card">
        <div class="olt-table-wrap">
          <table class="olt-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Vendor</th>
                <th>Name</th>
                <th>PON</th>
                <th>User Name</th>
                <th>Host</th>
                <th>Port</th>
                <th>Created At</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="oltTableBody">
              <tr>
                <td colspan="9" class="olt-empty">Loading OLTs...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Add/Edit OLT Modal -->
  <div class="modal fade olt-modal" id="oltModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="oltForm">
          <div class="modal-header">
            <h5 class="modal-title" id="oltModalTitle">Create OLT</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltMikrotik">Select MikroTik <span class="text-danger">*</span></label>
              <select class="form-select" id="oltMikrotik" required>
                <option value="">Select MikroTik</option>
                <!-- আপনার ব্যাকএন্ড থেকে ডাইনামিক অপশন এখানে আসবে -->
              </select>
            </div>

            <div class="mb-3">
<label class="form-label fw-semibold" for="oltVendor">
  Select OLT Vendor <span class="text-danger">*</span>
</label>
<select class="form-select" id="oltVendor" required>
  <option value="">Select OLT Vendor</option>
  <option value="CData EPon">CData</option>
  <option value="ECom EPon">ECom</option>
  <option value="V-SOL">V-SOL</option>
  <option value="BDCOM">BDCOM</option>
  <option value="Huawei">Huawei</option>
  <option value="ZTE">ZTE</option>
  <option value="FiberHome">FiberHome</option>
  <option value="Raisecom">Raisecom</option>
  <option value="Nokia">Nokia</option>
  <option value="TP-Link">TP-Link</option>
  <option value="Other">Other</option>
</select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltName">Name <span class="text-danger">*</span></label>
              <input class="form-control" id="oltName" maxlength="150" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltPon">PON Port <span class="text-danger">*</span></label>
              <select class="form-select" id="oltPon" required>
                <option value="">Select PON Port</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltUsername">OLT User Name <span class="text-danger">*</span></label>
              <input class="form-control" id="oltUsername" autocomplete="username" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltPassword">
                OLT User Password <span class="text-danger">*</span>
                <span class="text-muted fw-normal" id="oltPasswordHint"></span>

              <div class="input-group">
                <input class="form-control" id="oltPassword" type="password" autocomplete="new-password">

              <label class="form-label fw-semibold" for="oltHost">OLT IP <span class="text-danger">*</span></label>
              <input class="form-control" id="oltHost" autocomplete="off" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="oltPort">OLT Port <span class="text-danger">*</span></label>
              <input class="form-control" id="oltPort" type="number" min="1" max="65535" required>
            </div>

            <input type="hidden" id="oltCommunity" value="public">
          </div>

          <div class="modal-footer">

            <button type="submit" class="btn btn-success btn-sm">Submit</button>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/sidebar-loader.js"></script>
  <script src="/assets/js/topbar-loader.js"></script>

<script>
"use strict";

(function () {
  const tableBody = document.getElementById("oltTableBody");
  const searchInput = document.getElementById("oltSearch");
  const totalCount = document.getElementById("totalOltCount");
  const modalElement = document.getElementById("oltModal");
  const oltModal = bootstrap.Modal.getOrCreateInstance(modalElement);
  const oltForm = document.getElementById("oltForm");

  let oltRecords = [];
  let mikrotikRecords = [];
  let editingOltId = null;
  let loading = false;
  let loadingMikrotiks = false;
  let saving = false;

  const busyActions = new Set();

  const field = {
    mikrotik: document.getElementById("oltMikrotik"),
    vendor: document.getElementById("oltVendor"),
    name: document.getElementById("oltName"),
    pon: document.getElementById("oltPon"),
    username: document.getElementById("oltUsername"),
    password: document.getElementById("oltPassword"),
    host: document.getElementById("oltHost"),
    port: document.getElementById("oltPort"),
    snmpVersion: document.getElementById("oltSnmpVersion"),
    community: document.getElementById("oltCommunity")
  };

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  function showMessage(message, type = "info") {
    let container = document.getElementById("oltToastContainer");

    if (!container) {
      container = document.createElement("div");
      container.id = "oltToastContainer";
      container.setAttribute("aria-live", "polite");
      document.body.appendChild(container);
    }

    const allowedTypes = ["success", "danger", "warning", "info"];
    if (!allowedTypes.includes(type)) type = "info";

    const icons = {
      success: "fa-circle-check",
      danger: "fa-circle-exclamation",
      warning: "fa-triangle-exclamation",
      info: "fa-circle-info"
    };

    const titles = {
      success: "Success",
      danger: "Error",
      warning: "Warning",
      info: "Information"
    };

    const toast = document.createElement("div");
    toast.className = "olt-toast " + type;

    const icon = document.createElement("i");
    icon.className = "fa-solid " + icons[type] + " olt-toast-icon";

    const content = document.createElement("div");
    content.className = "olt-toast-content";

    const title = document.createElement("div");
    title.className = "olt-toast-title";
    title.textContent = titles[type];

    const text = document.createElement("div");
    text.className = "olt-toast-message";
    text.textContent = String(message || "Operation completed.");

    const close = document.createElement("button");
    close.type = "button";
    close.className = "olt-toast-close";
    close.textContent = "×";

    content.append(title, text);
    toast.append(icon, content, close);
    container.appendChild(toast);

    let timer;

    function removeToast() {
      clearTimeout(timer);
      if (toast.isConnected) toast.remove();
    }

    close.addEventListener("click", removeToast);
    timer = setTimeout(removeToast, type === "danger" ? 7000 : 4000);
  }

  async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
      credentials: "same-origin",
      ...options,
      headers: { ...(options.headers || {}) }
    });

    const contentType = response.headers.get("content-type") || "";
    let data = {};

    if (contentType.includes("application/json")) {
      data = await response.json();
    } else {
      const responseText = await response.text();

      if (!response.ok) {
        throw new Error(responseText || "Request failed: " + response.status);
      }

      throw new Error("Server did not return JSON. Check the API route.");
    }

    if (
      !response.ok ||
      data.success === false ||
      data.status === false
    ) {
      throw new Error(
        data.message || data.error || "Request failed: " + response.status
      );
    }

    return data;
  }

function normalizeVendor(value) {
  const raw = String(value ?? "").trim();
  const key = raw.toLowerCase().replace(/[^a-z0-9]/g, "");

  const vendorMap = {
    cdata: "CData EPon",
    cdataepon: "CData EPon",
    ecom: "ECom EPon",
    ecomepon: "ECom EPon",
    vsol: "V-SOL",
    bdcom: "BDCOM",
    huawei: "Huawei",
    zte: "ZTE",
    fiberhome: "FiberHome",
    raisecom: "Raisecom",
    nokia: "Nokia",
    tplink: "TP-Link",
    other: "Other"
  };

  return vendorMap[key] || "Other";
}

  function normalizeOlt(row) {
    return {
      id: Number(row.id),
      mikrotik_id: row.mikrotik_id ?? row.mikrotik ?? "",
      mikrotik_name: row.mikrotik_name ?? "",
      vendor: normalizeVendor(row.vendor),
      name: row.name ?? "",
      pon: row.pon_ports ?? row.pon ?? "",
      username: row.username ?? "",
      host: row.ip ?? row.host ?? "",
      port: row.port ?? "",
      createdAt: row.created_at ?? row.createdAt ?? "",
      snmp_version: row.snmp_version ?? "v2c",
      community: row.community ?? "public"
    };
  }

  function formatDate(value) {
    if (!value) return "—";

    const date = new Date(value);

    return Number.isNaN(date.getTime())
      ? String(value)
      : date.toLocaleString();
  }

  /*
   * Load MikroTik routers from the existing /api/router endpoint.
   */
  async function loadMikrotiks() {
    if (loadingMikrotiks) return;

    loadingMikrotiks = true;

    const previousValue = field.mikrotik.value;
    field.mikrotik.disabled = true;

    try {
      const data = await apiRequest("/api/router");

      const rows = Array.isArray(data)
        ? data
        : (data.routers || data.data || []);

      if (!Array.isArray(rows)) {
        throw new Error("MikroTik API response format is invalid.");
      }

      mikrotikRecords = rows;

      field.mikrotik.replaceChildren();

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = rows.length
        ? "Select MikroTik"
        : "No MikroTik routers found";

      field.mikrotik.appendChild(placeholder);

      rows.forEach(function (router) {
        const id = Number(router.id);

        if (!Number.isInteger(id) || id < 1) return;

        const option = document.createElement("option");
        option.value = String(id);

        const name = String(router.name || "MikroTik");
        const ip = String(router.ip || "");

        option.textContent = ip
          ? `${name} (${ip})`
          : name;

        field.mikrotik.appendChild(option);
      });

      if (
        previousValue &&
        Array.from(field.mikrotik.options).some(
          option => option.value === String(previousValue)
        )
      ) {
        field.mikrotik.value = String(previousValue);
      }
    } catch (error) {
      field.mikrotik.replaceChildren();

      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Failed to load MikroTik";
      field.mikrotik.appendChild(option);

      showMessage(
        "MikroTik router list load failed: " + error.message,
        "danger"
      );
    } finally {
      field.mikrotik.disabled = false;
      loadingMikrotiks = false;
    }
  }

  function renderTable() {
    const term = searchInput.value.trim().toLowerCase();

    const filtered = oltRecords.filter(function (olt) {
      return [
        olt.vendor,
        olt.name,
        olt.pon,
        olt.username,
        olt.host,
        olt.port,
        olt.mikrotik_name,
        olt.createdAt
      ].some(function (value) {
        return String(value ?? "").toLowerCase().includes(term);
      });
    });

    totalCount.textContent = String(oltRecords.length);

    if (!filtered.length) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="9" class="olt-empty">
            ${oltRecords.length
              ? "No matching OLT found."
              : "No OLT records found."}
          </td>
        </tr>`;
      return;
    }

    tableBody.innerHTML = filtered.map(function (olt, index) {
      return `
        <tr data-olt-id="${olt.id}">
          <td>${index + 1}</td>
          <td>
            <span class="olt-vendor">
              ${escapeHtml(olt.vendor || "Unknown")}
            </span>
          </td>
          <td class="olt-name">${escapeHtml(olt.name)}</td>
          <td>${escapeHtml(olt.pon)}</td>
          <td>${escapeHtml(olt.username)}</td>
          <td>${escapeHtml(olt.host)}</td>
          <td>${escapeHtml(olt.port)}</td>
          <td class="olt-muted">${escapeHtml(formatDate(olt.createdAt))}</td>
          <td>
            <div class="olt-actions">
              <button type="button" class="olt-icon-btn"
                data-action="check" data-id="${olt.id}"
                title="Test Connection">
                <i class="fa-solid fa-plug"></i>
              </button>

              <button type="button" class="olt-icon-btn"
                data-action="sync-customers" data-id="${olt.id}"
                title="Sync Customers &amp; Mapping">
                <i class="fa-solid fa-rotate"></i>
              </button>

              <button type="button" class="olt-icon-btn"
                data-action="edit" data-id="${olt.id}"
                title="Edit OLT">
                <i class="fa-solid fa-pen"></i>
              </button>

              <button type="button" class="olt-icon-btn"
                data-action="delete" data-id="${olt.id}"
                title="Delete OLT">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>`;
    }).join("");
  }

  async function loadOlts() {
    if (loading) return;

    loading = true;

    tableBody.innerHTML = `
      <tr>
        <td colspan="9" class="olt-empty">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Loading OLTs...
        </td>
      </tr>`;

    try {
      const data = await apiRequest("/api/olt");

      const rows = Array.isArray(data)
        ? data
        : (data.olts || data.data || null);

      if (!rows) {
        throw new Error("OLT API response format is not recognized.");
      }

      oltRecords = rows.map(normalizeOlt);
      renderTable();
    } catch (error) {
      oltRecords = [];
      renderTable();

      showMessage(
        error.message || "Failed to load OLTs.",
        "danger"
      );
    } finally {
      loading = false;
    }
  }

  async function openAddModal() {
    editingOltId = null;
    oltForm.reset();

    await loadMikrotiks();

    field.mikrotik.value = "";
    field.vendor.value = "";
    field.pon.value = "";
    field.password.value = "";
    field.password.required = true;

    document.getElementById("oltPasswordHint").textContent = "";

    field.port.value = "23";

    document.getElementById("oltModalTitle").textContent = "Create OLT";
    oltForm.querySelector('[type="submit"]').textContent = "Submit";

    oltModal.show();
  }

  async function openEditModal(id) {
    const olt = oltRecords.find(item => item.id === id);

    if (!olt) {
      showMessage("OLT record not found.", "warning");
      return;
    }

    await loadMikrotiks();

    editingOltId = id;

    field.mikrotik.value = String(olt.mikrotik_id || "");
    field.vendor.value = olt.vendor;
    field.name.value = olt.name;
    field.pon.value = String(olt.pon);
    field.username.value = olt.username;
    field.host.value = olt.host;
    field.port.value = olt.port;

    field.password.value = "";
    field.password.required = false;

    document.getElementById("oltPasswordHint").textContent =
      "(leave blank to keep current)";

    document.getElementById("oltModalTitle").textContent = "Edit OLT";
    oltForm.querySelector('[type="submit"]').textContent = "Update";

    oltModal.show();
  }

  async function getCsrfToken() {
    const data = await apiRequest("/api/csrf-token");
    const token = data.csrfToken || data.csrf_token || data.token;

    if (!token) {
      throw new Error("CSRF token পাওয়া যায়নি।");
    }

    return token;
  }

  async function saveOlt(event) {
    event.preventDefault();

    if (saving || !oltForm.reportValidity()) return;

    saving = true;

    const submitButton = oltForm.querySelector('[type="submit"]');
    const originalText = submitButton.textContent;

    submitButton.disabled = true;
    submitButton.textContent = "Saving...";

    try {
      const token = await getCsrfToken();

      const payload = {
        mikrotik_id: field.mikrotik.value
          ? Number(field.mikrotik.value)
          : null,
        vendor: field.vendor.value,
        name: field.name.value.trim(),
        pon_ports: Number(field.pon.value),
        username: field.username.value.trim(),
        ip: field.host.value.trim(),
        port: Number(field.port.value),
        snmp_version: field.snmpVersion.value,
        community: field.community.value.trim(),
        csrf_token: token
      };

      if (field.password.value !== "") {
        payload.password = field.password.value;
      }

      const isEdit = editingOltId !== null;

      const url = isEdit
        ? "/api/olt/" + editingOltId
        : "/api/olt";

      const result = await apiRequest(url, {
        method: isEdit ? "PUT" : "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": token
        },
        body: JSON.stringify(payload)
      });

      oltModal.hide();

      showMessage(
        result.message ||
          (isEdit
            ? "OLT updated successfully."
            : "OLT added successfully."),
        "success"
      );

      await loadOlts();
    } catch (error) {
      showMessage(
        error.message || "Could not save OLT.",
        "danger"
      );
    } finally {
      saving = false;
      submitButton.disabled = false;
      submitButton.textContent = originalText;
    }
  }

  async function runOltAction(action, id, button) {
    if (!Number.isInteger(id) || id < 1) return;
    if (busyActions.has(id)) return;

    if (action === "edit") {
      await openEditModal(id);
      return;
    }

    if (
      action === "delete" &&
      !confirm("এই OLT delete করতে চাও? ONU ও customer mapping থেকে যাবে।")
    ) {
      return;
    }

    busyActions.add(id);

    if (button) button.disabled = true;

    try {
      const token = await getCsrfToken();
      let result;

      if (action === "delete") {
        result = await apiRequest("/api/olt/" + id, {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": token
          },
          body: JSON.stringify({
            confirm: true,
            csrf_token: token
          })
        });
      } else {
        result = await apiRequest(
          "/api/olt/" + id + "/" +
            (action === "sync-customers" ? "sync/customers" : action),
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRF-Token": token
            },
            body: JSON.stringify({
              csrf_token: token
            })
          }
        );
      }

      showMessage(
        result.message || "Action completed successfully.",
        "success"
      );

      await loadOlts();
    } catch (error) {
      showMessage(
        error.message || "OLT action failed.",
        "danger"
      );
    } finally {
      busyActions.delete(id);
      if (button) button.disabled = false;
    }
  }

  document.getElementById("addOltBtn")
    .addEventListener("click", openAddModal);

  document.getElementById("refreshTopBtn")
    .addEventListener("click", loadOlts);

  document.getElementById("reloadTopBtn")
    .addEventListener("click", loadOlts);

  document.getElementById("toggleOltPassword")
    .addEventListener("click", function () {
      const showing = field.password.type === "text";

      field.password.type = showing ? "password" : "text";

      this.innerHTML = showing
        ? '<i class="fa-solid fa-eye"></i>'
        : '<i class="fa-solid fa-eye-slash"></i>';
    });

  searchInput.addEventListener("input", renderTable);
  oltForm.addEventListener("submit", saveOlt);

  tableBody.addEventListener("click", function (event) {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    runOltAction(
      button.dataset.action,
      Number(button.dataset.id),
      button
    );
  });

  loadOlts();
  loadMikrotiks();
})();
</script>
</body>
</html>
