    <style>
        :root {
            --olt-blue: #3288df;
            --olt-blue-dark: #2476cb;
            --olt-text: #344054;
            --olt-muted: #667085;
            --olt-border: #e7ebf0;
            --olt-surface: #fff;
            --olt-page-bg: #f5f7fb;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; max-width: 100%; margin: 0; }
        body {
            overflow-x: clip;
            background: var(--olt-page-bg);
            color: var(--olt-text);
            font-family: "Hind Siliguri", "Noto Sans Bengali", "Segoe UI", Arial, sans-serif;
            font-size: 15px;
        }
        .main-content {
            min-width: 0; max-width: 100%; margin-left: 260px; margin-top: 70px;
            transition: margin-left .3s;
        }
        @media (max-width: 992px) { .main-content { margin-left: 0; } }
        @media (max-width: 768px) { .main-content { margin-top: 65px; } }
        .olt-page { width: 100%; min-width: 0; max-width: 1800px; margin: 0 auto; padding: 16px; }
        .olt-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 18px 20px; color: #fff; background: #3288df; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .olt-header h1 { margin: 0; font-size: 26px; font-weight: 500; }
        .olt-header-btn-group { display: flex; align-items: center; gap: 10px; }
        .olt-header-circle-btn {
            display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
            border: 1px solid rgba(255,255,255,.5); border-radius: 8px; color: #3288df;
            background: #fff; font-size: 14px; cursor: pointer; transition: background .2s;
        }
        .olt-header-circle-btn:hover { background: #eef6ff; }
        .olt-header-circle-btn:disabled { opacity: .6; cursor: wait; }
        .olt-filter-panel {
            display: none; margin-top: 12px; padding: 16px; background: #f0f7ff;
            border: 1px solid #b3d4fc; border-radius: 8px;
        }
        .olt-filter-panel.active { display: block; }
        .olt-filter-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; align-items: end;
        }
        .olt-filter-group { display: flex; flex-direction: column; gap: 5px; }
        .olt-filter-group label { font-size: 12px; font-weight: 600; color: #1d2939; }
        .olt-filter-group input, .olt-filter-group select {
            height: 36px; padding: 6px 10px; border: 1px solid #b3d4fc;
            border-radius: 6px; outline: none; font-size: 12px; background: #fff;
        }
        .olt-filter-actions { display: flex; gap: 8px; }
        .olt-btn {
            height: 36px; padding: 0 16px; border-radius: 6px; font-size: 12px;
            font-weight: 600; border: none; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .olt-btn-primary { background: #3288df; color: #fff; }
        .olt-btn-primary:hover { background: #2476cb; }
        .olt-btn-secondary { background: #e4e7ec; color: #344054; }
        .olt-btn-secondary:hover { background: #d0d5dd; }
        .olt-content {
            min-width: 0; margin-top: 16px; padding: 16px; background: var(--olt-surface);
            border: 1px solid var(--olt-border); border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.02);
        }
        .olt-summary {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
            gap: 12px; padding: 12px 16px; color: #fff; background: #3288df; border-radius: 8px;
        }
        .olt-summary-title {
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
            font-size: 14px; font-weight: 600;
        }
        .olt-summary-number { padding: 3px 12px; border-radius: 12px; background: #2570be; font-size: 13px; font-weight: 700; }
        .olt-controls { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex: 1; min-width: 0; }
        .olt-search { width: min(300px, 60%); margin: 0; }
        .olt-search input {
            display: block; width: 100%; height: 36px; padding: 6px 12px; color: #fff;
            background: #297acb; border: 1px solid rgba(255,255,255,.4);
            border-radius: 6px; outline: none; font-size: 13px;
        }
        .olt-search input { border: 0; }
        .olt-search input::placeholder { color: rgba(255,255,255,.8); }
        .olt-search input:focus { background: #fff; color: #333; border-color: #fff; }
        .olt-table-scroll { width: 100%; margin-top: 16px; overflow-x: auto; }
        .olt-table { width: 100%; margin: 0; border-collapse: collapse; }
        .olt-table { --bs-table-bg: transparent; }
        .olt-table th {
            padding: 12px 8px; color: #444; background: #fff; font-size: 15px;
            font-weight: 600; text-align: left; line-height: 1.6; border-bottom: 0;
            vertical-align: bottom;
        }
        .olt-table td {
            padding: 12px 8px; font-size: 15px; line-height: 1.6; color: #555;
            vertical-align: middle; border-bottom: 0; background: transparent;
        }
        .olt-table tbody tr:nth-child(odd) { background: #f2f2f2; }
        .olt-table tbody tr:nth-child(even) { background: #fff; }
        .olt-table tbody tr:hover { background: #e9f2fc; }
        .olt-table td:first-child { text-align: center; }
        .olt-sort-button {
            border: 0; background: transparent; padding: 0; font: inherit; color: inherit;
            cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
        }
        .olt-sort-button { text-align: left; font-weight: 600; }
        .olt-sort-mark { color: #3288df; font-size: 14px; white-space: nowrap; }
        .olt-primary-text { display: block; color: inherit; font-size: inherit; font-weight: 400; overflow-wrap: anywhere; }
        .olt-sub-text { display: block; margin-top: 0; color: inherit; font-size: inherit; white-space: nowrap; }
        .olt-mac { display: block; color: inherit; font-size: inherit; font-family: inherit; white-space: nowrap; }
        .olt-field-label { display: inline-block; min-width: 54px; color: #98a2b3; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
        .olt-metric { display: block; white-space: nowrap; }
        .olt-metric + .olt-metric { margin-top: 0; }
        .olt-metric-value { color: inherit; font-weight: 400; font-variant-numeric: tabular-nums; }
        .olt-unlinked { color: #b54708; background: #fffaeb; border: 1px solid #fedf89; border-radius: 5px; padding: 3px 6px; font-size: 10px; font-weight: 700; display: inline-block; }
        .olt-port-badge { display: inline-block; padding: 3px 7px; border-radius: 5px; background: #eff8ff; color: #175cd3; font-size: 11px; font-weight: 700; }
        .olt-status {
            display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px;
            font-weight: 700; margin-top: 4px; text-align: center; text-transform: lowercase;
        }
        .olt-status.online { color: #fff; background: #198754; }
        .olt-status.offline { color: #fff; background: #f04438; }
        .olt-status.warning { color: #fff; background: #f79009; }
        .olt-status.unknown { color: #fff; background: #667085; }
        .olt-action-icon-btn {
            display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
            border: 1px solid #3288df; background: #fff; color: #3288df; border-radius: 6px;
            cursor: pointer; transition: all .2s;
        }
        .olt-action-icon-btn:hover { background: #3288df; color: #fff; }
        .olt-action-icon-btn:disabled { opacity: .55; cursor: wait; }
        .olt-empty { padding: 40px 15px !important; color: var(--olt-muted); text-align: center; }
        .olt-footer { padding: 16px 0 0; color: #98a2b3; font-size: 12px; text-align: center; }
        .olt-message {
            display: none; margin-top: 12px; padding: 10px 14px; border: 1px solid transparent;
            border-radius: 6px; font-size: 13px;
        }
        .olt-message.error, .olt-message.info, .olt-message.success { display: block; }
        .olt-message.error { color: #842029; background: #f8d7da; border-color: #f5c2c7; }
        .olt-message.info { color: #084298; background: #cfe2ff; border-color: #b6d4fe; }
        .olt-message.success { color: #0f5132; background: #d1e7dd; border-color: #a3cfbb; }
        .olt-ppp { display:block; color: inherit; font-size: inherit; white-space: nowrap; }
        .olt-person + .olt-person { margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e4e7ec; }

/* OLT Users Pagination */
.olt-pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
    padding: 12px 0;
    border-top: 1px solid var(--olt-border);
}

.olt-pagination-info {
    color: var(--olt-muted);
    font-size: 12px;
    font-weight: 500;
}

.olt-pagination-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 6px;
}

.olt-pagination-controls label {
    color: var(--olt-muted);
    font-size: 12px;
}

.olt-pagination-controls select {
    height: 32px;
    padding: 4px 8px;
    border: 1px solid var(--olt-border);
    border-radius: 6px;
    background: #fff;
    color: var(--olt-text);
    font-size: 12px;
    outline: none;
}

.olt-page-btn,
.olt-page-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--olt-border);
    border-radius: 6px;
    background: #fff;
    color: var(--olt-text);
    font-size: 12px;
    cursor: pointer;
    transition: .2s ease;
}

.olt-page-btn:hover:not(:disabled),
.olt-page-number:hover {
    color: var(--olt-blue);
    border-color: var(--olt-blue);
    background: #f0f7ff;
}

.olt-page-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.olt-page-numbers {
    display: flex;
    align-items: center;
    gap: 4px;
}

.olt-page-number.active {
    color: #fff;
    background: var(--olt-blue);
    border-color: var(--olt-blue);
    font-weight: 700;
}

.olt-page-ellipsis {
    padding: 0 3px;
    color: var(--olt-muted);
}

@media (max-width: 600px) {
    .olt-pagination {
        align-items: flex-start;
        flex-direction: column;
    }

    .olt-pagination-controls {
        justify-content: flex-start;
        width: 100%;
    }

    .olt-page-btn,
    .olt-page-number {
        min-width: 30px;
        height: 30px;
    }
}

/* --------------------------------------------------
   HELPERS
-------------------------------------------------- */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function displayValue(value, suffix = "") {
    return value === null || value === undefined || value === ""
        ? "—"
        : `${value}${suffix}`;
}

// Plain numbers with two decimals (e.g. -21.14, 3.31, 50.00), no units.
function fixed2(value) {
    if (value === null || value === undefined || value === "") return "—";

    const number = Number(value);

    return Number.isFinite(number) ? number.toFixed(2) : String(value);
}

function showMessage(text, type = "info") {
    message.textContent = text;
    message.className = `olt-message ${type}`;
}

function clearMessage() {
    message.textContent = "";
    message.className = "olt-message";
}

async function parseResponse(response) {
    let result;

    try {
        result = await response.json();
    } catch (_) {
        throw new Error(
            `Invalid server response (HTTP ${response.status}).`
        );
    }

    if (!response.ok || result.success === false) {
        throw new Error(
            result.message || `Request failed (HTTP ${response.status}).`
        );
    }

    return result;
}

async function apiGet(url) {
    const response = await fetch(url, {
        method: "GET",
        credentials: "same-origin",
        headers: {
            Accept: "application/json"
        }
    });

    return parseResponse(response);
}

async function getCsrfToken() {
    const result = await apiGet("/api/csrf-token");

    const token =
        result.csrfToken ||
        result.csrf_token ||
        result.token;

    if (!token) {
        throw new Error(
            "CSRF token পাওয়া যায়নি। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।"
        );
    }

    return token;
}

async function apiPost(url, payload = {}) {
    const token = await getCsrfToken();

    const response = await fetch(url, {
        method: "POST",
        credentials: "same-origin",
        headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
            "X-CSRF-Token": token
        },
        body: JSON.stringify({
            ...payload,
            csrf_token: token
        })
    });

    return parseResponse(response);
}

async function apiDelete(url) {
    const token = await getCsrfToken();

    const response = await fetch(url, {
        method: "DELETE",
        credentials: "same-origin",
        headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
            "X-CSRF-Token": token
        },
        body: JSON.stringify({ csrf_token: token })
    });

    return parseResponse(response);
}

function mappingSummary(m) {
    if (!m) return "";
    if (m.error) return ` Auto-map failed: ${m.error}`;

    return ` Auto-map → ONU: ${m.totalOnu ?? 0}, ` +
        `Linked: ${m.linked ?? m.wouldLink ?? 0}, ` +
        `Already: ${m.alreadyLinked ?? 0}, ` +
        `Manually unlinked: ${m.manuallyUnlinked ?? 0}, ` +
        `No MAC: ${m.noMac ?? 0}, ` +
        `Skipped: ${m.skippedAtWrite ?? 0}, ` +
        `Switch customers: ${m.extraLinked ?? m.wouldExtra ?? 0}` +
        (m.multiSupported === false ? " (run the onu_customer_links migration)" : "") +
        ", " +
        `Unmatched: ${m.unmatched ?? 0}, ` +
        `Ambiguous: ${(m.ambiguous ?? 0) + (m.conflicts ?? 0)}. ` +
        `PPP sessions: ${m.pppSessions ?? 0}` +
        (m.pppInfoEnabled === false
            ? " (run the onu_ppp_info migration to show caller-id MAC)"
            : ` · MikroTik info saved: ${m.pppInfoSaved ?? 0}`) +
        (m.pppErrors && m.pppErrors.length
            ? ` (PPP error: ${m.pppErrors[0]})`
            : ".");
}

function formatDate(value) {
    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;

    const formattedHours = String(hours).padStart(2, "0");

    return `${year}/${month}/${day}<br>${formattedHours}:${minutes} ${ampm}`;
}

function normalizeStatus(value) {
    const status = String(value || "unknown")
        .trim()
        .toLowerCase();

    if ([
        "online", "up", "active", "working",
        "registered", "connected", "1"
    ].includes(status)) {
        return "online";
    }

    if ([
        "offline", "down", "unregistered",
        "inactive", "0"
    ].includes(status)) {
        return "offline";
    }

    if ([
        "dying-gasp", "dying_gasp",
        "los", "losi", "warning"
    ].includes(status)) {
        return "warning";
    }

    return "unknown";
}

function statusLabel(status) {
    return {
        online: "online",
        offline: "offline",
        warning: "warning",
        unknown: "unknown"
    }[status] || "unknown";
}


/* --------------------------------------------------
   NORMALIZE ONU
-------------------------------------------------- */

function normalizeOnu(row, olt) {
    const rawStatus = normalizeStatus(
        row.status ??
        row.onu_status ??
        row.online_status
    );

    const mac =
        row.mac ||
        row.mac_address ||
        row.onu_mac ||
        row.macAddress ||
        "";

    const routerMac =
        row.router_mac ||
        row.router_mac_address ||
        row.routerMac ||
        "";

    const serial =
        row.serial ||
        row.onu_sn ||
        row.serial_number ||
        "";

    const ip =
        row.ppp_ip ||
        row.ip_address ||
        row.ip ||
        row.customer_ip ||
        "";

    const callerId = row.ppp_caller_id || "";

    const extras = Array.isArray(row.extra_customers)
        ? row.extra_customers
        : [];

    const customerName =
        row.customer_name ||
        row.mapped_customer_name ||
        "";

    const customerCode = row.customer_code || "";

    const primaryLinked =
        (
            row.matched_customer_id !== null &&
            row.matched_customer_id !== undefined &&
            row.matched_customer_id !== ""
        ) ||
        row.is_linked === true ||
        row.linked === true ||
        Boolean(customerName);

    const customerLinked = primaryLinked || extras.length > 0;
    const customerCount = (primaryLinked ? 1 : 0) + extras.length;

    const name =
        customerName ||
        row.name ||
        row.onu_name ||
        `ONU ${row.id}`;

    const pon =
        row.pon_port ??
        row.pon_no ??
        row.pon_id ??
        row.pon ??
        row.port_no ??
        row.port ??
        "";

    const lastUpdate =
        row.last_update ||
        row.updated_at ||
        row.last_seen ||
        row.last_updated ||
        "";

    const distanceRaw =
        row.distance ??
        row.distance_m ??
        row.distance_meter;

    const distance =
        distanceRaw === null ||
        distanceRaw === undefined ||
        distanceRaw === ""
            ? "—"
            : `${distanceRaw}${/[a-z]/i.test(String(distanceRaw)) ? "" : "m"}`;

    const rx =
        row.rx_power ??
        row.rxPower ??
        row.rx ??
        row.rx_dbm;

    const tx =
        row.tx_power ??
        row.txPower ??
        row.tx ??
        row.tx_dbm;

    const voltage =
        row.voltage ??
        row.ont_voltage;

    const temperature =
        row.temperature ??
        row.temp ??
        row.ont_temperature;

    const alarm =
        row.alarm_status ||
        row.alarm ||
        row.last_down_reason ||
        row.dying_gasp_status ||
        row.dying_gasp ||
        row.last_event ||
        "";

    return {
        id: row.id,
        oltId: String(row.olt_id || olt.id),
        displayId: customerCode,
        customerName,
        customerLinked,
        primaryLinked,
        customerCount,
        extras,
        callerId,
        mapping: customerCount > 1 ? "switch" : (customerLinked ? "linked" : "unlinked"),
        status: rawStatus,
        alarm: String(alarm || "").replace(/_+/g, "-"),
        name,
        ip,
        routerMac,
        onuMac: mac,
        serial,
        oltPort:
            row.olt_name ||
            olt.name ||
            olt.vendor ||
            `OLT ${olt.id}`,
        port: pon,
        rx: fixed2(rx),
        tx: fixed2(tx),
        distance,
        voltage: fixed2(voltage),
        temperature: fixed2(temperature),
        lastUpdate: lastUpdate
            ? formatDate(lastUpdate)
            : "—",
        searchText: [
            row.id,
            customerCode,
            customerName,
            row.customer_phone,
            row.pppoe_username,
            name,
            ip,
            mac,
            routerMac,
            serial,
            callerId,
            ...extras.flatMap(c => [
                c.name, c.phone, c.pppoe_username,
                c.customer_code, c.caller_id, c.ip
            ]),
            pon,
            rawStatus,
            alarm,
            row.olt_name,
            olt.name,
            olt.vendor
        ].join(" ")
    };
}

function normalizeCustomerSession(row, olt) {
    const customerCode = row.customer_code || "";
    const customerName = row.customer_name || "Customer";
    const callerId = row.caller_id || "";
    const ip = row.ip_address || "";

    const status = normalizeStatus(
        row.customer_online_status ?? row.online_status

        id: `session-${row.session_id}`,

        displayId: customerCode,
        customerName,
        customerLinked: true,
        primaryLinked: true,
        customerCount: 1,
        extras: [],
        callerId,
        customerOnly: true,
        mapping: "customer-only",
        status,
        alarm: "",
        name: customerName,
        ip,
        routerMac: "",
        onuMac: "",
        serial: "",
        oltPort: olt.name || olt.vendor || `OLT ${olt.id}`,
        port: "",
        rx: "",
        tx: "",
        distance: "",
        voltage: "",
        temperature: "",
        lastUpdate: lastUpdate ? formatDate(lastUpdate) : "—",
        searchText: [
            row.customer_id,
            customerCode,
            customerName,
            row.customer_phone,
            row.pppoe_username,
            callerId,
            ip,
            status,
            olt.name,
            olt.vendor
        ].join(" ")
    };
}

/* --------------------------------------------------
   TABLE CELLS
-------------------------------------------------- */

// Customers shown for one ONU row: the linked one plus every switch customer.
function peopleOf(user) {
    const people = [];

    if (user.primaryLinked) {
        people.push({
            code: user.displayId,
            name: user.customerName || user.name || "—",
            ip: user.ip,
            callerId: user.callerId
        });
    }

    for (const extra of user.extras) {
        people.push({
            code: extra.customer_code || "",
            name: extra.name || extra.pppoe_username || "Customer",
            ip: extra.ip,
            callerId: extra.caller_id
        });
    }

    return people;
}

// A switch ONU becomes one ordinary row per customer. Every row keeps the
// ONU's master MAC and its shared readings (RX/TX, distance, ...).
function expandSwitchRows(user) {
    const people = peopleOf(user);

    if (people.length === 0) return [user];

    return people.map(person => ({
        ...user,
        displayId: person.code,
        customerName: person.name,
        name: person.name,
        ip: person.ip || "",
        callerId: person.callerId || "",
        routerMac: "",
        primaryLinked: true,
        customerLinked: true,
        customerCount: 1,
        extras: [],
        searchText: `${user.searchText} ${person.code} ${person.name} ${person.ip || ""} ${person.callerId || ""}`
    }));
}

function getCell(user, key) {
    switch (key) {
        case "customerId": {
            const people = peopleOf(user);
            const badge = user.customerOnly ? "" : `
                <span class="olt-status ${escapeHTML(user.status)}">
                    ${escapeHTML(statusLabel(user.status))}
                </span>`;

            // Several customers (switch): each has its own ID, aligned with
            // the name/IP block of the same customer.
            if (people.length > 1) {
                return people.map(person => `
                    <div class="olt-person olt-person-id">
                        <span class="olt-primary-text">
                            ${escapeHTML(person.code)}
                        </span>
                        <span class="olt-sub-text">
                            ${badge}
                        </span>
                    </div>
                `).join("");
            }

            return `
                <div>
                    <span class="olt-primary-text">
                        ${escapeHTML(user.displayId)}
                    </span>
                </div>
                ${badge}
            `;
        }

        case "name": {
            const people = peopleOf(user);

            if (!people.length) {
                return `
                    <span class="olt-unlinked">Customer not linked</span>
                    <span class="olt-sub-text">${escapeHTML(user.ip || "—")}</span>
                `;
            }

            return people.map(person => `
                <div class="olt-person">
                    <strong class="olt-primary-text">${escapeHTML(person.name)}</strong>
                    <span class="olt-sub-text">${escapeHTML(person.ip || "—")}</span>
                </div>
            `).join("");
        }

        case "address": {
            const lines = [];
            const seen = new Set();

            const add = (value, cls = "olt-mac") => {
                const text = String(value || "").trim();
                const key = text.toLowerCase();

                if (!text || seen.has(key)) return;

                seen.add(key);
                lines.push(`<span class="${cls}">${escapeHTML(text)}</span>`);
            };

            if (user.customerCount > 1) {
                // Switch ONU: one master (ONU) MAC, then each customer's own.
                add(user.onuMac);
            } else {
                add(user.routerMac);
                add(user.onuMac);
            }

            // MikroTik caller-id MAC of every customer behind this ONU
            add(user.callerId, "olt-ppp");

            for (const extra of user.extras) {
                add(extra.caller_id, "olt-ppp");
            }

            return lines.length
                ? lines.join("")
                : `<span class="olt-mac">—</span>`;
        }

        case "oltPort":
            return `
                <span class="olt-primary-text">${escapeHTML(user.oltPort)}</span>
                <span class="olt-sub-text">${user.customerOnly ? "" : escapeHTML(user.port || "—")}</span>
            `;

        case "power":
            return `
                <div class="olt-metric">
                    <span class="olt-metric-value">${escapeHTML(user.rx)}</span>
                </div>
                <div class="olt-metric">
                    <span class="olt-metric-value">${escapeHTML(user.tx)}</span>
                </div>
            `;

        case "distance":
            return `
                <div class="olt-metric">
                    <span class="olt-metric-value">${escapeHTML(user.distance)}</span>
                </div>
                <div class="olt-sub-text">${escapeHTML(user.alarm || "")}</div>
            `;

        case "environment":
            return `
                <div class="olt-metric">
                    <span class="olt-metric-value">${escapeHTML(user.voltage)}</span>
                </div>
                <div class="olt-metric">
                    <span class="olt-metric-value">${escapeHTML(user.temperature)}</span>
                </div>
            `;

        case "mapping":
            return "";

        case "lastUpdate":
            return `<span class="olt-sub-text">${user.lastUpdate}</span>`;

        default:
            return "";
    }
}


/* --------------------------------------------------
   FILTERED AND SORTED DATA
-------------------------------------------------- */

function getFilteredRows() {
    const query = search.value.trim().toLowerCase();
    const rMacVal = routerMacFilter.value.trim().toLowerCase();
    const oMacVal = onuMacFilter.value.trim().toLowerCase();

    let rows = users.filter(user => {
        if (
            query &&
            ![...Object.values(user), user.searchText].some(value =>
                String(value ?? "").toLowerCase().includes(query)
            )
        ) {
            return false;
        }

        if (
            rMacVal &&
            !String(user.routerMac || "").toLowerCase().includes(rMacVal)
        ) {
            return false;
        }

        if (
            oMacVal &&
            !String(user.onuMac || "").toLowerCase().includes(oMacVal)
        ) {
            return false;
        }

        return true;
    });

    if (sortColumn) {
        rows.sort((a, b) => {
            return String(a[sortColumn] ?? "").localeCompare(
                String(b[sortColumn] ?? ""),
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            ) * (sortAscending ? 1 : -1);
        });
    }

    return rows;
}


/* --------------------------------------------------
   PAGINATION BUTTONS
-------------------------------------------------- */

function renderPagination(totalRows, totalPages, startIndex, endIndex) {
    paginationInfo.textContent = totalRows === 0
        ? "Showing 0–0 of 0"
        : `Showing ${startIndex + 1}–${endIndex} of ${totalRows}`;

    firstPageBtn.disabled = currentPage <= 1 || totalRows === 0;
    prevPageBtn.disabled = currentPage <= 1 || totalRows === 0;
    nextPageBtn.disabled = currentPage >= totalPages || totalRows === 0;
    lastPageBtn.disabled = currentPage >= totalPages || totalRows === 0;

    const pagesToShow = new Set([1, totalPages]);

    for (
        let page = Math.max(1, currentPage - 2);
        page <= Math.min(totalPages, currentPage + 2);
        page++
    ) {
        pagesToShow.add(page);
    }

    const sortedPages = [...pagesToShow].sort((a, b) => a - b);

    let previousPage = 0;
    let html = "";

    for (const page of sortedPages) {
        if (previousPage && page - previousPage > 1) {
            html += `<span class="olt-page-ellipsis">…</span>`;
        }

        html += `
            <button
                type="button"
                class="olt-page-number ${page === currentPage ? "active" : ""}"
                data-page="${page}"
                aria-label="Go to page ${page}"
                aria-current="${page === currentPage ? "page" : "false"}">
                ${page}
            </button>
        `;

        previousPage = page;
    }

    pageNumbers.innerHTML = html;
}


/* --------------------------------------------------
   RENDER TABLE WITH PAGINATION
-------------------------------------------------- */

function renderRows() {
    const rows = getFilteredRows();
    const totalRows = rows.length;

    const totalPages = pageSize === 0
        ? 1
        : Math.max(1, Math.ceil(totalRows / pageSize));

    currentPage = Math.min(
        Math.max(1, currentPage),
        totalPages
    );

    const startIndex = pageSize === 0
        ? 0
        : (currentPage - 1) * pageSize;

    const endIndex = pageSize === 0
        ? totalRows
        : Math.min(startIndex + pageSize, totalRows);

    const visibleRows = pageSize === 0
        ? rows
        : rows.slice(startIndex, endIndex);

    total.textContent = String(totalRows);

    renderPagination(
        totalRows,
        totalPages,
        startIndex,
        endIndex
    );

    if (!visibleRows.length) {
        body.innerHTML = `
            <tr>
                <td class="olt-empty" colspan="${columns.length}">
                    <i class="fa-solid fa-circle-info me-1"></i>
                    ${users.length
                        ? "No matching ONU data."
                        : "No ONU data available for the selected OLT(s)."}
                </td>
            </tr>
        `;
        return;
    }

    body.innerHTML = visibleRows.map(user => `
        <tr>
            ${columns.map(([key]) => `
                <td>${getCell(user, key)}</td>
            `).join("")}
        </tr>
    `).join("");
}


/* --------------------------------------------------
   LOAD OLT LIST
-------------------------------------------------- */

async function loadOltList() {
    const result = await apiGet("/api/olt");

    oltList = Array.isArray(result)
        ? result
        : Array.isArray(result.olts)
            ? result.olts
            : Array.isArray(result.data)
                ? result.data
                : [];

    oltList = oltList.filter(olt => olt && olt.id != null);

    const params = new URLSearchParams(window.location.search);
    const requestedId =
        params.get("olt_id") ||
        params.get("id") ||
        "";

    oltSelect.innerHTML = [
        '<option value="all">All OLTs</option>',
        ...oltList.map(olt => `
            <option value="${escapeHTML(olt.id)}">
                ${escapeHTML(olt.name || olt.vendor || "OLT")}
                (#${escapeHTML(olt.id)})
            </option>
        `)
    ].join("");

    if (!oltList.length) {
        selectedOltId = "all";
        users = [];
        currentPage = 1;
        renderRows();

        showMessage(
            "No OLT records were returned for your account.",
            "info"
        );
        return;
    }

    const requestedOlt = oltList.find(
        olt => String(olt.id) === String(requestedId)
    );

    selectedOltId = requestedOlt
        ? String(requestedOlt.id)
        : "all";

    oltSelect.value = selectedOltId;

    currentPage = 1;
    await loadOnus();
}


/* --------------------------------------------------
   LOAD ONU DATA
-------------------------------------------------- */

async function loadOnus(keepMessage = false) {
    if (loading || !oltList.length) return;

    loading = true;
    refreshButton.disabled = true;

    refreshButton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i>';

    if (!keepMessage) {
        clearMessage();
    }

    body.innerHTML = `
        <tr>
            <td class="olt-empty" colspan="${columns.length}">
                <i class="fa-solid fa-spinner fa-spin me-1"></i>
                Loading ONU data...
            </td>
        </tr>
    `;

    try {
        const targets = selectedOltId === "all"
            ? [...oltList]
            : oltList.filter(
                olt => String(olt.id) === String(selectedOltId)
            );

        const results = await Promise.allSettled(
            targets.map(async olt => {
                const result = await apiGet(
                    `/api/olt/${encodeURIComponent(olt.id)}/onus`
                );

                const rows = Array.isArray(result.data)
                    ? result.data
                    : [];

                const onuRows = rows.map(row => normalizeOnu(row, olt));

                // Customer IDs already represented by ONU mappings.
                const mappedCustomerIds = new Set();

                for (const row of rows) {
                    if (
                        row.matched_customer_id !== null &&
                        row.matched_customer_id !== undefined
                    ) {
                        mappedCustomerIds.add(
                            String(row.matched_customer_id)
                        );
                    }

                    for (const extra of (
                        Array.isArray(row.extra_customers)
                            ? row.extra_customers
                            : []
                    )) {
                        if (extra.id !== null && extra.id !== undefined) {
                            mappedCustomerIds.add(String(extra.id));
                        }
                    }
                }

                // Show PPPoE sessions even before ONU hardware is synced.
                const customerSessions = Array.isArray(result.customer_sessions)
                    ? result.customer_sessions
                    : [];

                const customerOnlyRows = customerSessions
                    .filter(session =>
                        !mappedCustomerIds.has(String(session.customer_id))
                    )
                    .map(session => normalizeCustomerSession(session, olt));

                return {
                    olt,
                    rows: [...onuRows, ...customerOnlyRows]
                };
            })
        );

        const loaded = results
            .filter(item => item.status === "fulfilled")
            .map(item => item.value);

        users = loaded.flatMap(item => item.rows)
            .flatMap(expandSwitchRows);

        currentPage = 1;
        renderRows();

        const failed = results.filter(
            item => item.status === "rejected"
        );

        if (failed.length) {
            const failedIds = failed.map(item => {
                const index = results.indexOf(item);
                return targets[index]?.id;
            }).filter(Boolean);

            showMessage(
                `কিছু OLT-এর ONU data লোড হয়নি। ব্যর্থ OLT ID: ${failedIds.join(", ")}। সফল OLT-এর রেকর্ড দেখানো হয়েছে।`,
                "error"
            );
        } else {
            clearMessage();
        }
    } catch (error) {
        users = [];
        currentPage = 1;
        renderRows();

        showMessage(
            error.message || "Failed to load ONU data.",
            "error"
        );
    } finally {
        loading = false;
        refreshButton.disabled = false;

        refreshButton.innerHTML =
            '<i class="fa-solid fa-rotate"></i>';
    }
}


/* --------------------------------------------------
   SYNC ALL ONU HARDWARE FOR THE SELECTED OLT
-------------------------------------------------- */

async function syncSelectedOltHardware() {
    if (syncing || loading) return;
    const targets = selectedOltId === 'all'
        ? [...oltList]
        : oltList.filter(item => String(item.id) === String(selectedOltId));
    if (!targets.length) {
        showMessage('কোনো OLT নির্বাচন করা হয়নি।', 'info');
        return;
    }
    syncing = true;
    clearMessage();
    syncHardwareButton.disabled = true;
    refreshButton.disabled = true;
    syncHardwareButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    const totals = { found: 0, inserted: 0, updated: 0, online: 0 };
    const errors = [];
    try {
        for (const olt of targets) {
            try {
                const result = await apiPost(`/api/olt/${encodeURIComponent(olt.id)}/sync/onu`);
                const data = result.data || {};
                for (const key of Object.keys(totals)) totals[key] += Number(data[key] || 0);
            } catch (error) {
                errors.push(`${olt.name || olt.id}: ${error.message || 'Sync failed'}`);
            }
        }
        await loadOnus(true);
        const summary = `Found: ${totals.found}, Inserted: ${totals.inserted}, Updated: ${totals.updated}, Online: ${totals.online}.`;
        if (errors.length) {
            showMessage(`Hardware Sync আংশিক সম্পন্ন। ${summary} ব্যর্থ: ${errors.join(' | ')}`, 'error');
        } else {
            showMessage(`সব নির্বাচিত OLT-এর ONU Hardware Sync সম্পন্ন। ${summary}`, 'success');
        }
    } finally {
        syncing = false;
        syncHardwareButton.disabled = false;
        syncHardwareButton.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i>';
        refreshButton.disabled = false;
        renderRows();
    }
}
/* --------------------------------------------------
   MANUAL LINK / UNLINK AND AUTO MAP
-------------------------------------------------- */

/* --------------------------------------------------
   FILTER PANEL
-------------------------------------------------- */

toggleFilterButton.addEventListener("click", () => {
    filterPanel.classList.toggle("active");
});


applyFilterBtn.addEventListener("click", async () => {
    const nextOltId = oltSelect.value || "all";
    const oltChanged = nextOltId !== selectedOltId;

    selectedOltId = nextOltId;
    currentPage = 1;

    if (oltChanged) {
        await loadOnus();
    } else {
        renderRows();
    }
});


resetFilterBtn.addEventListener("click", async () => {
    routerMacFilter.value = "";
    onuMacFilter.value = "";
    search.value = "";

    selectedOltId = "all";
    oltSelect.value = "all";

    sortColumn = "";
    sortAscending = true;
    currentPage = 1;

    await loadOnus();
});


/* --------------------------------------------------
   SORTING
-------------------------------------------------- */

head.addEventListener("click", event => {
    const button = event.target.closest("[data-sort]");
    if (!button) return;

    const key = button.dataset.sort;

    if (sortColumn === key) {
        sortAscending = !sortAscending;
    } else {
        sortColumn = key;
        sortAscending = true;
    }

    currentPage = 1;
    renderRows();
});


/* --------------------------------------------------
   SEARCH AND MAC FILTERS
-------------------------------------------------- */

search.addEventListener("input", () => {
    currentPage = 1;
    renderRows();
});

routerMacFilter.addEventListener("input", () => {
    currentPage = 1;
    renderRows();
});

onuMacFilter.addEventListener("input", () => {
    currentPage = 1;
    renderRows();
});


/* --------------------------------------------------
   PAGE SIZE
-------------------------------------------------- */

pageSizeSelect.addEventListener("change", () => {
    pageSize = Number(pageSizeSelect.value);

    if (!Number.isFinite(pageSize) || pageSize < 0) {
        pageSize = 100;
    }

    currentPage = 1;
    renderRows();
});


/* --------------------------------------------------
   FIRST / PREVIOUS / NEXT / LAST
-------------------------------------------------- */

firstPageBtn.addEventListener("click", () => {
    currentPage = 1;
    renderRows();
});

prevPageBtn.addEventListener("click", () => {
    if (currentPage > 1) {
        currentPage--;
        renderRows();
    }
});

nextPageBtn.addEventListener("click", () => {
    const totalRows = getFilteredRows().length;

    const totalPages = pageSize === 0
        ? 1
        : Math.max(1, Math.ceil(totalRows / pageSize));

    if (currentPage < totalPages) {
        currentPage++;
        renderRows();
    }
});

lastPageBtn.addEventListener("click", () => {
    const totalRows = getFilteredRows().length;

    currentPage = pageSize === 0
        ? 1
        : Math.max(1, Math.ceil(totalRows / pageSize));

    renderRows();
});


/* --------------------------------------------------
   PAGE NUMBER BUTTONS
-------------------------------------------------- */

pageNumbers.addEventListener("click", event => {
    const button = event.target.closest("[data-page]");
    if (!button) return;

    const page = Number(button.dataset.page);

    if (!Number.isInteger(page) || page < 1) {
        return;
    }

    currentPage = page;
    renderRows();
});


/* --------------------------------------------------
   OLT SELECTION
-------------------------------------------------- */

oltSelect.addEventListener("change", async () => {
    if (syncing || loading) return;

    selectedOltId = oltSelect.value || "all";
    currentPage = 1;

    await loadOnus();
});


/* --------------------------------------------------
   REFRESH
-------------------------------------------------- */

syncHardwareButton.addEventListener("click", syncSelectedOltHardware);

refreshButton.addEventListener("click", async () => {
    if (loading || syncing) return;

    try {
        if (!oltList.length) {
            await loadOltList();
        } else {
            await loadOnus();
        }
    } catch (error) {
        showMessage(
            error.message || "Failed to refresh ONU data.",
            "error"
        );
    }
});


/* --------------------------------------------------
   SYNC BUTTON DELEGATION
-------------------------------------------------- */

body.addEventListener("click", async event => {
    const noOnuButton = event.target.closest("[data-no-onu]");
    if (!noOnuButton) return;
    if (window.AppToast) {
        window.AppToast.info("এই কাস্টমারের ONU এখনো পাওয়া যায়নি।");
    } else {
        showMessage("এই কাস্টমারের ONU এখনো পাওয়া যায়নি।", "info");
    }
});


/* --------------------------------------------------
   INITIALIZE
-------------------------------------------------- */

async function init() {
    renderHead();

    pageSize = Number(pageSizeSelect.value) || 100;
    currentPage = 1;

    body.innerHTML = `
        <tr>
            <td class="olt-empty" colspan="${columns.length}">
                Loading OLT list...
            </td>
        </tr>
    `;

    try {
        await loadOltList();
    } catch (error) {
        oltSelect.innerHTML =
            '<option value="all">All OLTs</option>';

        users = [];
        currentPage = 1;
        renderRows();

        showMessage(
            error.message ||
            "Unable to load OLT list. Check login and API route.",
            "error"
        );
    }
}

init();
</script>
