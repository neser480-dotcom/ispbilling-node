<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title> Amader Billing Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="/assets/css/login.css?v=20261117"
>

</head>

<body>

<main class="shell">

    <section class="form-side">

        <span class="brand">IRFAN</span>

        <h1>Welcome to Amader Billing &amp; Management System</h1>

        <p class="subtitle">
            Please login to continue.
        </p>


        <div
            class="error"
            id="loginError"
            style="display:none;"
        >

            <span>⚠</span>

            <span id="loginErrorText"></span>

        </div>


        <form
            method="POST"
            autocomplete="on"
            id="loginForm"
        >

            <input
                type="hidden"
                name="csrf_token"
                id="csrf_token"
                value=""
            >


            <div class="input-group">

                <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                </span>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Username"
                    value=""
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group password-box">

                <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                </span>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    value=""
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-pass"
                    onclick="showPassword()"
                    aria-label="Show or hide password"
                >
                    👁
                </button>

            </div>


            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                        value="1"
                        id="remember"
                    >

                    <span class="checkmark"></span>

                    <span>
                        Remember Me
                    </span>

                </label>


                <a
                    href="/forgot"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                name="login"
                class="login-btn"
                id="loginButton"
            >

                <span>Login</span>

                <span class="arrow">
                    →
                </span>

            </button>

        </form>


        <div class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <div class="footer">

            © <span id="currentYear"></span>
            Amader Billing System

        </div>

    </section>


    <aside class="visual" aria-hidden="true">

        <div class="shadow"></div>

        <div class="cube-wrap">

            <div class="cube">
                <div class="face f"></div>
                <div class="face b"></div>
                <div class="face r"></div>
                <div class="face l"></div>
                <div class="face t"></div>
                <div class="face d"></div>
            </div>

        </div>

    </aside>

</main>


<script src="/assets/js/login.js"></script>

<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
    <script src="/assets/js/topbar-loader.js?v=20261126-alert-toasts"></script>
</body>

</html>
