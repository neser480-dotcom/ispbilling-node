
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">

    <title>Staff</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/employee.css">
</head>
<body>

<!-- Sidebar -->
<div id="sidebarContainer"></div>

<!-- Main Layout -->
<div id="mainContent">

    <!-- Topbar -->
    <div id="topbarContainer"></div>

    <!-- Staff Content -->
    <main class="container-fluid px-4 mt-3">

        <div id="pageAlert" class="alert d-none" role="alert"></div>

        <!-- Page Header -->
        <div class="top-header d-flex justify-content-between align-items-center mb-4">
            <h4 class="m-0">Staff</h4>

            <div class="d-flex gap-3 align-items-center">
                <a href="/staff/employee" class="text-white" title="Refresh">
                    <i class="fa-solid fa-rotate"></i>
                </a>

                <button type="button" id="printStaff"
                        class="btn btn-link text-white p-0" title="Print">
                    <i class="fa-solid fa-print"></i>
                </button>

                <button type="button"
                        class="btn btn-link text-white p-0"
                        data-bs-toggle="modal"
                        data-bs-target="#addStaffModal"
                        title="Add Staff">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </div>
        </div>

        <!-- Search / Total -->
        <div class="table-card p-3 mb-3">
            <div class="row align-items-center g-2">
                <div class="col-md-4">
                    <span class="badge bg-primary p-2">
                        Total Data: <span id="totalData">0</span>
                    </span>
                </div>

                <div class="col-md-8">
                    <input
                        type="search"
                        id="staffSearch"
                        class="form-control"
                        placeholder="Search by name, mobile or email"
                        autocomplete="off">
                </div>
            </div>
        </div>

        <!-- Staff Table -->
        <div class="table-card p-3">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Status</th>
                            <th>Salary</th>
                            <th>Due</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="staffTableBody">
                        <tr>
                            <td colspan="7" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-muted mt-4 mb-3">
            <small>Â© Shunno IT - 2026</small>
        </footer>

    </main>
</div>

<!-- Add Staff Modal -->
<div class="modal fade" id="addStaffModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <form id="addStaffForm">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Staff</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Name *</label>
                            <input name="name" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Mobile *</label>
                            <input name="mobile" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">NID No</label>
                            <input name="nid_no" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">E-mail</label>
                            <input name="email" type="email" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Parent Name</label>
                            <input name="parent_name" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Salary *</label>
                            <input name="salary" type="number" min="0" step="0.01"
                                   value="0" class="form-control" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input name="address" class="form-control">
                        </div>

                        <div class="col-12">
                            <h6>Reference Information</h6>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Reference Name</label>
                            <input name="ref_name" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Reference Mobile</label>
                            <input name="ref_mobile" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Reference Email</label>
                            <input name="ref_email" type="email" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Reference NID</label>
                            <input name="ref_nid" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Reference Relation</label>
                            <input name="ref_relation" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Reference Address</label>
                            <input name="ref_address" class="form-control">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-success">
                        Submit
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Edit Staff Modal -->
<div class="modal fade" id="editStaffModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <form id="editStaffForm">
                <input type="hidden" name="id" id="edit_id">

                <div class="modal-header">
                    <h5 class="modal-title">Edit Staff Information</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Name *</label>
                            <input name="name" id="edit_name" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Mobile *</label>
                            <input name="mobile" id="edit_mobile" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Salary *</label>
                            <input name="salary" id="edit_salary" type="number"
                                   min="0" step="0.01" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select name="status" id="edit_status" class="form-select">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input name="address" id="edit_address" class="form-control">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Update
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- SMS Modal -->
<div class="modal fade" id="smsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <form id="smsForm">
                <input type="hidden" name="staff_id" id="sms_staff_id">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <span id="sms_staff_name">STAFF</span> to send message
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <label class="form-label fw-bold">Message</label>

                    <div class="text-end small text-muted mb-1">
                        Letter: <span id="letter_count">0</span>
                        | SMS: <span id="sms_count">0</span>
                    </div>

                    <textarea name="message" id="sms_text_box"
                              rows="4" class="form-control mb-3" required></textarea>

                    <label class="form-label fw-bold">Sending Message Type</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="sms_type" value="non_masking"
                               id="nonMasking" checked>
                        <label class="form-check-label" for="nonMasking">
                            Non Masking
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="sms_type" value="masking" id="masking">
                        <label class="form-check-label" for="masking">
                            Masking
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="sms_type" value="fixed_number" id="fixedNumber">
                        <label class="form-check-label" for="fixedNumber">
                            Fixed Number
                        </label>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-success">
                        Send Message
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<input type="hidden" id="csrfTokenInput" value="">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js?v=20261009"></script>
<script src="/assets/js/topbar-loader.js?v=20261009"></script>
<script src="/assets/js/employee.js"></script>

</body>
</html>
