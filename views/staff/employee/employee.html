<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Staff</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/collector.css">

    <style>
        /* form modal-content এর সরাসরি সন্তান না হওয়ায় body স্ক্রল করছিল না, নিচ কাটা যাচ্ছিল */
        .modal-dialog-scrollable .modal-content>form{display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden}
        .modal-dialog-scrollable .modal-content>form>.modal-body{flex:1 1 auto;min-height:0;overflow-y:auto}
        .emp-form{max-width:370px;margin:0 auto}
        .emp-form .form-label{font-size:13px;margin-bottom:4px}
        .emp-ref{background:#f8f9fa;border:1px solid #eee;border-radius:6px;padding:14px;margin-top:6px}
        .emp-ref h6{color:#2a8bb5;font-weight:600;margin-bottom:10px}
        .emp-ref .form-label{font-size:12px}
    </style>
</head>
<body class="staff-page">

<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<div class="main-content">

    <div id="pageAlert" class="alert d-none" role="alert"></div>

    <!-- BLUE HEADER -->
    <div class="staff-header-card">
        <h1>Staff</h1>
        <div class="staff-header-actions">
            <button type="button" class="staff-icon-btn" id="refreshBtn" title="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button type="button" class="staff-icon-btn" id="printBtn" title="Print">
                <i class="fa-solid fa-print"></i>
            </button>
            <button type="button" class="staff-icon-btn" id="addBtn" title="Add Staff">
                <i class="fa-solid fa-user-plus"></i>
            </button>
            <a class="staff-icon-btn" href="/tutorial" title="Tutorial">
                <i class="fa-solid fa-circle-play"></i>
            </a>
        </div>
    </div>

    <!-- WHITE BODY -->
    <div class="staff-body-card">

        <div class="staff-strip">
            <div class="staff-total">
                <i class="fa-solid fa-gear me-1"></i> Total Data:
                <span class="staff-count-pill" id="totalData">0</span>
            </div>
            <div class="staff-search-wrap">
                <input type="search" id="staffSearch" class="form-control" placeholder="Search" autocomplete="off">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table staff-table">
                <thead>
                    <tr>
                        <th data-sort="id"># <span class="sort-icon">↓↑</span></th>
                        <th data-sort="name">Name <span class="sort-icon">↓↑</span></th>
                        <th data-sort="mobile">Mobile <span class="sort-icon">↓↑</span></th>
                        <th data-sort="status">Status <span class="sort-icon">↓↑</span></th>
                        <th data-sort="salary">Salary <span class="sort-icon">↓↑</span></th>
                        <th data-sort="due">Due <span class="sort-icon">↓↑</span></th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody">
                    <tr><td colspan="7">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="staff-footer">© IRFAN IT - 2026</div>
</div>

<!-- ADD STAFF MODAL -->
<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable staff-modal-wide">
        <div class="modal-content">
            <form id="addForm">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Staff</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="emp-form">
                        <div class="mb-3"><label class="form-label">Name <span class="text-danger">*</span></label><input id="ad_name" class="form-control" placeholder="e.g. Name" required></div>
                        <div class="mb-3"><label class="form-label">Mobile <span class="text-danger">*</span></label><input id="ad_mobile" class="form-control" placeholder="e.g. 01XXXXXXXXX" required></div>
                        <div class="mb-3"><label class="form-label">NID No</label><input id="ad_nid" class="form-control" placeholder="e.g. 10,13 or 17 digits"></div>
                        <div class="mb-3"><label class="form-label">Address</label><input id="ad_address" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">E-mail</label><input id="ad_email" type="email" class="form-control" placeholder="***@mail.com"></div>
                        <div class="mb-3"><label class="form-label">Parent Name</label><input id="ad_parent" class="form-control" placeholder="e.g. Father Name"></div>
                        <div class="mb-3"><label class="form-label">Salary <span class="text-danger">*</span></label><input id="ad_salary" type="number" min="0" step="0.01" class="form-control" placeholder="0" required></div>
                    </div>
                    <div class="emp-ref">
                        <h6>Provide Reference Information</h6>
                        <div class="row g-2">
                            <div class="col-md-4"><label class="form-label">Reference Name</label><input id="ad_ref_name" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Mobile</label><input id="ad_ref_mobile" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Email</label><input id="ad_ref_email" type="email" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference NID No</label><input id="ad_ref_nid" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Address</label><input id="ad_ref_address" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Relation</label><input id="ad_ref_relation" class="form-control form-control-sm"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- UPDATE STAFF MODAL -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable staff-modal-wide">
        <div class="modal-content">
            <form id="editForm">
                <input type="hidden" id="ed_id">
                <div class="modal-header">
                    <h5 class="modal-title">Update Staff</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="emp-form">
                        <div class="mb-3"><label class="form-label">Name <span class="text-danger">*</span></label><input id="ed_name" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Mobile <span class="text-danger">*</span></label><input id="ed_mobile" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">NID No</label><input id="ed_nid" class="form-control" placeholder="e.g. 10,13 or 17 digits"></div>
                        <div class="mb-3"><label class="form-label">Address</label><input id="ed_address" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">E-mail</label><input id="ed_email" type="email" class="form-control" placeholder="***@mail.com"></div>
                        <div class="mb-3">
                            <label class="form-label d-block">Status <span class="text-danger">*</span></label>
                            <div class="d-flex flex-wrap gap-4">
                                <div class="form-check"><input class="form-check-input" type="radio" name="ed_status" id="edSt_new" value="new"><label class="form-check-label" for="edSt_new">New</label></div>
                                <div class="form-check"><input class="form-check-input" type="radio" name="ed_status" id="edSt_active" value="active" checked><label class="form-check-label" for="edSt_active">Active</label></div>
                                <div class="form-check"><input class="form-check-input" type="radio" name="ed_status" id="edSt_inactive" value="inactive"><label class="form-check-label" for="edSt_inactive">Inactive</label></div>
                                <div class="form-check"><input class="form-check-input" type="radio" name="ed_status" id="edSt_banned" value="banned"><label class="form-check-label" for="edSt_banned">banned</label></div>
                                <div class="form-check"><input class="form-check-input" type="radio" name="ed_status" id="edSt_deleted" value="deleted"><label class="form-check-label" for="edSt_deleted">deleted</label></div>
                            </div>
                        </div>
                        <div class="mb-3"><label class="form-label">Parent Name</label><input id="ed_parent" class="form-control" placeholder="e.g. Father Name"></div>
                        <div class="mb-3"><label class="form-label">Salary <span class="text-danger">*</span></label><input id="ed_salary" type="number" min="0" step="0.01" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Due</label><input id="ed_due" class="form-control" readonly></div>
                    </div>
                    <div class="emp-ref">
                        <h6>Provide Reference Information</h6>
                        <div class="row g-2">
                            <div class="col-md-4"><label class="form-label">Reference Name</label><input id="ed_ref_name" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Mobile</label><input id="ed_ref_mobile" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Email</label><input id="ed_ref_email" type="email" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference NID No</label><input id="ed_ref_nid" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Address</label><input id="ed_ref_address" class="form-control form-control-sm"></div>
                            <div class="col-md-4"><label class="form-label">Reference Relation</label><input id="ed_ref_relation" class="form-control form-control-sm"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- MESSAGE MODAL -->
<div class="modal fade" id="smsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable staff-modal-wide">
        <div class="modal-content">
            <form id="smsForm">
                <input type="hidden" id="sms_id">
                <div class="modal-header">
                    <h5 class="modal-title"><span id="sms_name"></span> to send message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label fw-bold">Message</label>
                    <div class="text-end small text-muted mb-1">Letter: <span id="sms_letters">0</span> | SMS: <span id="sms_count">0</span></div>
                    <textarea id="sms_text" rows="4" class="form-control mb-3" placeholder="Write Message ...." required></textarea>
                    <label class="form-label fw-bold">Sending Message Type</label>
                    <div class="form-check"><input class="form-check-input" type="radio" name="sms_type" value="non_masking" id="smsNon" checked><label class="form-check-label" for="smsNon">Non Masking</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="sms_type" value="masking" id="smsMask"><label class="form-check-label" for="smsMask">Masking</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="sms_type" value="fixed_number" id="smsFixed"><label class="form-check-label" for="smsFixed">Fixed Number</label></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Send Message</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:500px">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete Staff</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Do you want to delete staff ?</div>
            <div class="modal-footer">
                <input type="hidden" id="del_id">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="del_confirm">Delete</button>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="csrfTokenInput" value="">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="/assets/js/topbar-loader.js?v=20261009"></script>
<script src="/assets/js/employee.js"></script>
</body>
</html>
