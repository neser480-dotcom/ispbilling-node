<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mikrotik</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/router.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/mikrotik-extra.css">
<link rel="stylesheet" href="/assets/css/mobile-pages.css?v=20261125">
</head>

<body class="mp-mikrotik">

<!-- SIDEBAR -->
<div id="sidebarContainer"></div>

<!-- TOPBAR -->
<div id="topbarContainer"></div>


<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<div class="main-content">

    <div class="router-wrap">

        <!-- PAGE HEADER -->
        <div class="router-page-header">

            <h4 class="router-page-title" id="routerPanelTitle">Mikrotik</h4>

            <div class="router-header-actions">

                <button type="button" class="header-icon-btn" id="refreshRouters" title="Refresh">
                    <i class="fa fa-rotate-right"></i>
                </button>

                <button type="button" class="header-icon-btn" id="addRouter" title="Add Router">
                    <i class="fa fa-plus"></i>
                </button>

                <button type="button" class="header-icon-btn" id="routerVideo" title="Video">
                    <i class="fa-regular fa-square-caret-right"></i>
                </button>

            </div>

        </div>


        <!-- CARD -->
        <div class="router-card">

            <!-- TOOLBAR -->
            <div class="router-toolbar">

                <div class="router-toolbar-left">

                    <i class="fa fa-gear router-toolbar-icon"></i>

                    <span class="router-total-label">Total Data:</span>

                    <span class="router-pill" id="totalRouter">0</span>

                    <span class="router-company" id="companyInfo"></span>

                </div>

                <input
                    type="text"
                    id="routerSearch"
                    class="router-search"
                    placeholder="Search"
                    autocomplete="off"
                >

            </div>


            <!-- TABLE -->
            <div class="table-responsive router-table-wrap">

                <table class="table align-middle mb-0" id="routerTable">

                    <thead>
                        <tr>
                            <th data-sort="idx"># <span class="router-sort">⇵</span></th>
                            <th><i class="fa fa-plug-circle-check"></i> <span class="router-sort">⇵</span></th>
                            <th data-sort="name">Name <span class="router-sort">⇵</span></th>
                            <th data-sort="username">User Name <span class="router-sort">⇵</span></th>
                            <th data-sort="ip">Host <span class="router-sort">⇵</span></th>
                            <th data-sort="port">Port <span class="router-sort">⇵</span></th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>

                    <tbody id="routerTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="fa fa-spinner fa-spin me-1"></i> Loading...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>


        <!-- FOOTER -->
        <div class="router-footer">
            &copy; IRFAN IT - <span id="routerYear"></span>
        </div>

    </div>

</div>


<!-- MODAL ROOT -->
<div id="modalRoot"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/assets/js/mk-toast.js"></script>
<script src="/assets/js/router-index.js"></script>

<script>
    document.getElementById("routerYear").textContent = new Date().getFullYear();
</script>

<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>

</html>
