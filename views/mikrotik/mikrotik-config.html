<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MikroTik Configuration</title>


    <!-- SIDEBAR / TOPBAR CSS -->

    <link
        rel="stylesheet"
        href="/assets/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/topbar.css"
    >


    <!-- MIKROTIK CSS -->

    <link
        rel="stylesheet"
        href="/assets/css/router.css"
    >


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- THIS PAGE ONLY (router.css এর পরে থাকতে হবে) -->

    <link
        rel="stylesheet"
        href="/assets/css/mikrotik-config.css"
    >

</head>


<body class="mk-config-page">


    <!-- SIDEBAR -->

    <div id="sidebarContainer"></div>


    <!-- TOPBAR -->

    <div id="topbarContainer"></div>


    <!-- MAIN CONTENT -->

    <main
        class="main-content"
        style="
            margin-left:250px;
            padding:90px 20px 30px;
        "
    >


        <!-- ==================================================
             BLUE HEADER
        ================================================== -->

        <div class="mk-header">

            <!-- BACK -->

            <a
                href="/mikrotik"
                class="mk-back"
            >
                <i class="fa fa-arrow-left"></i>
                Mikrotik
            </a>


            <h4
                id="routerTitle"
                class="mk-title"
            >
                Mikrotik Configuration
            </h4>


            <div class="mk-header-actions">

                <!-- CHECK CONNECTION -->

                <button
                    type="button"
                    class="mk-btn-white"
                    id="checkRouter"
                >
                    Check Connection
                    <i class="fa fa-plug"></i>
                </button>


                <!-- EDIT -->

                <button
                    type="button"
                    class="mk-btn-white"
                    id="editRouter"
                >
                    Edit
                    <i class="fa fa-pen"></i>
                </button>

            </div>

        </div>


        <!-- ==================================================
             WHITE CARD
        ================================================== -->

        <div class="mk-card">


            <!-- TABS -->

            <ul
                class="nav nav-tabs mk-tabs"
                role="tablist"
            >

                <li
                    class="nav-item"
                    role="presentation"
                >

                    <button
                        class="nav-link active"
                        type="button"
                    >
                        PPPoE
                    </button>

                </li>

            </ul>


            <!-- SELECT / ROUTER INFO / SYNC -->

            <div class="mk-info-row">


                <!-- PACKAGE SELECT -->

                <div class="mk-select-col">

                    <label
                        class="mk-select-label"
                        for="packageSelect"
                    >
                        Select
                    </label>

                    <select
                        id="packageSelect"
                        class="form-select"
                    >

                        <option value="">
                            Package
                        </option>

                    </select>

                </div>


                <!-- ROUTER INFORMATION -->

                <div class="mk-router-col">

                    <div>
                        Name :
                        <strong id="routerName">-</strong>
                    </div>

                    <div>
                        IP :
                        <strong id="routerIp">-</strong>
                    </div>

                    <div>
                        User Name :
                        <strong id="routerUsername">-</strong>
                    </div>

                    <div>
                        Port :
                        <strong id="routerPort">-</strong>
                    </div>

                </div>


                <!-- SYNC BUTTONS -->

                <div class="mk-sync-col">

                    <button
                        type="button"
                        class="mk-btn-blue"
                        id="syncPackage"
                    >
                        Package Sync
                        <i class="fa fa-bag-shopping"></i>
                    </button>


                    <button
                        type="button"
                        class="mk-btn-blue"
                        id="syncCustomer"
                    >
                        Customer Sync
                        <i class="fa fa-user-check"></i>
                    </button>

                </div>

            </div>


            <!-- DATA STRIP -->

            <div class="mk-strip">

                <div class="mk-total">

                    <i class="fa fa-gear me-2"></i>

                    Total Data:

                    <span
                        class="mk-count-pill"
                        id="totalPackageCount"
                    >0</span>

                </div>


                <div class="mk-search-wrap">

                    <input
                        type="search"
                        id="packageSearch"
                        class="form-control"
                        placeholder="Search"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- TABLE -->

            <div class="table-responsive">

                <table class="table mk-table align-middle mb-0">

                    <thead>

                        <tr>

                            <th
                                style="width:70px;"
                                data-sort-col="0"
                            >
                                # <span class="sort-icon">⇅</span>
                            </th>

                            <th data-sort-col="1">
                                Package <span class="sort-icon">⇅</span>
                            </th>

                            <th data-sort-col="2">
                                Rate <span class="sort-icon">⇅</span>
                            </th>

                            <th data-sort-col="3">
                                Alias Name <span class="sort-icon">⇅</span>
                            </th>

                            <th
                                class="text-center"
                                style="width:150px;"
                            >
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="packageTable">

                        <tr>

                            <td
                                colspan="5"
                                class="text-center text-muted py-4"
                            >
                                Loading packages...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="mk-footer">
            &copy; IRFAN IT - 2026
        </div>


    </main>


    <!-- MODAL ROOT -->

    <div id="modalRoot"></div>


    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- SIDEBAR / TOPBAR LOADERS -->

    <script
        src="/assets/js/sidebar-loader.js"
        defer
    ></script>

    <script
        src="/assets/js/topbar-loader.js"
        defer
    ></script>


    <!-- SWEETALERT -->

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>


    <!-- MIKROTIK JS (আগের মতোই, কোনো পরিবর্তন নেই) -->

    <script
        src="/assets/js/mikrotik.js"
        defer
    ></script>


    <!-- THIS PAGE ONLY: টেবিল হেডার সর্ট (শুধু দেখানোর ক্রম বদলায়, ডাটা নয়) -->

    <script
        src="/assets/js/mikrotik-config-ui.js"
        defer
    ></script>


<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>

</html>
