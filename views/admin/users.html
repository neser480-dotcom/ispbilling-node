<div class="container-fluid py-4">

</main>

<script src="/assets/js/sidebar-loader.js"></script>

<script src="/assets/js/topbar-loader.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadUsers();

    }
);


async function loadUsers() {

    const tbody =
        document.getElementById(
            "usersTableBody"
        );


    try {

        const response =
            await fetch(
                "/super-admin/users/data",
                {
                    credentials: "same-origin"
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Unable to load users."
            );

        }


        const users =
            Array.isArray(result.users)
                ? result.users
                : [];


        if (!users.length) {

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="9"
                        class="text-center text-muted py-4"
                    >
                        No users found.
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML =
            users.map(
                function (user) {

                    return `
                        <tr>

                            <td>
                                ${escapeHtml(user.id)}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.name ||
                                    user.fullname ||
                                    ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.username || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.email || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.mobile ||
                                    user.phone ||
                                    ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.role || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.status || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.company_name || ""
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.created_at || ""
                                )}
                            </td>

                        </tr>
                    `;

                }
            )
            .join("");


    } catch (error) {

        console.error(
            "Users loading error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="text-center text-danger py-4"
                >
                    ${escapeHtml(
                        error.message ||
                        "Unable to load users."
                    )}
                </td>
            </tr>
        `;

    }

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>
