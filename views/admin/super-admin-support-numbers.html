<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amader Bill Support Numbers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --topbar-height: 70px; --sidebar-width: 250px; }
        body { margin: 0; background: #f4f6f9; overflow-x: hidden; }
        .main-content { margin-left: var(--sidebar-width); padding: calc(var(--topbar-height) + 18px) 18px 28px; min-height: 100vh; }
        .page-banner { background: #1e88e5; color: #fff; padding: 15px 20px; border-radius: 7px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .table thead th { white-space: nowrap; }
        .page-footer { text-align:center; color:#6c757d; font-size:13px; margin-top:28px; }
        @media(max-width:991.98px) { .main-content { margin-left:0; padding:calc(var(--topbar-height) + 14px) 12px 24px; } }
    </style>
</head>
<body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>
    <main class="main-content">
        <div class="page-banner mb-3">
            <div><h4 class="m-0">Amader Bill Support Numbers</h4><small>Public website support contacts</small></div>
            <div class="d-flex gap-2">
                <button class="btn btn-light text-primary" type="button" id="refreshBtn" title="Refresh"><i class="fa fa-rotate-right"></i></button>
                <button class="btn btn-light text-primary" type="button" id="addBtn"><i class="fa fa-plus me-1"></i> Add Number</button>
            </div>
        </div>
        <div class="card border-0 shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div>Total Numbers: <strong id="numberCount">0</strong></div>
                <input class="form-control" id="searchInput" type="search" placeholder="Search name or mobile" style="max-width:320px">
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>#</th><th>Name</th><th>Mobile</th><th>Start Time</th><th>End Time</th><th class="text-end">Action</th></tr></thead>
                    <tbody id="numbersBody"><tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="page-footer">© IRFAN IT - 2026</div>
    </main>

    <div class="modal fade" id="numberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <form id="numberForm">
                <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Support Number</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="numberId">
                    <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required maxlength="120"></div>
                    <div class="mb-3"><label class="form-label">Mobile</label><input class="form-control" name="mobile" required maxlength="40"></div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Start Time</label><input class="form-control" name="start_time" placeholder="09:00 AM" required maxlength="40"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">End Time</label><input class="form-control" name="end_time" placeholder="06:00 PM" required maxlength="40"></div>
                    </div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" id="saveBtn">Save Number</button></div>
            </form>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/sidebar-loader.js"></script>
    <script src="/assets/js/topbar-loader.js"></script>
    <script>
    (() => {
        "use strict";
        const API = "/api/super-admin/support-numbers";
        const modal = new bootstrap.Modal(document.getElementById("numberModal"));
        let numbers = [];
        let csrfToken = "";

        const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({
            "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
        })[c]);

        async function getCsrf() {
            if (csrfToken) return csrfToken;
            const response = await fetch("/api/csrf-token", { credentials: "same-origin" });
            const data = await response.json();
            if (!response.ok || !data.csrf_token) throw new Error(data.message || "Unable to get CSRF token.");
            csrfToken = data.csrf_token;
            return csrfToken;
        }

        async function request(url, options = {}) {
            const method = String(options.method || "GET").toUpperCase();
            const headers = { ...(options.headers || {}) };
            if (!["GET", "HEAD"].includes(method)) headers["X-CSRF-Token"] = await getCsrf();
            const response = await fetch(url, { ...options, headers, credentials: "same-origin" });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success === false) throw new Error(data.message || "Request failed.");
            return data;
        }

        function render() {
            const q = document.getElementById("searchInput").value.trim().toLowerCase();
            const rows = numbers.filter(r => String(r.name || "").toLowerCase().includes(q) || String(r.mobile || "").toLowerCase().includes(q));
            document.getElementById("numberCount").textContent = rows.length;
            const tbody = document.getElementById("numbersBody");
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No support numbers added yet.</td></tr>';
                return;
            }
            tbody.innerHTML = rows.map((r, i) => `
                <tr>
                    <td>${i + 1}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.mobile)}</td>
                    <td>${escapeHtml(r.start_time)}</td><td>${escapeHtml(r.end_time)}</td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-sm btn-outline-primary me-1" data-action="edit" data-id="${Number(r.id)}" title="Edit"><i class="fa fa-pen"></i></button>
                        <button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${Number(r.id)}" title="Delete"><i class="fa fa-trash"></i></button>
                    </td>
                </tr>`).join("");
        }

        async function load() {
            const tbody = document.getElementById("numbersBody");
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>';
            try {
                const result = await request(API);
                numbers = Array.isArray(result.data) ? result.data : [];
                render();
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Unable to load support numbers.</td></tr>';
                Swal.fire("Error", error.message, "error");
            }
        }

        function addModal() {
            document.getElementById("numberForm").reset();
            document.getElementById("numberId").value = "";
            document.getElementById("modalTitle").textContent = "Add Support Number";
            document.getElementById("saveBtn").textContent = "Save Number";
            modal.show();
        }

        function editModal(row) {
            const form = document.getElementById("numberForm");
            form.elements.id.value = row.id;
            form.elements.name.value = row.name || "";
            form.elements.mobile.value = row.mobile || "";
            form.elements.start_time.value = row.start_time || "";
            form.elements.end_time.value = row.end_time || "";
            document.getElementById("modalTitle").textContent = "Edit Support Number";
            document.getElementById("saveBtn").textContent = "Update Number";
            modal.show();
        }

        document.getElementById("addBtn").addEventListener("click", addModal);
        document.getElementById("refreshBtn").addEventListener("click", load);
        document.getElementById("searchInput").addEventListener("input", render);

        document.getElementById("numberForm").addEventListener("submit", async event => {
            event.preventDefault();
            const form = event.currentTarget;
            const id = form.elements.id.value;
            const payload = {
                name: form.elements.name.value.trim(),
                mobile: form.elements.mobile.value.trim(),
                start_time: form.elements.start_time.value.trim(),
                end_time: form.elements.end_time.value.trim()
            };
            const button = document.getElementById("saveBtn");
            button.disabled = true;
            try {
                await request(id ? API + "/" + encodeURIComponent(id) : API, {
                    method: id ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                modal.hide();
                await load();
                Swal.fire({ icon: "success", title: id ? "Updated" : "Added", timer: 1200, showConfirmButton: false });
            } catch (error) {
                Swal.fire("Error", error.message, "error");
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById("numbersBody").addEventListener("click", async event => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const row = numbers.find(r => Number(r.id) === Number(button.dataset.id));
            if (!row) return;
            if (button.dataset.action === "edit") return editModal(row);

            const answer = await Swal.fire({
                title: "Delete support number?",
                text: row.name + " - " + row.mobile,
                icon: "warning", showCancelButton: true,
                confirmButtonText: "Delete", confirmButtonColor: "#dc3545"
            });
            if (!answer.isConfirmed) return;
            try {
                await request(API + "/" + encodeURIComponent(row.id), { method: "DELETE" });
                await load();
                Swal.fire({ icon: "success", title: "Deleted", timer: 1000, showConfirmButton: false });
            } catch (error) {
                Swal.fire("Error", error.message, "error");
            }
        });

        load();
    })();
    </script>
</body>
</html>
