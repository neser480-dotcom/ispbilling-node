<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection - Bandwidth Sale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --topbar-height: 70px;
            --sidebar-width: 250px;
        }

        body {
            background: #f4f6f9;
            margin: 0;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding-top: calc(var(--topbar-height) + 16px);
            padding-right: 18px;
            padding-bottom: 24px;
            padding-left: 18px;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }

        .page-banner {
            background: #1e88e5;
            color: #fff;
            padding: 14px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-banner .icon-btn {
            width: 38px;
            height: 36px;
            border-radius: 5px;
            background: #fff;
            color: #1e88e5;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .page-banner .icon-btn:hover {
            background: #eef6ff;
        }

        .filter-card {
            background: #fff;
            border: 1px solid #e5e9f0;
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .data-toolbar {
            background: #1e88e5;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .data-toolbar .search-input {
            max-width: 360px;
            width: 100%;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            background: #fff;
            color: #333;
        }

        .sort-hint {
            font-size: 11px;
            color: #8c96a5;
            margin-left: 3px;
            white-space: nowrap;
        }

        .page-footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-top: 32px;
            padding-bottom: 10px;
        }

        @media (max-width: 991.98px) {
            .main-content {
                margin-left: 0;
                padding-top: calc(var(--topbar-height) + 14px);
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>

    <main class="main-content">
        <div class="page-banner mb-3">
            <h4 class="m-0 fw-normal">Collection</h4>
            <div class="d-flex gap-2">
                <button class="icon-btn" type="button" onclick="toggleFilterBox()" title="Filter">
                    <i class="fa fa-sliders"></i>
                </button>
                <button class="icon-btn" type="button" onclick="loadCollections()" title="Refresh">
                    <i class="fa fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <div class="filter-card d-none" id="filterBox">
            <form id="filterForm" class="d-flex align-items-center gap-2 flex-wrap">
                <select id="resellerFilter" class="form-select" style="max-width: 240px;">
                    <option value="">All Reseller</option>
                </select>
                <button type="submit" class="btn btn-outline-primary px-3">Filter</button>
                <button type="button" class="btn btn-outline-secondary px-3" id="resetFilterBtn">Reset</button>
            </form>
        </div>

        <div class="card border-0 shadow-sm p-3">
            <div class="data-toolbar mb-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa fa-gear"></i>
                    <span>Total Data:</span>
                    <span class="badge bg-primary border border-light" id="totalData">0</span>
                </div>
                <input type="text" id="searchInput" class="search-input" placeholder="Search" />
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th># <span class="sort-hint">↓↑</span></th>
                            <th>Reseller <span class="sort-hint">↓↑</span></th>
                            <th>Month <span class="sort-hint">↓↑</span></th>
                            <th>Amount <span class="sort-hint">↓↑</span></th>
                            <th>Date <span class="sort-hint">↓↑</span></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">No Data Found !</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="page-footer">© Shunna IT - 2026</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebar-loader.js"></script>
    <script src="/assets/js/topbar-loader.js"></script>
    <script>
        let searchTimer = null;

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatMonth(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "-";
            return d.toLocaleString("en-US", { month: "short", year: "numeric" });
        }

        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "-";
            return d.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function toggleFilterBox() {
            const box = document.getElementById("filterBox");
            box.classList.toggle("d-none");
        }

        async function loadResellerOptions() {
            const select = document.getElementById("resellerFilter");
            try {
                const res = await fetch("/api/bandwidth/resellers", { credentials: "same-origin" });
                const json = await res.json();
                if (!res.ok || !json.success) return;

                const list = Array.isArray(json.data) ? json.data : [];
                const currentVal = select.value;
                select.innerHTML = `<option value="">All Reseller</option>` + list.map((r) =>
                    `<option value="${Number(r.id)}">${escapeHtml(r.reseller_name)}</option>`
                ).join("");
                select.value = currentVal;
            } catch (_) {}
        }

        async function loadCollections() {
            const resellerId = document.getElementById("resellerFilter").value.trim();
            const search = document.getElementById("searchInput").value.trim();
            const tbody = document.getElementById("tableBody");
            const totalEl = document.getElementById("totalData");

            try {
                const params = new URLSearchParams();
                if (resellerId) params.set("reseller_id", resellerId);
                if (search) params.set("search", search);

                const query = params.toString() ? `?${params.toString()}` : "";
                const res = await fetch(`/api/bandwidth/collections${query}`, {
                    credentials: "same-origin"
                });
                const json = await res.json();

                if (!res.ok || !json.success) {
                    throw new Error(json.message || "Failed to load collections.");
                }

                const rows = Array.isArray(json.data) ? json.data : [];
                totalEl.textContent = rows.length;

                if (!rows.length) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No Data Found !</td></tr>`;
                    return;
                }

                tbody.innerHTML = rows.map((row, idx) => {
                    const amount = Number(row.amount || 0).toFixed(2);
                    return `
                        <tr>
                            <td>${idx + 1}</td>
                            <td class="fw-semibold">${escapeHtml(row.reseller_name || "-")}</td>
                            <td>${escapeHtml(formatMonth(row.collected_at))}</td>
                            <td>${escapeHtml(amount)}</td>
                            <td>${escapeHtml(formatDate(row.collected_at))}</td>
                        </tr>
                    `;
                }).join("");
            } catch (err) {
                totalEl.textContent = "0";
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">${escapeHtml(err.message)}</td></tr>`;
            }
        }

        document.getElementById("filterForm").addEventListener("submit", (e) => {
            e.preventDefault();
            loadCollections();
        });

        document.getElementById("resetFilterBtn").addEventListener("click", () => {
            document.getElementById("resellerFilter").value = "";
            document.getElementById("searchInput").value = "";
            loadCollections();
        });

        document.getElementById("searchInput").addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadCollections, 200);
        });

        loadResellerOptions();
        loadCollections();
    </script>
</body>
</html>
