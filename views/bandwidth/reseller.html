<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bandwidth Reseller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --topbar-height: 70px;
            --sidebar-width: 250px;
        }

        body {
            background: #f4f6f9;
            margin: 0;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding-top: calc(var(--topbar-height) + 16px);
            padding-right: 18px;
            padding-bottom: 24px;
            padding-left: 18px;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }

        .page-banner {
            background: #1e88e5;
            color: #fff;
            padding: 14px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-banner .icon-btn {
            width: 38px;
            height: 36px;
            border-radius: 5px;
            background: #fff;
            color: #1e88e5;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .page-banner .icon-btn:hover {
            background: #eef6ff;
        }

        .data-toolbar {
            background: #1e88e5;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .data-toolbar .search-input {
            max-width: 360px;
            width: 100%;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            background: #fff;
            color: #333;
        }

        .sort-hint {
            font-size: 11px;
            color: #8c96a5;
            margin-left: 3px;
            white-space: nowrap;
        }

        .nav-tabs .nav-link {
            color: #495057;
            border: 1px solid transparent;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            padding: 8px 16px;
        }

        .nav-tabs .nav-link.active {
            color: #1e88e5;
            border-color: #dee2e6 #dee2e6 #fff;
            background: #fff;
            font-weight: 500;
        }

        .circle-plus-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #1e88e5;
            color: #fff;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .circle-plus-btn:hover {
            background: #1565c0;
        }

        .page-footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-top: 32px;
            padding-bottom: 10px;
        }

        /* Modal & Backdrop always on top */
        .modal-backdrop {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 2147483640 !important;
        }

        .modal {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 2147483647 !important;
        }

        .modal-dialog {
            position: relative !important;
            z-index: 2147483647 !important;
        }

        .swal2-container {
            z-index: 2147483647 !important;
        }

        @media (max-width: 991.98px) {
            .main-content {
                margin-left: 0;
                padding-top: calc(var(--topbar-height) + 14px);
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>

    <main class="main-content">
        <div class="page-banner mb-3">
            <h4 class="m-0 fw-normal">Bandwidth Reseller</h4>
            <div class="d-flex gap-2">
                <button class="icon-btn" type="button" onclick="loadResellers()" title="Refresh">
                    <i class="fa fa-rotate-right"></i>
                </button>
                <button class="icon-btn" type="button" data-bs-toggle="modal" data-bs-target="#addResellerModal" title="Add Reseller">
                    <i class="fa fa-user-plus"></i>
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-3">
            <div class="data-toolbar mb-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa fa-gear"></i>
                    <span>Total Data:</span>
                    <span class="badge bg-primary border border-light" id="totalData">0</span>
                </div>
                <input type="text" id="searchInput" class="search-input" placeholder="Search" />
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th># <span class="sort-hint">↓↑</span></th>
                            <th>Name <span class="sort-hint">↓↑</span></th>
                            <th>Mobile <span class="sort-hint">↓↑</span></th>
                            <th>Address <span class="sort-hint">↓↑</span></th>
                            <th>Due <span class="sort-hint">↓↑</span></th>
                            <th>Status <span class="sort-hint">↓↑</span></th>
                            <th>Date <span class="sort-hint">↓↑</span></th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4 text-muted">No Data Found !</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="page-footer">© Shunna IT - 2026</div>
    </main>

    <!-- ADD NEW BANDWIDTH RESELLER MODAL -->
    <div class="modal fade" id="addResellerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-normal">Add new bandwidth</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="addResellerForm">
                    <div class="modal-body pt-2">
                        <ul class="nav nav-tabs mb-3" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#tabProfile" type="button" role="tab">
                                    Profile
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="link-info-tab" data-bs-toggle="tab" data-bs-target="#tabLinkInfo" type="button" role="tab">
                                    Link information
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <!-- PROFILE TAB -->
                            <div class="tab-pane fade show active" id="tabProfile" role="tabpanel">
                                <div class="mb-3">
                                    <label class="form-label">Name <span class="text-danger">*</span></label>
                                    <input type="text" name="name" class="form-control" placeholder="e.g. Name" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mobile <span class="text-danger">*</span></label>
                                    <input type="text" name="mobile" class="form-control" placeholder="e.g. 01XXXXXXXXX" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">NID No <span class="text-danger">*</span></label>
                                    <input type="text" name="nid_no" class="form-control" placeholder="e.g. 10,13 or 17 digits" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Address <span class="text-danger">*</span></label>
                                    <input type="text" name="address" class="form-control" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">E-mail <span class="text-danger">*</span></label>
                                    <input type="email" name="email" class="form-control" placeholder="***@mail.com" required />
                                </div>
                                <div class="mb-2">
                                    <label class="form-label d-block">Status <span class="text-danger">*</span></label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="status" id="statusActive" value="active" checked />
                                        <label class="form-check-label" for="statusActive">Active</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="status" id="statusInactive" value="inactive" />
                                        <label class="form-check-label" for="statusInactive">Inactive</label>
                                    </div>
                                </div>
                            </div>

                            <!-- LINK INFORMATION TAB -->
                            <div class="tab-pane fade" id="tabLinkInfo" role="tabpanel">
                                <div class="mb-3">
                                    <label class="form-label">NTTN Info</label>
                                    <input type="text" name="nttn_info" class="form-control" />
                                </div>
                                <div class="row g-2 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">SCR or Link ID</label>
                                        <input type="text" name="scr_or_link_id" class="form-control" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Activation Date</label>
                                        <input type="datetime-local" name="activation_date" id="activationDate" class="form-control" />
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">VLAN Info</label>
                                    <div id="vlanRows" class="d-flex flex-column gap-2">
                                        <div class="d-flex align-items-center gap-2 vlan-row">
                                            <input type="text" class="form-control vlan-name" placeholder="VLAN Name" />
                                            <input type="text" class="form-control vlan-id" placeholder="VLAN ID" />
                                            <button type="button" class="circle-plus-btn" onclick="addVlanRow()" title="Add VLAN">
                                                <i class="fa fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label">IP Address</label>
                                    <div id="ipRows" class="d-flex flex-column gap-2">
                                        <div class="d-flex align-items-center gap-2 ip-row">
                                            <input type="text" class="form-control ip-value" />
                                            <button type="button" class="circle-plus-btn" onclick="addIpRow()" title="Add IP Address">
                                                <i class="fa fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success px-4">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebar-loader.js"></script>
    <script src="/assets/js/topbar-loader.js"></script>
    <script>
        let csrfToken = "";
        let searchTimer = null;

        async function getCsrf(forceRefresh = false) {
            if (csrfToken && !forceRefresh) return csrfToken;
            const res = await fetch("/api/csrf-token", { credentials: "same-origin" });
            const data = await res.json();
            csrfToken = data.csrf_token || "";
            return csrfToken;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return "-";
            return d.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function setDefaultActivationDate() {
            const input = document.getElementById("activationDate");
            if (!input) return;
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            input.value = now.toISOString().slice(0, 16);
        }

        function addVlanRow() {
            const container = document.getElementById("vlanRows");
            const div = document.createElement("div");
            div.className = "d-flex align-items-center gap-2 vlan-row";
            div.innerHTML = `
                <input type="text" class="form-control vlan-name" placeholder="VLAN Name" />
                <input type="text" class="form-control vlan-id" placeholder="VLAN ID" />
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()" title="Remove">
                    <i class="fa fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        function addIpRow() {
            const container = document.getElementById("ipRows");
            const div = document.createElement("div");
            div.className = "d-flex align-items-center gap-2 ip-row";
            div.innerHTML = `
                <input type="text" class="form-control ip-value" />
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()" title="Remove">
                    <i class="fa fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        async function loadResellers() {
            const search = document.getElementById("searchInput").value.trim();
            const tbody = document.getElementById("tableBody");
            const totalEl = document.getElementById("totalData");

            try {
                const query = search ? `?search=${encodeURIComponent(search)}` : "";
                const res = await fetch(`/api/bandwidth/resellers${query}`, { credentials: "same-origin" });
                const json = await res.json();

                if (!res.ok || !json.success) {
                    throw new Error(json.message || "Failed to load resellers.");
                }

                const rows = Array.isArray(json.data) ? json.data : [];
                totalEl.textContent = rows.length;

                if (!rows.length) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No Data Found !</td></tr>`;
                    return;
                }

                tbody.innerHTML = rows.map((r, i) => {
                    const name = r.reseller_name || r.name || "-";
                    const mobile = r.phone || r.mobile || "-";
                    const address = r.address || "-";
                    const due = Number(r.due_amount ?? 0).toFixed(2);
                    const isActive = String(r.status || "active").toLowerCase() === "active";
                    const badgeClass = isActive ? "bg-success" : "bg-secondary";
                    const statusLabel = isActive ? "Active" : "Inactive";

                    return `
                        <tr>
                            <td>${i + 1}</td>
                            <td class="fw-semibold">${escapeHtml(name)}</td>
                            <td>${escapeHtml(mobile)}</td>
                            <td>${escapeHtml(address)}</td>
                            <td>${escapeHtml(due)}</td>
                            <td><span class="badge ${badgeClass}">${statusLabel}</span></td>
                            <td>${escapeHtml(formatDate(r.created_at))}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-danger" type="button" onclick="deleteReseller(${Number(r.id)})" title="Delete">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join("");
            } catch (err) {
                totalEl.textContent = "0";
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${escapeHtml(err.message)}</td></tr>`;
            }
        }

        document.getElementById("addResellerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const fd = new FormData(form);

            const vlans = Array.from(document.querySelectorAll("#vlanRows .vlan-row"))
                .map((row) => ({
                    vlan_name: row.querySelector(".vlan-name")?.value.trim() || "",
                    vlan_id: row.querySelector(".vlan-id")?.value.trim() || ""
                }))
                .filter((v) => v.vlan_name || v.vlan_id);

            const ips = Array.from(document.querySelectorAll("#ipRows .ip-row .ip-value"))
                .map((inp) => inp.value.trim())
                .filter(Boolean);

            const payload = {
                reseller_name: String(fd.get("name") || "").trim(),
                phone: String(fd.get("mobile") || "").trim(),
                nid_no: String(fd.get("nid_no") || "").trim(),
                address: String(fd.get("address") || "").trim(),
                email: String(fd.get("email") || "").trim(),
                status: fd.get("status") === "inactive" ? "inactive" : "active",
                nttn_info: String(fd.get("nttn_info") || "").trim(),
                scr_or_link_id: String(fd.get("scr_or_link_id") || "").trim(),
                activation_date: String(fd.get("activation_date") || "").trim(),
                vlans,
                ip_addresses: ips
            };

            try {
                let token = await getCsrf();
                let res = await fetch("/api/bandwidth/resellers", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-Token": token
                    },
                    body: JSON.stringify(payload)
                });

                if (res.status === 403) {
                    token = await getCsrf(true);
                    res = await fetch("/api/bandwidth/resellers", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRF-Token": token
                        },
                        body: JSON.stringify(payload)
                    });
                }

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.message || "Failed to save reseller.");
                }

                form.reset();
                setDefaultActivationDate();
                const modalEl = document.getElementById("addResellerModal");
                const modalInstance = bootstrap.Modal.getInstance(modalEl);
                if (modalInstance) modalInstance.hide();

                await loadResellers();
                Swal.fire({
                    icon: "success",
                    title: "Saved",
                    text: data.message || "Bandwidth reseller added successfully.",
                    timer: 1400,
                    showConfirmButton: false
                });
            } catch (err) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: err.message
                });
            }
        });

        async function deleteReseller(id) {
            const confirmResult = await Swal.fire({
                title: "Delete reseller?",
                text: "This action cannot be undone.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#dc3545",
                confirmButtonText: "Yes, delete"
            });

            if (!confirmResult.isConfirmed) return;

            try {
                let token = await getCsrf();
                let res = await fetch(`/api/bandwidth/resellers/${id}`, {
                    method: "DELETE",
                    credentials: "same-origin",
                    headers: { "X-CSRF-Token": token }
                });

                if (res.status === 403) {
                    token = await getCsrf(true);
                    res = await fetch(`/api/bandwidth/resellers/${id}`, {
                        method: "DELETE",
                        credentials: "same-origin",
                        headers: { "X-CSRF-Token": token }
                    });
                }

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.message || "Failed to delete reseller.");
                }

                await loadResellers();
                Swal.fire({
                    icon: "success",
                    title: "Deleted",
                    text: data.message || "Reseller deleted.",
                    timer: 1300,
                    showConfirmButton: false
                });
            } catch (err) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: err.message
                });
            }
        }

        document.getElementById("searchInput").addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadResellers, 200);
        });

        setDefaultActivationDate();
        loadResellers();

        // Keep modals above topbar and sidebar
        document.addEventListener("show.bs.modal", function (event) {
            const modal = event.target;
            document.body.appendChild(modal);

            modal.style.setProperty("z-index", "2147483647", "important");
            document.querySelectorAll(".modal-backdrop").forEach((bd) => {
                document.body.appendChild(bd);
                bd.style.setProperty("z-index", "2147483640", "important");
            });

            document.querySelectorAll("#sidebarContainer, #topbarContainer, .sidebar, .topbar").forEach((el) => {
                el.style.setProperty("z-index", "10", "important");
                el.querySelectorAll("*").forEach((child) => {
                    child.style.setProperty("z-index", "10", "important");
                });
            });
        });

        document.addEventListener("hidden.bs.modal", function () {
            document.querySelectorAll("#sidebarContainer, #topbarContainer, .sidebar, .topbar").forEach((el) => {
                el.style.removeProperty("z-index");
                el.querySelectorAll("*").forEach((child) => child.style.removeProperty("z-index"));
            });
        });
    </script>
</body>
</html>
