<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/activity-log.css">
</head>

<body>

<div id="sidebarContainer"></div>

<div class="main-content">

    <div id="topbarContainer"></div>

    <div class="al-top-spacer"></div>

    <div class="container-fluid pb-3 al-page">

        <!-- HEADER -->
        <div class="al-header">
            <h3 class="al-title">Activity Log</h3>
            <div class="al-header-actions">
                <button type="button" class="al-icon-btn" id="csvBtn" title="CSV">
                    <i class="fas fa-file-csv"></i>
                </button>
                <button type="button" class="al-icon-btn" id="printBtn" title="Print">
                    <i class="fas fa-print"></i>
                </button>
                <button type="button" class="al-icon-btn" id="toggleFilterBtn" title="Filter">
                    <i class="fas fa-filter"></i>
                </button>
                <button type="button" class="al-icon-btn" id="refreshBtn" title="Refresh">
                    <i class="fas fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- FILTER BAR -->
        <div class="al-filter-card" id="filterCard">
            <select id="createdBy" class="form-select al-select">
                <option value="">Created By</option>
            </select>

            <select id="actionFilter" class="form-select al-select">
                <option value="">Action</option>
                <option value="create">Create</option>
                <option value="update">Update</option>
                <option value="delete">Delete</option>
                <option value="recharge">Recharge</option>
            </select>

            <input type="date" id="fromDate" class="form-control al-select" title="From">
            <input type="date" id="toDate" class="form-control al-select" title="To">

            <button type="button" id="filterBtn" class="btn btn-outline-primary al-btn">Filter</button>
            <button type="button" id="resetBtn" class="btn btn-outline-secondary al-btn">Reset</button>
        </div>

        <!-- TOTAL + SEARCH -->
        <div class="al-card">

            <div class="al-total-bar">
                <div class="al-total">
                    <i class="fas fa-gear me-1"></i>
                    Total Data:
                    <span class="al-total-pill" id="totalData">0</span>
                    <span class="al-company" id="companyBadge"></span>
                </div>

                <input type="text" id="search" class="al-search" placeholder="Search" autocomplete="off">
            </div>

            <!-- TABLE -->
            <div class="activity-table-wrapper">
                <table class="table al-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th data-sort="serial"      class="sortable">#</th>
                            <th data-sort="description" class="sortable">Description</th>
                            <th data-sort="module"      class="sortable">Module</th>
                            <th data-sort="ip_address"  class="sortable">IP Address</th>
                            <th data-sort="user_name"   class="sortable">Role</th>
                            <th data-sort="action"      class="sortable">Action</th>
                            <th data-sort="created_at"  class="sortable">Date</th>
                            <th class="text-center">View</th>
                        </tr>
                    </thead>
                    <tbody id="activityBody">
                        <tr><td colspan="8" class="text-center py-5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- FOOTER -->
            <div class="al-footer">
                <div class="d-flex align-items-center gap-2">
                    <select id="limit" class="form-select form-select-sm activity-limit">
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                        <option value="5000">5000</option>
                        <option value="100000">All</option>
                    </select>
                    <span id="pageInfo" class="text-muted small ms-2"></span>
                </div>

                <nav><ul id="pagination" class="pagination pagination-sm mb-0"></ul></nav>
            </div>

        </div>
    </div>
</div>

<!-- VIEW MODAL -->
<div class="modal fade" id="activityViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Activity Log Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="row al-meta">
                    <div class="col-3 al-meta-label" id="viewModule">-</div>
                    <div class="col-3" id="viewActionBadge"></div>
                    <div class="col-3 al-meta-label" id="viewByLabel">By</div>
                    <div class="col-3" id="viewRoleBadge"></div>

                    <div class="col-3 al-meta-label">IP Address</div>
                    <div class="col-3" id="viewIp">-</div>
                    <div class="col-3 al-meta-label">Created At</div>
                    <div class="col-3" id="viewDate">-</div>
                </div>

                <label class="al-field-label mt-3">Description <span class="text-danger">*</span></label>
                <input type="text" id="viewDescription" class="form-control al-readonly" readonly>

                <div class="row g-3 mt-1" id="stateRow">
                    <div class="col-md-6">
                        <div class="al-state">
                            <div class="al-state-head">Previous State</div>
                            <div id="viewOldState" class="al-state-body"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="al-state">
                            <div class="al-state-head">Current State</div>
                            <div id="viewNewState" class="al-state-body"></div>
                        </div>
                    </div>
                </div>

                <div class="al-agent mt-3">
                    <div class="al-agent-label">User Agent</div>
                    <div id="viewUserAgent" class="al-agent-text"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="/assets/js/activity-log.js"></script>

<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>
</html>
