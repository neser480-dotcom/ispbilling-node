<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirm Manual Payment</title>

    <link
        rel="stylesheet"
        href="/assets/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/topbar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/billing.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>

<body>

<div id="sidebar"></div>

<div id="topbar"></div>

<main class="main-content">

    <div class="billing-card">

        <h3>
            Confirm Manual Payment
        </h3>

        <div
            id="paymentMessage"
            class="notice"
            style="display:none;"
        ></div>

        <div
            id="paymentLoading"
            class="text-center py-4"
        >
            <div
                class="spinner-border"
                role="status"
            ></div>

            <div class="mt-2">
                Loading billing information...
            </div>
        </div>

        <div
            id="paymentContent"
            style="display:none;"
        >

            <div class="summary">

                <div>
                    <small>Billing</small>
                    <b id="billingId">—</b>
                </div>

                <div>
                    <small>User</small>
                    <b id="userId">—</b>
                </div>

                <div>
                    <small>Package</small>
                    <b id="packageCode">—</b>
                </div>

                <div>
                    <small>Amount</small>
                    <b id="billingAmount">৳0.00</b>
                </div>

            </div>

            <form id="manualPaymentForm">

                <label for="paymentMethod">
                    Payment Method
                </label>

                <select
                    id="paymentMethod"
                    name="method"
                    required
                >
                    <option value="Cash">Cash</option>
                    <option value="Bank">Bank</option>
                    <option value="bKash">bKash</option>
                    <option value="Nagad">Nagad</option>
                    <option value="Other">Other</option>
                </select>

                <label for="paymentReference">
                    Reference / Transaction No.
                </label>

                <input
                    type="text"
                    id="paymentReference"
                    name="reference"
                    maxlength="150"
                    autocomplete="off"
                >

                <label for="paymentNote">
                    Note
                </label>

                <textarea
                    id="paymentNote"
                    name="note"
                    rows="3"
                ></textarea>

                <button
                    class="manual"
                    type="submit"
                    id="confirmPaymentButton"
                >
                    Confirm Paid
                </button>

                <a
                    class="back"
                    href="/billing/manual"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</main>

<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>

<script src="/assets/js/billing-manual.js"></script>

</body>
</html>
