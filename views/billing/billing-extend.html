<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extend Due Date - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <style>
        .ext-page { padding: 20px; margin-top: 80px; }
        .ext-card { border: 0; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        .ext-table { min-width: 860px; margin: 0; }
        .ext-table th { background: #f8f9fa; font-size: 13px; white-space: nowrap; }
        .b { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .b-over { background: #f8d7da; color: #c92a2a; }
        .b-ok { background: #d3f9d8; color: #2b8a3e; }
        .b-ext { background: #fff3bf; color: #e67700; }
        @media (max-width: 768px) { .ext-page { padding: 12px; } }
    </style>
</head>
<body>
<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<div class="main-content">
<main class="ext-page">
    <h3 class="mb-1"><i class="fa fa-calendar-plus"></i> Extend Due Date</h3>
    <p class="text-muted">Unpaid monthly bills. Extending moves the due date for that one user only.</p>

    <div id="pageAlert" class="alert alert-danger" style="display:none"></div>

    <div class="card ext-card">
        <div class="table-responsive">
            <table class="table table-hover ext-table align-middle">
                <thead>
                    <tr><th>#</th><th>User / Company</th><th>Package</th><th>Amount</th><th>Due date</th><th>Original</th><th>State</th><th>Action</th></tr>
                </thead>
                <tbody id="body"><tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>
</div>

<div class="modal fade" id="extModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="extForm">
            <div class="modal-header">
                <h5 class="modal-title">Extend due date</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="formAlert" class="alert alert-danger" style="display:none"></div>
                <p class="mb-2"><strong id="mName"></strong><br><span class="text-muted small" id="mCur"></span></p>
                <input type="hidden" id="mId">
                <label class="form-label" for="mDate">New due date &amp; time</label>
                <input type="datetime-local" id="mDate" class="form-control" required>
                <div class="d-flex gap-2 mt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-add="3">+3 days</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-add="7">+7 days</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-add="15">+15 days</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    "use strict";
    const BASE = "/super-admin/billing-extend/api";
    const $ = id => document.getElementById(id);
    const modal = new bootstrap.Modal($("extModal"));
    let rows = [], csrf = "";

    const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    const toInput = s => String(s).replace(" ", "T").slice(0, 16);

    async function token() {
        if (!csrf) {
            const r = await fetch("/api/csrf-token", { credentials: "same-origin" });
            csrf = (await r.json().catch(() => ({}))).csrf_token || "";
        }
        return csrf;
    }

    async function api(method, url, body) {
        const h = { Accept: "application/json" };
        if (body) h["Content-Type"] = "application/json";
        if (method !== "GET") h["X-CSRF-Token"] = await token();
        const r = await fetch(url, { method, headers: h, credentials: "same-origin", body: body ? JSON.stringify(body) : undefined });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || d.success === false) throw new Error(d.message || "HTTP " + r.status);
        return d;
    }

    function load() {
        api("GET", BASE + "/list").then(d => {
            rows = d.rows || [];
            $("pageAlert").style.display = "none";
            render();
        }).catch(e => {
            $("pageAlert").textContent = e.message;
            $("pageAlert").style.display = "block";
        });
    }

    function render() {
        if (!rows.length) {
            $("body").innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No unpaid monthly bills.</td></tr>';
            return;
        }
        $("body").innerHTML = rows.map(r => `
            <tr>
                <td>${r.id}</td>
                <td><div class="fw-semibold">${esc(r.user_name)}</div><div class="small text-muted">@${esc(r.username)} · company #${r.company_id}</div></td>
                <td>${esc(r.package_code)}</td>
                <td>${esc(r.amount)} Tk</td>
                <td class="text-nowrap">${esc(r.due_date)}</td>
                <td class="text-nowrap text-muted">${esc(r.original_due_date || "-")}</td>
                <td>${Number(r.overdue) ? '<span class="b b-over">Overdue</span>' : '<span class="b b-ok">Running</span>'}${r.extended_at ? ' <span class="b b-ext">Extended</span>' : ""}</td>
                <td><button class="btn btn-sm btn-outline-primary" data-id="${r.id}"><i class="fa fa-calendar-plus"></i> Extend</button></td>
            </tr>`).join("");
    }

    $("body").addEventListener("click", e => {
        const b = e.target.closest("[data-id]");
        if (!b) return;
        const r = rows.find(x => String(x.id) === b.dataset.id);
        $("formAlert").style.display = "none";
        $("mId").value = r.id;
        $("mName").textContent = r.user_name;
        $("mCur").textContent = "Current due: " + r.due_date;
        const base = Number(r.overdue) ? new Date() : new Date(r.due_date.replace(" ", "T"));
        base.setDate(base.getDate() + 7);
        $("mDate").value = toInput(fmt(base));
        modal.show();
    });

    function fmt(d) {
        const p = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
        const d = new Date($("mDate").value || Date.now());
        d.setDate(d.getDate() + Number(b.dataset.add));
        $("mDate").value = toInput(fmt(d));
    }));

    $("extForm").addEventListener("submit", async e => {
        e.preventDefault();
        $("saveBtn").disabled = true;
        try {
            await api("POST", BASE, { billing_id: Number($("mId").value), due_date: $("mDate").value });
            modal.hide();
            load();
        } catch (err) {
            $("formAlert").textContent = err.message;
            $("formAlert").style.display = "block";
        } finally {
            $("saveBtn").disabled = false;
        }
    });

    load();
});
</script>
</body>
</html>
