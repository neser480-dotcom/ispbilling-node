<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sub Area</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="/assets/css/area.css">

</head>


<body>


<div id="sidebarContainer"></div>

<div id="topbarContainer"></div>


<div class="main-content">


    <div
        class="card shadow-sm border-0 rounded-3">


        <!-- HEADER -->

        <div
            class="card-header bg-success text-white py-3">


            <div
                class="d-flex justify-content-between align-items-center">


                <h4
                    class="mb-0 fw-bold fs-4">


                    <a
                        href="/area"
                        class="text-white me-2"
                        title="Back">

                        <i
                            class="fa fa-arrow-left">
                        </i>

                    </a>


                    Sub Area


                    <span
                        class="badge bg-white text-success px-3 ms-2"
                        id="mainAreaBadge">

                        Loading...

                    </span>


                </h4>


                <button
                    type="button"
                    class="btn btn-light btn-sm fw-bold px-3 text-success"
                    data-bs-toggle="modal"
                    data-bs-target="#addSubAreaModal">

                    <i
                        class="fa fa-plus-circle me-1">
                    </i>

                    Add Sub Area

                </button>

            </div>

        </div>


        <!-- BODY -->

        <div
            class="card-body p-4">


            <!-- TOTAL -->

            <div
                class="bg-light p-2 mb-3 rounded fw-bold text-secondary shadow-sm">


                <i
                    class="fa fa-map-marker me-2">
                </i>


                Area:


                <strong
                    class="text-success"
                    id="mainAreaName">

                    Loading...

                </strong>


                <span
                    class="ms-3">

                    Total Sub Areas:


                    <span
                        class="badge bg-success text-white"
                        id="totalSubAreaCount">

                        0

                    </span>

                </span>

            </div>


            <!-- TABLE -->

            <div
                class="table-responsive">


                <table
                    class="table table-hover align-middle">


                    <thead
                        class="table-dark">

                        <tr>

                            <th width="70">
                                #
                            </th>

                            <th>
                                Sub Area Name
                            </th>

                            <th>
                                Remarks
                            </th>

                            <th width="180">
                                Created At
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="subAreaTableBody">


                        <tr>

                            <td
                                colspan="4"
                                class="text-center py-5 text-muted">

                                <i
                                    class="fa fa-spinner fa-spin fa-2x mb-2 d-block">
                                </i>

                                Loading...

                            </td>

                        </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ADD SUB AREA -->

<div
    class="modal fade"
    id="addSubAreaModal"
    tabindex="-1"
    aria-hidden="true">


    <div
        class="modal-dialog modal-dialog-centered">


        <div
            class="modal-content border-0 shadow">


            <form
                id="addSubAreaForm">


                <div
                    class="modal-header bg-success text-white">


                    <h5
                        class="modal-title fw-bold">

                        <i
                            class="fa fa-plus-circle me-2">
                        </i>

                        Add New Sub Area

                    </h5>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <!-- MAIN AREA -->

                    <div
                        class="mb-3">


                        <label
                            class="form-label fw-medium">

                            Main Area

                        </label>


                        <input
                            type="text"
                            id="subMainAreaReadonly"
                            class="form-control bg-light"
                            readonly>

                    </div>


                    <!-- NAME -->

                    <div
                        class="mb-3">


                        <label
                            class="form-label fw-medium">

                            Sub Area Name

                            <span
                                class="text-danger">

                                *

                            </span>

                        </label>


                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="নিজের মতো Sub Area নাম লিখুন"
                            required>


                        <small
                            class="text-muted">

                            যেমন: কারারকান্দি, বাজার, ব্লক-A, রোড-৫

                        </small>

                    </div>


                    <!-- REMARKS -->

                    <div
                        class="mb-3">


                        <label
                            class="form-label fw-medium">

                            Remarks

                        </label>


                        <textarea
                            name="remarks"
                            rows="3"
                            class="form-control"
                            placeholder="Optional details..."></textarea>

                    </div>

                </div>


                <div
                    class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="btn btn-success">

                        <i
                            class="fa fa-save me-1">
                        </i>

                        Save Sub Area

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script
    src="/assets/js/sidebar-loader.js">
</script>


<script
    src="/assets/js/topbar-loader.js">
</script>


<script
    src="/assets/js/sub-area.js">
</script>


</body>

</html>
