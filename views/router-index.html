<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MikroTik Router Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/assets/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/topbar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/router.css"
    >

</head>


<body>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<div id="sidebarContainer"></div>


<!-- =========================================================
     TOPBAR
========================================================= -->

<div id="topbarContainer"></div>


<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<div class="main-content">

    <div class="container-fluid">

        <div class="card shadow-sm border-0">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div class="card-header bg-primary text-white">

                <div class="d-flex justify-content-between align-items-center">

                    <div class="d-flex align-items-center">

                        <span
                            class="badge bg-light text-primary fs-6 me-2 px-3 py-2"
                        >

                            <i class="fa fa-server"></i>

                            MikroTik

                        </span>

                        <h5
                            class="mb-0 text-white fw-bold"
                            id="routerPanelTitle"
                        >
                            Router Manager
                        </h5>

                    </div>


                    <button
                        type="button"
                        class="btn btn-light btn-sm"
                        id="addRouter"
                    >

                        <i class="fa fa-plus"></i>

                        Add Router

                    </button>

                </div>

            </div>


            <!-- =================================================
                 BODY
            ================================================== -->

            <div class="card-body">


                <!-- =================================================
                     TOOLBAR
                ================================================== -->

                <div
                    class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
                >

                    <div>

                        <span
                            class="badge bg-primary px-3 py-2"
                            id="companyInfo"
                        >
                            Loading...
                        </span>

                        <span
                            class="badge bg-secondary px-3 py-2 ms-2"
                            id="totalRouter"
                        >
                            Total Router: 0
                        </span>

                    </div>


                    <div class="d-flex gap-2">

                        <input
                            type="text"
                            id="routerSearch"
                            class="form-control form-control-sm"
                            placeholder="Search router..."
                        >

                        <button
                            type="button"
                            class="btn btn-outline-primary btn-sm"
                            id="refreshRouters"
                            title="Refresh"
                        >

                            <i class="fa fa-refresh"></i>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     TABLE
                ================================================== -->

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle mb-0"
                        id="routerTable"
                    >

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>Name</th>

                                <th>Username</th>

                                <th>IP</th>

                                <th>Port</th>

                                <th>Status</th>

                                <th class="text-center">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="routerTableBody">

                            <tr>

                                <td
                                    colspan="7"
                                    class="text-center text-muted py-4"
                                >

                                    Loading...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL ROOT
========================================================= -->

<div id="modalRoot"></div>


<!-- =========================================================
     BOOTSTRAP
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- =========================================================
     SIDEBAR LOADER
========================================================= -->

<script src="/assets/js/sidebar-loader.js"></script>


<!-- =========================================================
     TOPBAR LOADER
========================================================= -->

<script src="/assets/js/topbar-loader.js"></script>


<!-- =========================================================
     SWEETALERT
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
></script>


<!-- =========================================================
     ROUTER MANAGER JS
========================================================= -->

<script src="/assets/js/router-index.js"></script>


</body>

</html>
