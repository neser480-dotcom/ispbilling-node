<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MikroTik Configuration</title>


    <!--
    |--------------------------------------------------------------------------
    | SIDEBAR / TOPBAR CSS
    |--------------------------------------------------------------------------
    -->

    <link
        rel="stylesheet"
        href="/assets/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/topbar.css"
    >


    <!--
    |--------------------------------------------------------------------------
    | MIKROTIK CSS
    |--------------------------------------------------------------------------
    -->

    <link
        rel="stylesheet"
        href="/assets/css/router.css"
    >


    <!--
    |--------------------------------------------------------------------------
    | BOOTSTRAP
    |--------------------------------------------------------------------------
    -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!--
    |--------------------------------------------------------------------------
    | FONT AWESOME
    |--------------------------------------------------------------------------
    -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!--
    |--------------------------------------------------------------------------
    | SIDEBAR
    |--------------------------------------------------------------------------
    -->

    <div id="sidebarContainer"></div>


    <!--
    |--------------------------------------------------------------------------
    | TOPBAR
    |--------------------------------------------------------------------------
    -->

    <div id="topbarContainer"></div>


    <!--
    |--------------------------------------------------------------------------
    | MAIN CONTENT
    |--------------------------------------------------------------------------
    -->

    <main
        class="main-content"
        style="
            margin-left:250px;
            padding:90px 20px 30px;
        "
    >


        <!--
        |--------------------------------------------------------------------------
        | PAGE HEADER
        |--------------------------------------------------------------------------
        -->

        <div
            class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"
        >

            <div>

                <h4
                    id="routerTitle"
                    class="mb-1"
                >
                    MikroTik Configuration
                </h4>

                <div
                    class="text-muted small"
                >
                    Manage router connection, PPPoE packages and customers
                </div>

            </div>


            <div
                class="d-flex flex-wrap gap-2"
            >


                <!-- BACK -->

                <a
                    href="/mikrotik"
                    class="btn btn-light border"
                >

                    <i class="fa fa-arrow-left"></i>

                    Back

                </a>


                <!-- CHECK CONNECTION -->

                <button
                    type="button"
                    class="btn btn-success"
                    id="checkRouter"
                >

                    <i class="fa fa-plug"></i>

                    Check Connection

                </button>


                <!-- EDIT -->

                <button
                    type="button"
                    class="btn btn-primary"
                    id="editRouter"
                >

                    <i class="fa fa-edit"></i>

                    Edit Router

                </button>

            </div>

        </div>


        <!--
        |--------------------------------------------------------------------------
        | TABS
        |--------------------------------------------------------------------------
        -->

        <ul
            class="nav nav-tabs mb-3"
            role="tablist"
        >

            <li
                class="nav-item"
                role="presentation"
            >

                <button
                    class="nav-link active"
                    type="button"
                >

                    <i class="fa fa-users"></i>

                    PPPoE

                </button>

            </li>

        </ul>


        <!--
        |--------------------------------------------------------------------------
        | ACTION BAR
        |--------------------------------------------------------------------------
        -->

        <div
            class="card border-0 shadow-sm mb-3"
        >

            <div
                class="card-body"
            >

                <div
                    class="row g-2 align-items-center"
                >


                    <!-- PACKAGE -->

                    <div
                        class="col-md-4"
                    >

                        <label
                            class="form-label small text-muted mb-1"
                        >
                            Package
                        </label>


                        <select
                            id="packageSelect"
                            class="form-select"
                        >

                            <option value="">
                                Select Package
                            </option>

                        </select>

                    </div>


                    <!-- PACKAGE SYNC -->

                    <div
                        class="col-md-auto"
                    >

                        <label
                            class="form-label small text-muted mb-1 d-block"
                        >
                            &nbsp;
                        </label>


                        <button
                            type="button"
                            class="btn btn-primary"
                            id="syncPackage"
                        >

                            <i class="fa fa-refresh"></i>

                            Package Sync

                        </button>

                    </div>


                    <!-- CUSTOMER SYNC -->

                    <div
                        class="col-md-auto"
                    >

                        <label
                            class="form-label small text-muted mb-1 d-block"
                        >
                            &nbsp;
                        </label>


                        <button
                            type="button"
                            class="btn btn-info text-white"
                            id="syncCustomer"
                        >

                            <i class="fa fa-users"></i>

                            Customer Sync

                        </button>

                    </div>


                </div>

            </div>

        </div>


        <!--
        |--------------------------------------------------------------------------
        | ROUTER INFORMATION
        |--------------------------------------------------------------------------
        -->

        <div
            class="card border-0 shadow-sm mb-3"
        >

            <div
                class="card-header bg-white"
            >

                <strong>

                    <i class="fa fa-server"></i>

                    Router Information

                </strong>

            </div>


            <div
                class="card-body"
            >

                <div
                    class="row g-3"
                >


                    <!-- NAME -->

                    <div
                        class="col-md-3"
                    >

                        <div
                            class="small text-muted"
                        >
                            Router Name
                        </div>

                        <div
                            id="routerName"
                            class="fw-semibold"
                        >
                            -
                        </div>

                    </div>


                    <!-- IP -->

                    <div
                        class="col-md-3"
                    >

                        <div
                            class="small text-muted"
                        >
                            IP Address
                        </div>

                        <div
                            id="routerIp"
                            class="fw-semibold"
                        >
                            -
                        </div>

                    </div>


                    <!-- USERNAME -->

                    <div
                        class="col-md-3"
                    >

                        <div
                            class="small text-muted"
                        >
                            Username
                        </div>

                        <div
                            id="routerUsername"
                            class="fw-semibold"
                        >
                            -
                        </div>

                    </div>


                    <!-- PORT -->

                    <div
                            class="col-md-3"
                    >

                        <div
                            class="small text-muted"
                        >
                            Port
                        </div>

                        <div
                            id="routerPort"
                            class="fw-semibold"
                        >
                            -
                        </div>

                    </div>


                </div>

            </div>

        </div>


        <!--
        |--------------------------------------------------------------------------
        | PACKAGE SECTION
        |--------------------------------------------------------------------------
        -->

        <div
            class="card border-0 shadow-sm"
        >


            <!-- HEADER -->

            <div
                class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2"
            >

                <div>

                    <strong>

                        <i class="fa fa-box"></i>

                        MikroTik Packages

                    </strong>


                    <span
                        class="badge bg-secondary ms-2"
                        id="totalPackageCount"
                    >
                        0
                    </span>

                </div>


                <!-- SEARCH -->

                <div
                    style="max-width:300px;width:100%;"
                >

                    <div
                        class="input-group"
                    >

                        <span
                            class="input-group-text"
                        >

                            <i class="fa fa-search"></i>

                        </span>


                        <input
                            type="search"
                            id="packageSearch"
                            class="form-control"
                            placeholder="Search package..."
                            autocomplete="off"
                        >

                    </div>

                </div>

            </div>


            <!-- TABLE -->

            <div
                class="table-responsive"
            >

                <table
                    class="table table-hover align-middle mb-0"
                >

                    <thead
                        class="table-light"
                    >

                        <tr>

                            <th
                                style="width:70px;"
                            >
                                #
                            </th>

                            <th>
                                Package Name
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Alias
                            </th>

                            <th
                                class="text-center"
                                style="width:150px;"
                            >
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="packageTable"
                    >

                        <tr>

                            <td
                                colspan="5"
                                class="text-center text-muted py-4"
                            >

                                Loading packages...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </main>


    <!--
    |--------------------------------------------------------------------------
    | MODAL ROOT
    |--------------------------------------------------------------------------
    -->

    <div
        id="modalRoot"
    ></div>


    <!--
    |--------------------------------------------------------------------------
    | BOOTSTRAP JS
    |--------------------------------------------------------------------------
    -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!--
    |--------------------------------------------------------------------------
    | SIDEBAR / TOPBAR LOADERS
    |--------------------------------------------------------------------------
    -->

    <script
        src="/assets/js/sidebar-loader.js"
        defer
    ></script>

    <script
        src="/assets/js/topbar-loader.js"
        defer
    ></script>


    <!--
    |--------------------------------------------------------------------------
    | SWEETALERT
    |--------------------------------------------------------------------------
    -->

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>


    <!--
    |--------------------------------------------------------------------------
    | MIKROTIK JS
    |--------------------------------------------------------------------------
    -->

    <script
        src="/assets/js/mikrotik.js"
        defer
    ></script>


</body>

</html>
