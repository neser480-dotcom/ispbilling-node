<style>
.cm-wrap{
    width:100%;
    background:#f1f3f6;
    padding:18px;
    box-sizing:border-box;
}

.cm-page{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    background:#fff;
    border:1px solid #dfe3e8;
    border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
    overflow:hidden;
}

.cm-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.cm-badge{
    font-size:15px;
    font-weight:600;
    color:#202124;
}

.cm-close{
    border:0;
    background:transparent;
    font-size:22px;
    line-height:1;
    color:#6b7280;
    cursor:pointer;
    padding:2px 6px;
}

.cm-body{
    padding:16px;
}

.cm-lbl{
    display:block;
    margin-bottom:5px;
    font-size:13px;
    font-weight:600;
    color:#374151;
}

.req{
    color:#dc2626;
}

.cm-in,
.cm-sel{
    width:100%;
    height:36px;
    padding:6px 10px;
    border:1px solid #d1d5db;
    border-radius:5px;
    background:#fff;
    color:#111827;
    font-size:13px;
    box-sizing:border-box;
    outline:none;
}

.cm-in:focus,
.cm-sel:focus{
    border-color:#86b7fe;
    box-shadow:0 0 0 2px rgba(13,110,253,.08);
}

.cm-in:disabled,
.cm-sel:disabled{
    background:#f3f4f6;
    cursor:not-allowed;
}

.cm-chk{
    display:flex;
    align-items:center;
    gap:7px;
    min-height:36px;
    font-size:13px;
    color:#374151;
}

.cm-chk input{
    margin:0;
}

.cm-info{
    margin-top:12px;
    padding:9px 11px;
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#1e40af;
    border-radius:5px;
    font-size:12px;
}

.cm-foot{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:12px 16px;
    border-top:1px solid #e5e7eb;
    background:#fafafa;
}

.cm-btn{
    height:36px;
    padding:0 16px;
    border:0;
    border-radius:5px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
}

.cm-cancel{
    background:#e5e7eb;
    color:#374151;
}

.cm-save{
    background:#0d6efd;
    color:#fff;
}

.cm-save:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.cm-row{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-bottom:12px;
}

.cm-row.one{
    grid-template-columns:1fr;
}

.cm-field{
    min-width:0;
}

@media(max-width:700px){
    .cm-wrap{
        padding:8px;
    }

    .cm-body{
        padding:12px;
    }

    .cm-row{
        grid-template-columns:1fr;
        gap:10px;
        margin-bottom:10px;
    }

    .cm-foot{
        padding:10px 12px;
    }
}
</style>


<div class="cm-wrap">

<script>
(function(){

    'use strict';


    /*
    |--------------------------------------------------------------------------
    | PREVENT DUPLICATE INITIALIZATION
    |--------------------------------------------------------------------------
    */

    const form =
        document.getElementById(
            'addNewCustomerForm'
        );

    if (!form) {
        return;
    }

    if (form.dataset.initialized === '1') {
        return;
    }

    form.dataset.initialized = '1';


    /*
    |--------------------------------------------------------------------------
    | ELEMENTS
    |--------------------------------------------------------------------------
    */

    const csrfInput =
        document.getElementById(
            'add_csrf_token'
        );

    const mikrotik =
        document.getElementById(
            'add_mikrotik'
        );

    const packageSelect =
        document.getElementById(
            'add_package'
        );

    const monthlyFee =
        document.getElementById(
            'monthly_fee'
        );

    const area =
        document.getElementById(
            'add_area_id'
        );

    const subArea =
        document.getElementById(
            'add_sub_area_id'
        );

    const division =
        document.getElementById(
            'add_division_id'
        );

    const district =
        document.getElementById(
            'add_district_id'
        );

    const upazila =
        document.getElementById(
            'add_upazila_id'
        );

    const submitButton =
        document.getElementById(
            'addCustomerSubmit'
        );


    /*
    |--------------------------------------------------------------------------
    | RESET SELECT
    |--------------------------------------------------------------------------
    */

    function resetSelect(
        select,
        text,
        disabled
    ){

        if (!select) {
            return;
        }

        select.innerHTML =
            '<option value="">' +
            text +
            '</option>';

        select.disabled =
            disabled;
    }


    /*
    |--------------------------------------------------------------------------
    | JSON RESPONSE
    |--------------------------------------------------------------------------
    */

    async function getJson(response){

        let data;

        try {

            data =
                await response.json();

        } catch (error) {

            throw new Error(
                'Invalid server response.'
            );

        }


        if (!response.ok) {

            throw new Error(
                data &&
                data.message
                    ? data.message
                    : 'Request failed.'
            );

        }


        if (
            data &&
            data.success === false
        ) {

            throw new Error(
                data.message ||
                'Request failed.'
            );

        }


        return data;
    }


    /*
    |--------------------------------------------------------------------------
    | LOAD META
    |--------------------------------------------------------------------------
    */

    async function loadMeta(){

        const response =
            await fetch(
                '/api/customers/add/form',
                {
                    method: 'GET',

                    credentials:
                        'same-origin',

                    headers:{
                        'X-Requested-With':
                            'XMLHttpRequest',

                        'Accept':
                            'application/json'
                    }
                }
            );


        const data =
            await getJson(
                response
            );


        /*
        |--------------------------------------------------------------------------
        | CSRF
        |--------------------------------------------------------------------------
        */

        if (
            csrfInput &&
            data.csrf_token
        ) {

            csrfInput.value =
                data.csrf_token;

        }


        /*
        |--------------------------------------------------------------------------
        | MIKROTIK
        |--------------------------------------------------------------------------
        */

        if (!mikrotik) {
            return;
        }


        mikrotik.innerHTML =
            '<option value="">' +
            'Select MikroTik' +
            '</option>';


        const routers =
            Array.isArray(
                data.mikrotiks
            )
                ? data.mikrotiks
                : [];


        routers.forEach(
            function(router){

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    router.id;


                option.textContent =
                    router.name ||
                    router.ip ||
                    (
                        'MikroTik #' +
                        router.id
                    );


                mikrotik.appendChild(
                    option
                );

            }
        );

    }


    /*
    |--------------------------------------------------------------------------
    | LOAD AREAS
    |--------------------------------------------------------------------------
    */

    async function loadAreas(
        routerId
    ){

        resetSelect(
            area,
            'Loading Area...',
            true
        );


        resetSelect(
            subArea,
            'Select Sub-Area',
            true
        );


        if (!routerId) {

            resetSelect(
                area,
                'Select Area',
                true
            );

            return;
        }


        const response =
            await fetch(
                '/api/customers/add/areas?mikrotik_id=' +
                encodeURIComponent(
                    routerId
                ),
                {
                    method: 'GET',

                    credentials:
                        'same-origin',

                    headers:{
                        'X-Requested-With':
                            'XMLHttpRequest',

                        'Accept':
                            'application/json'
                    }
                }
            );


        const data =
            await getJson(
                response
            );


        let areas = [];


        if (
            Array.isArray(
                data.data
            )
        ) {

            areas =
                data.data;

        } else if (
            Array.isArray(
                data.areas
            )
        ) {

            areas =
                data.areas;

        }


        resetSelect(
            area,
            'Select Area',
            false
        );


        areas.forEach(
            function(item){

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    item.id;


                option.textContent =
                    item.name ||
                    item.area_name ||
                    (
                        'Area #' +
                        item.id
                    );


                area.appendChild(
                    option
                );

            }
        );


        if (!areas.length) {

            resetSelect(
                area,
                'No Area Found',
                true
            );

        }

    }


    /*
    |--------------------------------------------------------------------------
    | LOAD PACKAGES
    |--------------------------------------------------------------------------
    */

    async function loadPackages(
        routerId
    ){

        resetSelect(
            packageSelect,
            'Loading Package...',
            true
        );


        if (!routerId) {

            resetSelect(
                packageSelect,
                'Select Package',
                true
            );

            return;
        }


        const response =
            await fetch(
                '/api/customers/add/packages?router_id=' +
                encodeURIComponent(
                    routerId
                ),
                {
                    method: 'GET',

                    credentials:
                        'same-origin',

                    headers:{
                        'X-Requested-With':
                            'XMLHttpRequest',

                        'Accept':
                            'application/json'
                    }
                }
            );


        const data =
            await getJson(
                response
            );


        const packages =
            Array.isArray(
                data.packages
            )
                ? data.packages
                : [];


        resetSelect(
            packageSelect,
            'Select Package',
            false
        );


        packages.forEach(
            function(pkg){

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    pkg.id;


                option.dataset.price =
                    pkg.price || 0;


                let label =
                    pkg.package_name ||
                    'Package';


                if (
                    pkg.alias_name
                ) {

                    label +=
                        ' (' +
                        pkg.alias_name +
                        ')';

                }


                label +=
                    ' - ৳' +
                    Number(
                        pkg.price || 0
                    ).toFixed(2);


                option.textContent =
                    label;


                packageSelect.appendChild(
                    option
                );

            }
        );


        if (!packages.length) {

            resetSelect(
                packageSelect,
                'No Package Found',
                true
            );

        }

    }


    /*
    |--------------------------------------------------------------------------
    | MIKROTIK CHANGE
    |--------------------------------------------------------------------------
    */

    if (mikrotik) {

        mikrotik.addEventListener(
            'change',
            async function(){

                const routerId =
                    this.value;


                resetSelect(
                    packageSelect,
                    'Select Package',
                    true
                );


                resetSelect(
                    area,
                    'Select Area',
                    true
                );


                resetSelect(
                    subArea,
                    'Select Sub-Area',
                    true
                );


                if (monthlyFee) {

                    monthlyFee.value =
                        '0';

                }


                if (!routerId) {
                    return;
                }


                try {

                    await Promise.all([
                        loadAreas(
                            routerId
                        ),

                        loadPackages(
                            routerId
                        )
                    ]);

                } catch (error) {

                    console.error(
                        'MikroTik loading:',
                        error
                    );

                    alert(
                        error.message ||
                        'Unable to load MikroTik data.'
                    );

                }

            }
        );

    }


    /*
    |--------------------------------------------------------------------------
    | PACKAGE CHANGE
    |--------------------------------------------------------------------------
    */

    if (packageSelect) {

        packageSelect.addEventListener(
            'change',
            function(){

                const selected =
                    this.options[
                        this.selectedIndex
                    ];


                if (
                    monthlyFee &&
                    selected
                ) {

                    monthlyFee.value =
                        selected.dataset.price ||
                        '0';

                }

            }
        );

    }


    /*
    |--------------------------------------------------------------------------
    | AREA CHANGE
    |--------------------------------------------------------------------------
    */

    if (area) {

        area.addEventListener(
            'change',
            async function(){

                const areaId =
                    this.value;


                resetSelect(
                    subArea,
                    'Loading Sub-Area...',
                    true
                );


                if (!areaId) {

                    resetSelect(
                        subArea,
                        'Select Sub-Area',
                        true
                    );

                    return;
                }


                try {

                    const response =
                        await fetch(
                            '/api/customers/add/sub-areas?area_id=' +
                            encodeURIComponent(
                                areaId
                            ),
                            {
                                method: 'GET',

                                credentials:
                                    'same-origin',

                                headers:{
                                    'X-Requested-With':
                                        'XMLHttpRequest',

                                    'Accept':
                                        'application/json'
                                }
                            }
                        );


                    const data =
                        await getJson(
                            response
                        );


                    let rows = [];


                    if (
                        Array.isArray(
                            data.data
                        )
                    ) {

                        rows =
                            data.data;

                    } else if (
                        Array.isArray(
                            data.sub_areas
                        )
                    ) {

                        rows =
                            data.sub_areas;

                    }


                    resetSelect(
                        subArea,
                        'Select Sub-Area',
                        false
                    );


                    rows.forEach(
                        function(item){

                            const option =
                                document.createElement(
                                    'option'
                                );


                            option.value =
                                item.id;


                            option.textContent =
                                item.name ||
                                item.sub_area_name ||
                                (
                                    'Sub-Area #' +
                                    item.id
                                );


                            subArea.appendChild(
                                option
                            );

                        }
                    );


                    if (!rows.length) {

                        resetSelect(
                            subArea,
                            'No Sub-Area Found',
                            true
                        );

                    }

                } catch (error) {

                    console.error(
                        'Sub-Area:',
                        error
                    );


                    resetSelect(
                        subArea,
                        'Unable to load Sub-Area',
                        true
                    );


                    alert(
                        error.message ||
                        'Unable to load sub areas.'
                    );

                }

            }
        );

    }


    /*
    |--------------------------------------------------------------------------
    | LOAD DIVISIONS
    |--------------------------------------------------------------------------
    */

    async function loadDivisions(){

        if (!division) {

        }


        const response =
            await fetch(
                '/api/customers/add/divisions',
                {
                    method: 'GET',

                    credentials:
                        'same-origin',

                    headers:{
                        'X-Requested-With':
                            'XMLHttpRequest',

                        'Accept':
                            'application/json'
                    }
                }
            );


        const data =
            await getJson(
                response
            );


        const rows =
            Array.isArray(
                data.data
            )
                ? data.data
                : [];


        resetSelect(
            division,
            'Select Division',
            false
        );


        rows.forEach(
            function(item){

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    item.id;


                option.textContent =
                    item.name || '';


                division.appendChild(
                    option
                );

            }
        );

    }

    /*
    |--------------------------------------------------------------------------
    | SUBMIT CUSTOMER
    |--------------------------------------------------------------------------
    */

    form.addEventListener(
        'submit',
        async function(event){

            event.preventDefault();


            if (submitButton) {

                submitButton.disabled =
                    true;

                submitButton.textContent =
                    'Saving...';

            }


            try {

                /*
                |--------------------------------------------------------------------------
                | ENSURE CSRF
                |--------------------------------------------------------------------------
                */

                if (
                    !csrfInput ||
                    !csrfInput.value
                ) {

                    await loadMeta();

                }


                if (
                    !csrfInput ||
                    !csrfInput.value
                ) {

                    throw new Error(
                        'Security token missing. Please refresh the page.'
                    );

                }


                /*
                |--------------------------------------------------------------------------
                | BUILD URL ENCODED BODY
                |--------------------------------------------------------------------------
                */

                const formData =
                    new URLSearchParams();


                const elements =
                    form.querySelectorAll(
                        'input, select, textarea'
                    );


                elements.forEach(
                    function(element){

                        if (!element.name) {
                            return;
                        }


                        /*
                        |----------------------------------------------------------------------
                        | CHECKBOX
                        |----------------------------------------------------------------------
                        */

                        if (
                            element.type ===
                            'checkbox'
                        ) {

                            if (
                                element.checked
                            ) {

                                formData.append(
                                    element.name,
                                    element.value ||
                                    '1'
                                );

                            }

                            return;
                        }


                        /*
                        |----------------------------------------------------------------------
                        | RADIO
                        |----------------------------------------------------------------------
                        */

                        if (
                            element.type ===
                            'radio'
                        ) {

                            if (
                                element.checked
                            ) {

                                formData.append(
                                    element.name,
                                    element.value
                                );

                            }

                            return;
                        }


                        /*
                        |----------------------------------------------------------------------
                        | NORMAL FIELD
                        |----------------------------------------------------------------------
                        */

                        formData.append(
                            element.name,
                            element.value
                        );

                    }
                );


                /*
                |--------------------------------------------------------------------------
                | FORCE CSRF
                |--------------------------------------------------------------------------
                */

                formData.set(
                    'csrf_token',
                    csrfInput.value
                );


                /*
                |--------------------------------------------------------------------------
                | POST
                |--------------------------------------------------------------------------
                */

                const response =
                    await fetch(
                        '/api/customers/add',
                        {
                            method: 'POST',

                            credentials:
                                'same-origin',

                            headers:{
                                'X-Requested-With':
                                    'XMLHttpRequest',

                                'Accept':
                                    'application/json',

                                'Content-Type':
                                    'application/x-www-form-urlencoded; charset=UTF-8'
                            },

                            body:
                                formData.toString()
                        }
                    );


                /*
                |--------------------------------------------------------------------------
                | RESPONSE
                |--------------------------------------------------------------------------
                */

                const data =
                    await getJson(
                        response
                    );


                /*
                |--------------------------------------------------------------------------
                | SUCCESS
                |--------------------------------------------------------------------------
                */

                alert(
                    data.message ||
                    'Customer added successfully.'
                );


                /*
                |--------------------------------------------------------------------------
                | CLOSE MODAL
                |--------------------------------------------------------------------------
                */

                if (
                    typeof bootstrap !==
                    'undefined'
                ) {

                    const modalElement =
                        form.closest(
                            '.modal'
                        );


                    if (modalElement) {

                        const modal =
                            bootstrap.Modal
                                .getInstance(
                                    modalElement
                                );


                        if (modal) {

                            modal.hide();

                        }

                    }

                }


                /*
                |--------------------------------------------------------------------------
                | RESET
                |--------------------------------------------------------------------------
                */

                form.reset();


                resetSelect(
                    packageSelect,
                    'Select Package',
                    true
                );


                resetSelect(
                    area,
                    'Select Area',
                    true
                );


                resetSelect(
                    subArea,
                    'Select Sub-Area',
                    true
                );


                resetSelect(
                    district,
                    'Select District',
                    true
                );


                resetSelect(
                    upazila,
                    'Select Upazila/Thana',
                    true
                );


                /*
                |--------------------------------------------------------------------------
                | RELOAD CUSTOMER LIST
                |--------------------------------------------------------------------------
                */

                if (
                    typeof window.loadCustomers ===
                    'function'
                ) {

                    window.loadCustomers();

                } else {

                    window.location.reload();

                }


            } catch (error) {

                console.error(
                    'Add Customer save:',
                    error
                );


                alert(
                    error.message ||
                    'Customer could not be saved.'
                );


            } finally {

                if (submitButton) {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        'Submit';

                }

            }

        }
    );


    /*
    |--------------------------------------------------------------------------
    | DEFAULT DATE/TIME
    |--------------------------------------------------------------------------
    */

    function currentDateTime(){

        const now =
            new Date();


        const offset =
            now.getTimezoneOffset();


        const local =
            new Date(
                now.getTime() -
                offset * 60000
            );


        return local
            .toISOString()
            .slice(
                0,
                16
            );

    }


    const nowValue =
        currentDateTime();


    const billingCycle =
        document.getElementById(
            'billing_cycle'
        );


    const connectionDate =
        document.getElementById(
            'connection_date'
        );


    if (
        billingCycle &&
        !billingCycle.value
    ) {

        billingCycle.value =
            nowValue;

    }


    if (
        connectionDate &&
        !connectionDate.value
    ) {

        connectionDate.value =
            nowValue;

    }


    /*
    |--------------------------------------------------------------------------
    | INITIAL LOAD
    |--------------------------------------------------------------------------
    */

    Promise.all([
        loadMeta(),
        loadDivisions()
    ]).catch(
        function(error){

            console.error(
                'Customer Add initialization:',
                error
            );

        }
    );

})();
</script>
