<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Template</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/area.css">
<link rel="stylesheet" href="/assets/css/message.css">
</head>
<body data-page="tpl">

<!-- SIDEBAR -->
<div id="sidebarContainer"></div>

<!-- TOPBAR -->
<div id="topbarContainer"></div>

<div class="main-content">
<div class="sms-card"><div class="sms-head"><span>SMS Template</span><button class="btn btn-light btn-sm buy-open"><i class="fa fa-envelope"></i> Buy SMS</button></div><div class="sms-body">
<div class="sms-tabs" id="tplTabs"></div>
<div class="row mb-3"><div class="col-md-4"><b>Message Type</b><br><label class="me-3"><input type="radio" name="tmt" value="text" checked> Text</label><label class="me-3"><input type="radio" name="tmt" value="voice" > Voice</label></div>
<div class="col-md-4"><b id="tplLabel">Template</b><br><label class="me-3"><input type="radio" name="ten" value="1" checked> ON</label><label class="me-3"><input type="radio" name="ten" value="0" > OFF</label></div>
<div class="col-md-4"><b>Sending Message Type</b><br><label class="me-3"><input type="radio" name="tst" value="non_masking" checked> Non Masking</label><label class="me-3"><input type="radio" name="tst" value="masking" > Masking</label><label class="me-3"><input type="radio" name="tst" value="fixed" > Fixed</label></div></div>
<div class="sms-vars" id="tplVars" style="columns:2"></div>
<textarea id="tplAuto" class="form-control mt-3" rows="5"></textarea>
<div class="sms-cnt" id="tplCnt">Letter :0 SMS:1</div>
<textarea id="tplText" class="form-control" rows="4" placeholder="Write Message ..."></textarea>
<hr><div id="tplMsg" class="alert d-none"></div>
<button class="btn btn-success" id="tplSave">Save</button>
</div></div>
</div>

<div class="sms-modal" id="buyModal"><div class="box">
  <div class="d-flex justify-content-between"><h5 class="m-0">SMS Purchase Board</h5><span id="buyX" style="cursor:pointer;font-size:22px">&times;</span></div>
  <div>
    <div class="sms-price">Purchase Price &#2547;<span id="buyPrice">0</span></div>
    <label class="w-100">Message Type *
      <select id="buyType" class="form-select"><option value="non_masking">Non Masking</option><option value="masking">Masking</option><option value="fixed">Fixed Number</option><option value="voice">Voice</option></select></label>
    <label class="w-100 mt-2">SMS Count *<input id="buyCount" type="number" min="1" class="form-control" placeholder="300"></label>
    <div id="buyMsg" class="alert d-none mt-2 mb-0"></div>
  </div>
  <div class="d-flex justify-content-end gap-2"><button class="btn btn-secondary" id="buyCancel">Cancel</button><button class="btn btn-success" id="buyGo">Buy SMS</button></div>
</div></div>

<div id="pageAlert" class="alert d-none" style="position:fixed;top:80px;right:20px;z-index:3000"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="/assets/js/message.js"></script>
<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>
</html>
