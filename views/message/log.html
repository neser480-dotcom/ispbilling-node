<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/area.css">
<link rel="stylesheet" href="/assets/css/message.css">
</head>
<body data-page="log">

<!-- SIDEBAR -->
<div id="sidebarContainer"></div>

<!-- TOPBAR -->
<div id="topbarContainer"></div>

<div class="main-content">
<div class="sms-card"><div class="sms-head"><span>Message Log</span></div><div class="sms-body">
<div class="sms-tabs" id="logTabs"><button data-ch="non_masking" class="on">Non Masking</button><button data-ch="masking">Masking</button><button data-ch="fixed">Fixed Number</button><button data-ch="voice">Voice Message</button></div>
<div class="row g-2 mb-2">
<div class="col-md"><select id="fKind" class="form-select"><option value="">Type</option><option value="bulk">bulk</option><option value="auth">auth</option><option value="bill_confirmation">bill_confirmation</option></select></div>
<div class="col-md"><select id="fStatus" class="form-select"><option value="">Select Status</option><option>sent</option><option>failed</option><option>pending</option></select></div>
<div class="col-md"><input type="date" id="fFrom" class="form-control"></div><div class="col-md"><input type="date" id="fTo" class="form-control"></div>
<div class="col-md-auto"><button class="btn btn-outline-primary" id="fGo">Filter</button></div></div>
<div class="sms-bar"><span id="logTotal">Total Data: 0 Count: 0</span><input id="fQ" placeholder="Search"></div>
<div class="table-responsive"><table class="sms-table"><thead id="logHead"></thead><tbody id="logBody"></tbody></table></div>
<div class="d-flex justify-content-end align-items-center gap-2 mt-3"><button class="btn btn-secondary btn-sm" id="prev">Prev</button><span id="pgNo">1</span><button class="btn btn-secondary btn-sm" id="next">Next</button></div>
</div></div>
</div>

<div id="pageAlert" class="alert d-none" style="position:fixed;top:80px;right:20px;z-index:3000"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="/assets/js/message.js"></script>
<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>
</html>
