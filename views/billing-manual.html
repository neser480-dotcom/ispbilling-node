<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Software Billing - Super Admin</title>

    <!-- ADMIN CSS -->
    <link
        rel="stylesheet"
        href="/assets/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/topbar.css"
    >

    <!-- BILLING CSS -->
    <link
        rel="stylesheet"
        href="/assets/css/billing.css"
    >

    <!-- BOOTSTRAP -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

    <!-- =========================================
         SIDEBAR
    ========================================= -->

    <div id="sidebarContainer"></div>


    <!-- =========================================
         TOPBAR
    ========================================= -->

    <div id="topbarContainer"></div>


    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <div class="main-content">


        <!-- =========================================
             PAGE HEADER
        ========================================= -->

        <div class="row mb-4">

            <div class="col-12">

                <div class="dashboard-heading">

                    <div>

                        <h2>
                            Software Billing
                        </h2>

                        <p>
                            Manual payment management
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================================
             BILLING CONTENT
        ========================================= -->

        <div class="row">

            <div class="col-12">

                <div class="billing-card">


                    <!-- LOADING -->

                    <div
                        id="billingLoading"
                        class="notice"
                    >
                        Loading billing records...
                    </div>


                    <!-- EMPTY -->

                    <div
                        id="billingEmpty"
                        class="notice"
                        style="display:none;"
                    >
                        No software billing records found.
                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="billingMessage"
                        class="notice"
                        style="display:none;"
                    ></div>


                    <!-- TABLE -->

                    <div
                        id="billingTableWrapper"
                        class="table-responsive"
                        style="display:none;"
                    >

                        <table class="table align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>User</th>

                                    <th>Company</th>

                                    <th>Type</th>

                                    <th>Package</th>

                                    <th>Amount</th>

                                    <th>Status</th>

                                    <th>Due</th>

                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody
                                id="billingTableBody"
                            ></tbody>

                        </table>

                    </div>


                </div>

            </div>

        </div>


    </div>


    <!-- =========================================
         BOOTSTRAP
    ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =========================================
         SIDEBAR LOADER
    ========================================= -->

    <script
        src="/assets/js/sidebar-loader.js?v=4"
    ></script>


    <!-- =========================================
         TOPBAR LOADER
    ========================================= -->

    <script
        src="/assets/js/topbar-loader.js?v=4"
    ></script>


    <!-- =========================================
         BILLING JS
    ========================================= -->

    <script
        src="/assets/js/billing-manual.js?v=5"
    ></script>


</body>

</html>
