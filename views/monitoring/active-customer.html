<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Active Customer</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- Font Awesome -->
<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    rel="stylesheet"
>

<!-- Active Customer CSS -->
<link
    rel="stylesheet"
    href="/assets/css/active-customer.css"
>
```

</head>

<body>

```
<!-- =========================================================
     SIDEBAR
========================================================== -->

<div id="sidebarContainer"></div>


<!-- =========================================================
     TOPBAR
========================================================== -->

<div id="topbarContainer"></div>


<!-- =========================================================
     MAIN CONTENT
========================================================== -->

<main class="active-customer-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="active-header">

        <div class="active-title">

            <i class="fa-solid fa-users"></i>

            <span>
                ACTIVE CUSTOMER
            </span>

        </div>


        <div class="active-header-actions">


            <!-- FILTER -->

            <button
                type="button"
                class="active-header-btn"
                id="activeFilterBtn"
                title="Filter"
            >

                <i class="fa-solid fa-filter"></i>

            </button>


            <!-- REFRESH -->

            <button
                type="button"
                class="active-header-btn"
                id="activeRefreshBtn"
                title="Refresh"
            >

                <i class="fa-solid fa-rotate"></i>

            </button>


            <!-- BTRC -->

            <button
                type="button"
                class="active-header-btn"
                id="activeBtrcBtn"
                title="BTRC"
            >

                <i class="fa-solid fa-tower-broadcast"></i>

            </button>


            <!-- PRINT -->

            <button
                type="button"
                class="active-header-btn"
                id="activePrintBtn"
                title="Print"
            >

                <i class="fa-solid fa-print"></i>

            </button>


            <!-- COLLAPSE -->

            <button
                type="button"
                class="active-header-btn"
                id="activeCollapseBtn"
                title="Collapse"
            >

                <i class="fa-solid fa-chevron-up"></i>

            </button>

        </div>

    </div>


    <!-- =====================================================
         FILTER PANEL
    ====================================================== -->

    <section
        class="active-filter-panel"
        id="activeFilterPanel"
    >

        <div class="filter-grid">


            <!-- MIKROTIK -->

            <div class="filter-item">

                <label for="routerFilter">
                    MikroTik Router
                </label>

                <select
                    id="routerFilter"
                    class="form-select"
                >

                    <option value="">
                        Loading...
                    </option>

                </select>

            </div>


            <!-- PACKAGE -->

            <div class="filter-item">

                <label for="packageFilter">
                    Package
                </label>

                <select
                    id="packageFilter"
                    class="form-select"
                >

                    <option value="">
                        All Packages
                    </option>

                </select>

            </div>


            <!-- AREA -->

            <div class="filter-item">

                <label for="areaFilter">
                    Area
                </label>

                <select
                    id="areaFilter"
                    class="form-select"
                >

                    <option value="">
                        All Areas
                    </option>

                </select>

            </div>


            <!-- SUB AREA -->

            <div class="filter-item">

                <label for="subAreaFilter">
                    Sub Area
                </label>

                <select
                    id="subAreaFilter"
                    class="form-select"
                >

                    <option value="">
                        All Sub Areas
                    </option>

                </select>

            </div>


            <!-- CONNECTION STATUS -->

            <div class="filter-item">

                <label for="connectionStatusFilter">
                    Connection Status
                </label>

                <select
                    id="connectionStatusFilter"
                    class="form-select"
                >

                    <option value="all">
                        All
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="offline">
                        Offline
                    </option>

                </select>

            </div>


            <!-- FILTER BUTTONS -->

            <div class="filter-buttons">

                <button
                    type="button"
                    class="btn btn-primary"
                    id="applyFilterBtn"
                >

                    <i class="fa-solid fa-filter"></i>

                    Filter

                </button>


                <button
                    type="button"
                    class="btn btn-light border"
                    id="resetFilterBtn"
                >

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         SUMMARY
    ====================================================== -->

    <section
        class="active-summary"
        id="activeSummarySection"
    >


        <div class="summary-left">


            <!-- TOTAL -->

            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="activeTotalData">
                    0
                </strong>

            </div>


            <!-- STATUS -->

            <div class="summary-status">


                <span
                    class="status-count active-count"
                >

                    Active:

                    <strong id="activeCount">
                        0
                    </strong>

                </span>


                <span
                    class="status-count offline-count"
                >

                    Offline:

                    <strong id="offlineCount">
                        0
                    </strong>

                </span>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="summary-search">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search customer / PPPoE / IP / MAC..."
                autocomplete="off"
            >


            <button
                type="button"
                id="searchClearBtn"
                class="search-clear"
                title="Clear Search"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

    </section>


    <!-- =====================================================
         TABLE
    ====================================================== -->

    <section
        class="active-table-section"
        id="activeTableSection"
    >

        <div class="table-responsive">

            <table
                class="table active-table"
                id="activeCustomerTable"
            >


                <!-- TABLE HEADER -->

                <thead>

                    <tr>


                        <!-- SELECT ALL -->

                        <th
                            class="select-column"
                        >

                            <input
                                type="checkbox"
                                id="selectAllActive"
                            >

                        </th>


                        <!-- ID -->

                        <th>
                            ID
                        </th>


                        <!-- CUSTOMER -->

                        <th>
                            Name / PPPoE
                        </th>


                        <!-- IP MAC -->

                        <th>
                            IP / MAC
                        </th>


                        <!-- PACKAGE -->

                        <th>
                            Package
                        </th>


                        <!-- TRAFFIC -->

                        <th>
                            Up / Down
                        </th>


                        <!-- UPTIME -->

                        <th>
                            Uptime
                        </th>


                        <!-- LOGIN -->

                        <th>
                            Logged In / Out
                        </th>


                        <!-- STATUS -->

                        <th>
                            Status
                        </th>


                        <!-- ACTION -->

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <!-- TABLE BODY -->

                <tbody id="userTableBody">

                    <tr>

                        <td
                            colspan="10"
                            class="loading-row"
                        >

                            <i
                                class="fa-solid fa-spinner fa-spin"
                            ></i>

                            &nbsp;

                            Loading Active Customers...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<!-- =========================================================
     BOOTSTRAP
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- =========================================================
     SIDEBAR LOADER
========================================================== -->

<script
    src="/assets/js/sidebar-loader.js"
></script>


<!-- =========================================================
     TOPBAR LOADER
========================================================== -->

<script
    src="/assets/js/topbar-loader.js"
></script>


<!-- =========================================================
     ACTIVE CUSTOMER JS
========================================================== -->

<script
    src="/assets/js/active-customer.js"
></script>
```

</body>

</html>
