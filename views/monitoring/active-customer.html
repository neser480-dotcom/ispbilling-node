<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Customer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/active-customer.css?v=20261031">
</head>
<body>

<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<main class="active-customer-page" id="activePage">

    <!-- HEADER -->
    <div class="active-header">
        <h1 class="active-title">Active Customer</h1>

        <div class="active-header-actions">
            <button type="button" class="active-header-btn" id="activeFilterBtn" title="Filter">
                <svg class="ac-icon ac-icon-filter" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"></circle><path d="M7.4 9.7h9.2M9.4 12.7h5.2M11.3 15.6h1.4"></path></svg>
            </button>

            <button type="button" class="active-header-btn" id="activeRefreshBtn" title="Refresh">
                <svg class="ac-icon ac-icon-refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.4a8 8 0 1 1-2.5-5.8"></path><path d="M17.9 3.4v3.5h-3.5"></path></svg>
            </button>

            <!-- extra tools (shown by the arrow toggle) -->
            <span class="active-extra" id="activeExtraTools" hidden>
                <button type="button" class="active-header-btn" id="activeExportBtn" title="Export Excel">
                    <i class="fa-solid fa-file-excel"></i>
                </button>
                <button type="button" class="active-header-btn" id="activePrintBtn" title="Print">
                    <i class="fa-solid fa-print"></i>
                </button>
            </span>

            <button type="button" class="active-toggle" id="activeToggleTools" title="More tools">
                <i class="fa-solid fa-arrow-left-long"></i><span class="bar"></span>
            </button>
        </div>
    </div>

    <div class="active-body">

        <!-- FILTER -->
        <section class="active-filter-panel" id="activeFilterPanel" hidden>
            <div class="filter-grid">
                <select id="routerFilter" class="form-select" title="MikroTik">
                    <option value="">Loading...</option>
                </select>

                <select id="packageFilter" class="form-select" title="Package">
                    <option value="">Package</option>
                </select>

                <select id="areaFilter" class="form-select" title="Area">
                    <option value="">All Area</option>
                </select>

                <select id="subAreaFilter" class="form-select" title="Sub Area">
                    <option value="">Sub Area</option>
                </select>

                <select id="connectionStatusFilter" class="form-select" title="Connection Status">
                    <option value="all">Connection Status</option>
                    <option value="active">Active</option>
                    <option value="offline">Offline</option>
                </select>
            </div>

            <div class="filter-buttons">
                <button type="button" class="btn btn-outline-primary btn-sm" id="applyFilterBtn">Filter</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="resetFilterBtn">Reset</button>
            </div>
        </section>

        <!-- TOOLBAR -->
        <section class="active-toolbar">
            <i class="fa-solid fa-gear tb-ico"></i>
            <i class="fa-solid fa-database tb-ico tb-db"></i>

            <span class="tb-text">Total Data:</span>
            <span class="tb-pill" id="activeTotalData">0</span>

            <span class="tb-split">
                <span class="tb-mini act">Active: <b id="activeCount">0</b></span>
                <span class="tb-mini off">Offline: <b id="offlineCount">0</b></span>
            </span>

            <div class="tb-search">
                <input type="text" id="searchInput" placeholder="Search" autocomplete="off">
            </div>
        </section>

        <!-- TABLE -->
        <section class="active-table-section" id="activeTableSection">
            <div class="active-table-scroll">
                <table class="table active-table" id="activeCustomerTable">
                    <thead>
                        <tr>
                            <th class="col-check"><input type="checkbox" id="selectAllActive"></th>
                            <th class="col-wifi sortable" data-sort="status" title="Connection">
                                <i class="fa-solid fa-wifi"></i>
                                <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span>
                            </th>
                            <th class="sortable" data-sort="id">ID <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="customer_name">Name/PPPoE <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="address">IP/MAC <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="package">Package <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="bytes_out">Up/Down <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="uptime_sec">Uptime <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="login_time">Logged In/Out <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="status">Status <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="col-action">Action</th>
                        </tr>
                    </thead>

                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="11" class="loading-row">
                                <i class="fa-solid fa-spinner fa-spin"></i>&nbsp; Loading Active Customers...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<!-- INFO / PING MODAL -->
<div class="modal fade" id="activeInfoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="activeInfoTitle">Info</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="activeInfoBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="/assets/js/active-customer.js?v=20261031"></script>

<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>
</html>
