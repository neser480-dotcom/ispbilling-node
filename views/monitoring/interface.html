<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interface Monitor</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Existing Theme -->
    <link
        rel="stylesheet"
        href="/assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/topbar.css"
    >

    <!-- Monitoring -->
    <link
        rel="stylesheet"
        href="/assets/css/monitoring.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/interface-monitor.css"
    >

</head>

<body>

    <!-- Existing Sidebar -->
    <div id="sidebarContainer"></div>

    <!-- Existing Topbar -->
    <div id="topbarContainer"></div>

    <div class="main-content">

        <div class="container-fluid py-3">

            <!-- HEADER -->
            <div
                class="card bg-primary text-white p-3 mb-3 shadow-sm
                       d-flex flex-row justify-content-between
                       align-items-center interface-header"
            >

                <h4 class="mb-0">
                    <i class="fas fa-network-wired me-2"></i>
                    Interface Monitor
                </h4>

                <div class="d-flex align-items-center">

                    <select
                        id="routerSelect"
                        class="form-select form-select-sm router-select"
                    >
                        <option value="">
                            Loading routers...
                        </option>
                    </select>

                    <button
                        type="button"
                        id="refreshInterface"
                        class="btn btn-light btn-sm text-primary ms-2"
                        title="Refresh"
                    >
                        <i class="fas fa-sync-alt"></i>
                    </button>

                </div>

            </div>


            <!-- ERROR -->
            <div
                id="connectionError"
                class="alert alert-danger text-center d-none"
            ></div>


            <!-- TABS -->
            <ul
                class="nav nav-tabs mb-3"
                id="interfaceTab"
                role="tablist"
            >

                <li
                    class="nav-item"
                    role="presentation"
                >

                    <button
                        class="nav-link active"
                        id="ethernet-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#ethernet"
                        type="button"
                        role="tab"
                    >
                        Ethernet & Bridge
                        <span
                            id="ethernetCount"
                            class="badge bg-secondary ms-1"
                        >
                            0
                        </span>
                    </button>

                </li>


                <li
                    class="nav-item"
                    role="presentation"
                >

                    <button
                        class="nav-link"
                        id="vlan-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#vlan"
                        type="button"
                        role="tab"
                    >
                        VLAN
                        <span
                            id="vlanCount"
                            class="badge bg-secondary ms-1"
                        >
                            0
                        </span>
                    </button>

                </li>

            </ul>


            <!-- TAB CONTENT -->
            <div
                class="tab-content"
                id="interfaceTabContent"
            >

                <!-- Ethernet -->
                <div
                    class="tab-pane fade show active"
                    id="ethernet"
                    role="tabpanel"
                >

                    <div class="card p-3 shadow-sm">

                        <div class="table-responsive">

                            <table
                                class="table table-hover align-middle mb-0"
                            >

                                <thead>

                                    <tr>
                                        <th>#</th>
                                        <th>Name</th>
                                        <th>Status</th>
                                        <th>MikroTik</th>
                                        <th>Action</th>
                                    </tr>

                                </thead>

                                <tbody id="ethernetBody">

                                    <tr>
                                        <td
                                            colspan="5"
                                            class="text-center text-muted py-4"
                                        >
                                            Loading...
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <!-- VLAN -->
                <div
                    class="tab-pane fade"
                    id="vlan"
                    role="tabpanel"
                >

                    <div class="card p-3 shadow-sm">

                        <div class="table-responsive">

                            <table
                                class="table table-hover align-middle mb-0"
                            >

                                <thead>

                                    <tr>
                                        <th>#</th>
                                        <th>Name</th>
                                        <th>VLAN ID</th>
                                        <th>Status</th>
                                        <th>MikroTik</th>
                                        <th>Action</th>
                                    </tr>

                                </thead>

                                <tbody id="vlanBody">

                                    <tr>
                                        <td
                                            colspan="6"
                                            class="text-center text-muted py-4"
                                        >
                                            Loading...
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- BANDWIDTH MODAL -->
    <div
        class="modal fade"
        id="bandwidthModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div
            class="modal-dialog modal-lg modal-dialog-centered"
        >

            <div class="modal-content">

                <div
                    class="modal-header bg-primary text-white"
                >

                    <h5
                        class="modal-title"
                        id="modalInterfaceTitle"
                    >
                        Bandwidth Monitor
                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <div class="modal-body">

                    <div
                        id="bandwidthLoading"
                        class="text-center py-3"
                    >
                        <div
                            class="spinner-border text-primary"
                        ></div>

                        <div class="mt-2">
                            Loading bandwidth...
                        </div>
                    </div>


                    <div
                        id="bandwidthError"
                        class="alert alert-danger d-none"
                    ></div>


                    <div
                        id="bandwidthStats"
                        class="row g-3 d-none"
                    >

                        <div class="col-md-6">

                            <div class="card bandwidth-card">

                                <div class="card-body">

                                    <small class="text-muted">
                                        Download
                                    </small>

                                    <h3
                                        id="downloadSpeed"
                                        class="mb-0"
                                    >
                                        0 Mbps
                                    </h3>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="card bandwidth-card">

                                <div class="card-body">

                                    <small class="text-muted">
                                        Upload
                                    </small>

                                    <h3
                                        id="uploadSpeed"
                                        class="mb-0"
                                    >
                                        0 Mbps
                                    </h3>

                                </div>

                            </div>

                        </div>

                    </div>


                    <div
                        id="bandwidthChart"
                        class="mt-3"
                    ></div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- CanvasJS -->
    <script
        src="https://canvasjs.com/assets/script/canvasjs.min.js"
    ></script>

    <!-- Existing loaders -->
    <script
        src="/assets/js/sidebar-loader.js"
    ></script>

    <script
        src="/assets/js/topbar-loader.js"
    ></script>

    <!-- Page JS -->
    <script
        src="/assets/js/interface-monitor.js"
    ></script>

</body>

</html>
