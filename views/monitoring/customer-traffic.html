<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Customer Traffic - ISP Billing</title>


<!-- =========================================
     BOOTSTRAP
========================================= -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<!-- =========================================
     FONT AWESOME
========================================= -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>


<!-- =========================================
     COMMON STYLE
========================================= -->

<link
    rel="stylesheet"
    href="/assets/css/style.css"
>


<!-- =========================================
     SIDEBAR CSS
========================================= -->

<link
    rel="stylesheet"
    href="/assets/css/sidebar.css"
>


<!-- =========================================
     TOPBAR CSS
========================================= -->

<link
    rel="stylesheet"
    href="/assets/css/topbar.css"
>


<!-- =========================================
     MONITORING CSS
========================================= -->

<link
    rel="stylesheet"
    href="/assets/css/monitoring.css"
>


<!-- =========================================
     CUSTOMER TRAFFIC CSS
========================================= -->

<link
    rel="stylesheet"
    href="/assets/css/customer-traffic.css"
>

</head>


<body>


<!-- =========================================
     SIDEBAR
========================================= -->

<div id="sidebarContainer"></div>


<!-- =========================================
     TOPBAR
========================================= -->

<div id="topbarContainer"></div>


<!-- =========================================
     MAIN CONTENT
========================================= -->

<div class="main-content">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="traffic-header">

        <div>

            <h3>

                <i class="fa-solid fa-chart-line"></i>

                Customer Traffic

            </h3>


            <div
                id="selectedRouterName"
                class="router-name"
            >
                Loading Router...
            </div>

        </div>


        <div class="traffic-header-actions">

            <select
                id="routerSelect"
                class="form-select"
            >

                <option value="">
                    Loading Router...
                </option>

            </select>


            <button
                type="button"
                id="refreshTraffic"
                class="btn btn-light"
            >

                <i class="fa-solid fa-arrows-rotate"></i>

                Refresh

            </button>

        </div>

    </div>



    <!-- =====================================
         ERROR
    ====================================== -->

    <div
        id="trafficError"
        class="alert alert-danger"
        style="display:none;"
    ></div>



    <!-- =====================================
         SUMMARY
    ====================================== -->

    <div class="traffic-summary">


        <div class="traffic-card">

            <div class="traffic-card-icon">

                <i class="fa-solid fa-users"></i>

            </div>


            <div>

                <span>
                    Total Active Users
                </span>


                <strong id="activeUsers">
                    0
                </strong>

            </div>

        </div>



        <div class="traffic-card">

            <div class="traffic-card-icon">

                <i class="fa-solid fa-download"></i>

            </div>


            <div>

                <span>
                    Download
                </span>


                <strong>

                    <span id="downloadMbps">
                        0
                    </span>

                    Mbps

                </strong>


                <small>

                    <span id="downloadGB">
                        0
                    </span>

                    GB

                </small>

            </div>

        </div>



        <div class="traffic-card">

            <div class="traffic-card-icon">

                <i class="fa-solid fa-upload"></i>

            </div>


            <div>

                <span>
                    Upload
                </span>


                <strong>

                    <span id="uploadMbps">
                        0
                    </span>

                    Mbps

                </strong>


                <small>

                    <span id="uploadGB">
                        0
                    </span>

                    GB

                </small>

            </div>

        </div>



        <div class="traffic-card">

            <div class="traffic-card-icon">

                <i class="fa-solid fa-clock"></i>

            </div>


            <div>

                <span>
                    Last Update
                </span>


                <strong
                    id="lastUpdate"
                    class="last-update"
                >
                    --
                </strong>

            </div>

        </div>

    </div>



    <!-- =====================================
         CHART
    ====================================== -->

    <div class="traffic-panel">


        <div class="traffic-panel-header">

            <h5>

                <i class="fa-solid fa-chart-area"></i>

                Live Customer Traffic

            </h5>


            <span
                id="liveIndicator"
                class="live-indicator"
            >
                ● LIVE
            </span>

        </div>


        <div
            id="trafficChart"
            class="traffic-chart"
        ></div>

    </div>



    <!-- =====================================
         TABLE
    ====================================== -->

    <div class="traffic-panel">


        <div class="traffic-table-tools">


            <div class="traffic-search">

                <i class="fa-solid fa-magnifying-glass"></i>


                <input
                    type="text"
                    id="trafficSearch"
                    placeholder="Search customer, PPPoE, package, IP..."
                    autocomplete="off"
                >

            </div>


            <button
                type="button"
                id="clearTrafficSearch"
                class="btn btn-secondary btn-sm"
            >
                Clear
            </button>

        </div>



        <div class="table-responsive">

            <table
                id="trafficTable"
                class="table table-hover align-middle"
            >

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>
                            Name / PPPoE
                        </th>

                        <th>
                            Package
                        </th>

                        <th>
                            Upload
                        </th>

                        <th>
                            Download
                        </th>

                        <th>
                            IP Address
                        </th>

                        <th>
                            Uptime
                        </th>

                    </tr>

                </thead>


                <tbody id="trafficTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="text-center"
                        >
                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>



<!-- =========================================
     CANVASJS
========================================= -->

<script
    src="https://canvasjs.com/assets/script/canvasjs.min.js"
></script>



<!-- =========================================
     BOOTSTRAP JS
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<!-- =========================================
     SIDEBAR LOADER
========================================= -->

<script
    src="/assets/js/sidebar-loader.js"
></script>



<!-- =========================================
     TOPBAR LOADER
========================================= -->

<script
    src="/assets/js/topbar-loader.js"
></script>



<!-- =========================================
     CUSTOMER TRAFFIC JS
========================================= -->

<script
    src="/assets/js/customer-traffic.js"
></script>


</body>

</html>
