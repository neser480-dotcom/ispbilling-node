<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Traffic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/customer-traffic.css?v=20261117">
</head>
<body>

<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<main class="ct-page" id="trafficPage">

    <!-- HEADER -->
    <div class="ct-header">
        <h1 class="ct-title">Customer Traffic</h1>

        <div class="ct-header-actions">
            <button type="button" class="ct-header-btn" id="trafficRefreshBtn" title="Refresh">
                <svg class="ct-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.4a8 8 0 1 1-2.5-5.8"></path><path d="M17.9 3.4v3.5h-3.5"></path></svg>
            </button>
        </div>
    </div>

    <div class="ct-body">

        <!-- CHART -->
        <div class="ct-chart-wrap">
            <div id="trafficChart" class="ct-chart"></div>
        </div>

        <!-- TOOLBAR -->
        <section class="ct-toolbar">
            <i class="fa-solid fa-gear tb-ico"></i>

            <span class="tb-text">Total Data:</span>
            <span class="tb-pill" id="trafficTotal">0</span>

            <div class="tb-search">
                <input type="text" id="trafficSearch" placeholder="Search" autocomplete="off">
            </div>
        </section>

        <!-- TABLE -->
        <section class="ct-table-section">
            <div class="ct-table-scroll">
                <table class="table ct-table" id="trafficTable">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="customer_id">ID <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="name">Name/PPPoE <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="package">Package <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="upload_bytes">Upload <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="download_bytes">Download <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="sessions">Session <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                            <th class="sortable" data-sort="last_logged_out_ts">Last Logged Out <span class="sort"><i class="fa-solid fa-arrow-down-long"></i><i class="fa-solid fa-arrow-up-long"></i></span></th>
                        </tr>
                    </thead>

                    <tbody id="trafficTableBody">
                        <tr>
                            <td colspan="7" class="loading-row">
                                <i class="fa-solid fa-spinner fa-spin"></i>&nbsp; Loading Customer Traffic...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="/assets/js/customer-traffic.js?v=20261117"></script>

<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>
</html>
