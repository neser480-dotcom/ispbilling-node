<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Area</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/assets/css/area.css"
    >

<link rel="stylesheet" href="/assets/css/mobile-pages.css?v=20261125">
</head>


<body>


<!-- SIDEBAR -->

<div id="sidebarContainer"></div>


<!-- TOPBAR -->

<div id="topbarContainer"></div>


<!-- MAIN -->

<div class="main-content">


    <!-- ==================================================
         BLUE HEADER CARD
    ================================================== -->

    <div class="area-header-card">

        <h1>Area</h1>

        <div class="area-header-actions">

            <!-- ADD -->

            <button
                type="button"
                class="area-icon-btn"
                data-bs-toggle="modal"
                data-bs-target="#addAreaModal"
                title="Add Area"
            >
                <i class="fa fa-plus"></i>
            </button>


            <!-- RELOAD -->

            <button
                type="button"
                class="area-icon-btn"
                id="reloadArea"
                title="Reload"
            >
                <i class="fa fa-rotate-right"></i>
            </button>


            <!-- LOCATION -->

            <button
                type="button"
                class="area-icon-btn"
                id="locationArea"
                title="Location"
            >
                <i class="fa fa-location-dot"></i>
            </button>


            <!-- TUTORIAL -->

            <button
                type="button"
                class="area-icon-btn"
                id="tutorialArea"
                title="Tutorial"
            >
                <i class="fa-regular fa-circle-play"></i>
            </button>

        </div>

    </div>


    <!-- ==================================================
         WHITE BODY CARD
    ================================================== -->

    <div class="area-body-card">


        <!-- DATA STRIP -->

        <div class="area-data-strip">

            <div class="area-total">

                <i class="fa fa-gear me-2"></i>

                Total Data:

                <span
                    id="totalAreaCount"
                    class="area-count-pill"
                >0</span>

            </div>


            <div class="area-search-wrap">

                <input
                    type="text"
                    id="areaSearch"
                    class="form-control"
                    placeholder="Search"
                    autocomplete="off"
                >

            </div>

        </div>


        <!-- TABLE -->

        <div class="table-responsive">

            <table
                class="table area-table align-middle mb-0"
                id="areaTable"
            >

                <thead>

                    <tr>

                        <th
                            width="60"
                            data-sort="id"
                        >
                            # <span class="sort-icon">⇅</span>
                        </th>

                        <th data-sort="name">
                            Area <span class="sort-icon">⇅</span>
                        </th>

                        <th
                            class="company-column d-none"
                            data-sort="company"
                        >
                            Company <span class="sort-icon">⇅</span>
                        </th>

                        <th data-sort="sub">
                            Sub Area <span class="sort-icon">⇅</span>
                        </th>

                        <th data-sort="remarks">
                            Remarks <span class="sort-icon">⇅</span>
                        </th>

                        <th
                            width="110"
                            class="text-center"
                            data-sort="id"
                        >
                            Action <span class="sort-icon">⇅</span>
                        </th>

                    </tr>

                </thead>


                <tbody id="areaTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="text-center py-5 text-muted"
                        >

                            <i
                                class="fa fa-spinner fa-spin fa-2x mb-2 d-block"
                            ></i>

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="area-footer">
        &copy; IRFAN IT - 2026
    </div>


</div>


<!-- ==================================================
     ADD AREA MODAL
================================================== -->

<div
    class="modal fade"
    id="addAreaModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow">

            <form id="addAreaForm">

                <div class="modal-header bg-primary text-white">

                    <h5 class="modal-title fw-bold">

                        <i class="fa fa-plus-circle me-2"></i>

                        Add New Area

                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <!-- COMPANY -->

                    <div
                        class="mb-3"
                        id="companyFieldWrap"
                        style="display:none;"
                    >

                        <label
                            class="form-label fw-semibold"
                            for="areaCompany"
                        >
                            Company
                        </label>

                        <select
                            name="company_id"
                            id="areaCompany"
                            class="form-select"
                        >
                            <option value="">
                                Select Company
                            </option>
                        </select>

                    </div>


                    <!-- NAME -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold"
                            for="addAreaName"
                        >
                            Area Name
                            <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            name="name"
                            id="addAreaName"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- REMARKS -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold"
                            for="addAreaRemarks"
                        >
                            Remarks
                        </label>

                        <textarea
                            name="remarks"
                            id="addAreaRemarks"
                            rows="4"
                            class="form-control"
                        ></textarea>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="fa fa-save me-1"></i>
                        Save Area
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- DYNAMIC EDIT / DELETE MODALS -->

<div id="areaModals"></div>


<!-- JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="/assets/js/sidebar-loader.js"></script>

<script src="/assets/js/topbar-loader.js"></script>

<script src="/assets/js/area.js"></script>

<script src="/assets/js/area-subarea-modal.js?v=2"></script>


<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>

</html>
