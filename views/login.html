<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>ISP Billing Login</title>

<link
    rel="stylesheet"
    href="/assets/css/login.css"
>

</head>

<body>

<div class="background-shape shape-one"></div>
<div class="background-shape shape-two"></div>
<div class="background-shape shape-three"></div>

<div class="glass-container">

    <div class="glass-card">

        <div class="logo">

            <div class="logo-icon">
                ISP
            </div>

            <h1>isp billing</h1>

            <p>
                ISP Billing & Management System
            </p>

        </div>


        <div
            class="error"
            id="loginError"
            style="display:none;"
        >

            <span>⚠</span>

            <span id="loginErrorText"></span>

        </div>


        <form
            method="POST"
            autocomplete="on"
            id="loginForm"
        >

            <input
                type="hidden"
                name="csrf_token"
                id="csrf_token"
                value=""
            >


            <div class="input-group">

                <span class="input-icon">
                    ◉
                </span>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Username"
                    value=""
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group password-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    value=""
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-pass"
                    onclick="showPassword()"
                    aria-label="Show or hide password"
                >
                    👁
                </button>

            </div>


            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                        value="1"
                        id="remember"
                    >

                    <span class="checkmark"></span>

                    <span>
                        Remember Me
                    </span>

                </label>


                <a
                    href="/forgot"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                name="login"
                class="login-btn"
                id="loginButton"
            >

                <span>Login</span>

                <span class="arrow">
                    →
                </span>

            </button>

        </form>


        <div class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <div class="footer">

            © <span id="currentYear"></span>
            ISP Billing System

        </div>

    </div>

</div>


<script src="/assets/js/login.js"></script>

</body>

</html>
