<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amader Bill Support Numbers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
        :root { --topbar-height: 70px; --sidebar-width: 250px; }
        body { background: #f4f6f9; margin: 0; overflow-x: hidden; }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: calc(var(--topbar-height) + 16px) 18px 24px;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }
        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid #eef1f5;
            flex-wrap: wrap;
            gap: 10px;
        }
        .team-row:last-child { border-bottom: none; }
        .page-footer { text-align: center; color: #6c757d; font-size: 13px; margin-top: 28px; }
        @media (max-width: 991.98px) {
            .main-content { margin-left: 0; padding: calc(var(--topbar-height) + 14px) 12px 20px; }
        }
    </style>
</head>
<body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>

    <main class="main-content">
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-header bg-white text-center py-3">
                <h5 class="m-0 text-success fw-semibold">Amader Bill Support Team's</h5>
            </div>
            <div id="supportNumbersList">
                <div class="text-center text-muted py-4">Loading support numbers...</div>
            </div>
            <div class="card-footer bg-white text-center text-muted small py-3">
                The Support Team is always dedicated to providing the highest level of customer service. Contact Support - Thank You.
            </div>
        </div>

        <div class="page-footer">© IRFAN IT - 2026</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebar-loader.js"></script>
    <script src="/assets/js/topbar-loader.js"></script>
    <script>
    (async function () {
        const container = document.getElementById("supportNumbersList");

        try {
            const response = await fetch("https://app.amaderbill.com/api/website-support/numbers", {
                credentials: "same-origin"
            });

            if (!response.ok) throw new Error("Failed to load support numbers");

            const result = await response.json();
            const numbers = Array.isArray(result.data) ? result.data : [];

            if (!numbers.length) {
                container.innerHTML = '<div class="text-center text-muted py-4">No support numbers available.</div>';
                return;
            }

            container.innerHTML = numbers.map(item => {
                const name = String(item.name || "").replace(/[&<>"']/g, c => ({
                    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
                }[c]));
                const mobile = String(item.mobile || "").replace(/[&<>"']/g, c => ({
                    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
                }[c]));
                const start = String(item.start_time || "").slice(0, 5);
                const end = String(item.end_time || "").slice(0, 5);

                return `
                    <div class="team-row">
                        <div class="fw-semibold"><i class="fa fa-user text-primary me-2"></i>${name}</div>
                        <div class="text-info fw-semibold"><i class="fa fa-phone me-1"></i>${mobile}</div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-success px-3 py-2">${start}</span>
                            <span class="text-muted small">to</span>
                            <span class="badge bg-danger px-3 py-2">${end}</span>
                        </div>
                    </div>`;
            }).join("");
        } catch (error) {
            container.innerHTML = '<div class="text-center text-danger py-4">Unable to load support numbers.</div>';
            console.error("Support numbers:", error);
        }
    })();
    </script>
</body>
</html>
