<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Bill Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- নীল হেডার, স্ট্রিপ ও টেবিলের staff-* স্টাইল collector.css এ আছে। shared staff css থাকলে এখানে সেটা দিন -->
    <link rel="stylesheet" href="/assets/css/collector.css">

    <style>
        /* ফিল্টার প্যানেল */
        .rp-filter{background:var(--bs-body-bg,#fff);border:1px solid var(--bs-border-color,#dee2e6);
            border-radius:6px;padding:12px;margin:0 0 12px}
        .rp-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
        .rp-grid .form-control,.rp-grid .form-select{font-size:14px;min-width:0}
        .rp-grid [disabled]{cursor:not-allowed}
        .rp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

        /* টেবিল */
        .rp-table td,.rp-table th{vertical-align:middle}
        .rp-table .rp-id{font-weight:500}
        .rp-badge{display:inline-block;background:#0d6efd;color:#fff;font-size:11px;font-weight:700;
            line-height:1.2;padding:3px 9px;border-radius:4px;margin-top:3px}
        .rp-sub{display:block;color:var(--bs-secondary-color,#6c757d)}
        .rp-bold{font-weight:600}
        .rp-name{min-width:150px;text-align:left}
        .rp-table th[data-sort]{cursor:pointer;white-space:nowrap}

        /* পেজিনেশন */
        .rp-pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 2px}
        .rp-pager .btn{min-width:84px}

        @media (max-width:1100px){.rp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
        @media (max-width:560px){.rp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>
</head>
<body class="staff-page">

<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<div class="main-content">

    <div id="pageAlert" class="alert d-none" role="alert"></div>

    <!-- BLUE HEADER -->
    <div class="staff-header-card">
        <h1>Bill Report</h1>
        <div class="staff-header-actions">
            <button type="button" class="staff-icon-btn" id="filterToggle" title="Filter">
                <i class="fa-solid fa-filter"></i>
            </button>
            <button type="button" class="staff-icon-btn" id="refreshBtn" title="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <a class="staff-icon-btn" href="/tutorial" title="Tutorial">
                <i class="fa-solid fa-circle-play"></i>
            </a>
            <button type="button" class="staff-icon-btn" id="backBtn" title="Back">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 12H6M11 6l-6 6 6 6M20 5v14"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- WHITE BODY -->
    <div class="staff-body-card">

        <!-- FILTER PANEL (ফিল্টার বাটনে খোলে/বন্ধ হয়) -->
        <div class="rp-filter d-none" id="filterPanel">
            <div class="rp-grid">
                <input type="month" id="fMonth" class="form-control" title="Month">
                <input type="datetime-local" id="fromDt" class="form-control" title="From">
                <input type="datetime-local" id="toDt" class="form-control" title="To">

                <select id="fMikrotik" class="form-select" disabled title="এই ফিল্টার এখনো চালু হয়নি">
                    <option value="">Mikrotik</option>
                </select>
                <select id="fPackage" class="form-select"><option value="">Package</option></select>
                <select id="fArea" class="form-select"><option value="">All Area</option></select>

                <select id="fSubArea" class="form-select" disabled title="এই ফিল্টার এখনো চালু হয়নি">
                    <option value="">Sub Area</option>
                </select>
                <select id="fCollector" class="form-select"><option value="">Collected By</option></select>
                <select id="fBillType" class="form-select"><option value="">Bill Type</option></select>

                <select id="fBillingType" class="form-select" disabled title="এই ফিল্টার এখনো চালু হয়নি">
                    <option value="">Billing Type</option>
                </select>
                <select id="fMedium" class="form-select"><option value="">Medium</option></select>
                <select id="fPayNow" class="form-select" disabled title="এই ফিল্টার এখনো চালু হয়নি">
                    <option value="">Pay Now</option>
                </select>
            </div>
            <div class="rp-actions">
                <button type="button" class="btn btn-outline-primary" id="filterBtn">Filter</button>
                <button type="button" class="btn btn-outline-secondary" id="resetBtn">Reset</button>
                <button type="button" class="btn btn-outline-success" id="csvBtn">
                    <i class="fa-solid fa-file-csv me-1"></i>CSV
                </button>
            </div>
        </div>

        <div class="staff-strip">
            <div class="staff-total">
                <i class="fa-solid fa-gear me-1"></i>
                <i class="fa-solid fa-database me-2"></i>Total Data:
                <span class="staff-count-pill" id="totalData">0</span>
                <span class="ms-3">Total Bill: <span id="totalBill">৳0</span></span>
            </div>
            <div class="staff-search-wrap">
                <input type="search" id="search" class="form-control" placeholder="Search" autocomplete="off">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table staff-table rp-table">
                <thead>
                    <tr>
                        <th data-sort="id">ID <span class="sort-icon">↓↑</span></th>
                        <th data-sort="name">Name &amp; PP/IP/Hp <span class="sort-icon">↓↑</span></th>
                        <th data-sort="bill">Package &amp; Bill <span class="sort-icon">↓↑</span></th>
                        <th data-sort="discount">Discount <span class="sort-icon">↓↑</span></th>
                        <th data-sort="due">Due <span class="sort-icon">↓↑</span></th>
                        <th data-sort="medium">Medium &amp; Type <span class="sort-icon">↓↑</span></th>
                        <th data-sort="collected_by">Collected <span class="sort-icon">↓↑</span></th>
                        <th data-sort="note">Note <span class="sort-icon">↓↑</span></th>
                        <th data-sort="date">Date <span class="sort-icon">↓↑</span></th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reportBody">
                    <tr><td colspan="10">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="rp-pager" id="pager">
            <div class="d-flex align-items-center gap-2">
                <label for="limit" class="mb-0 text-muted small">Show</label>
                <select id="limit" class="form-select form-select-sm" style="width:auto">
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="5000">5000</option>
                    <option value="100000">All</option>
                </select>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="prevBtn">Previous</button>
                <span class="small text-muted" id="pageInfo">Page 1 of 1</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="nextBtn">Next</button>
            </div>
        </div>
    </div>

    <div class="staff-footer">© IRFAN IT - 2026</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js?v=20261009"></script>
<script src="/assets/js/topbar-loader.js?v=20261009"></script>
<script src="/assets/js/report-collection.js"></script>
<script src="/assets/js/i18n.js?v=mw7ynpem"></script>
</body>
</html>
