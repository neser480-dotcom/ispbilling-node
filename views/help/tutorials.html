<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Tutorials</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
        :root { --topbar-height: 70px; --sidebar-width: 250px; }
        body { background: #f4f6f9; margin: 0; overflow-x: hidden; }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: calc(var(--topbar-height) + 16px) 18px 24px;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }
        .video-card {
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .video-thumb {
            position: relative;
            background: #1b2432;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }
        .video-play-btn {
            width: 58px;
            height: 40px;
            border-radius: 10px;
            background: #e53935;
            color: #fff;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .video-caption {
            padding: 10px 12px;
            font-size: 13.5px;
            color: #333;
            font-weight: 500;
        }
        .page-footer { text-align: center; color: #6c757d; font-size: 13px; margin-top: 28px; }
        @media (max-width: 991.98px) {
            .main-content { margin-left: 0; padding: calc(var(--topbar-height) + 14px) 12px 20px; }
        }
    </style>
</head>
<body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>

    <main class="main-content">
        <div class="row g-3" id="videoGrid"></div>
        <div class="page-footer">© Irfan IT - 2026</div>
    </main>

    <!-- VIDEO PREVIEW MODAL -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="videoModalTitle">Tutorial</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="ratio ratio-16x9">
                        <iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebar-loader.js"></script>
    <script src="/assets/js/topbar-loader.js"></script>
    <script>
        const VIDEOS = [
            { title: "Version how to use on mobile", label: "Version how to use on mobile", ytId: "dQw4w9WgXcQ" },
            { title: "Admin Panel Dashboard", label: "Dashboard", ytId: "dQw4w9WgXcQ" },
            { title: "Support Tutorial", label: "Support", ytId: "dQw4w9WgXcQ" },
            { title: "Admin Panel Tutorial", label: "Admin Panel Tutorial", ytId: "dQw4w9WgXcQ" },
            { title: "Admin Panel Area", label: "Area", ytId: "dQw4w9WgXcQ" },
            { title: "Mikrotik Configuration", label: "Mikrotik", ytId: "dQw4w9WgXcQ" }
        ];

        function openVideo(title, ytId) {
            document.getElementById("videoModalTitle").textContent = title;
            document.getElementById("videoIframe").src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            bootstrap.Modal.getOrCreateInstance(document.getElementById("videoModal")).show();
        }

        document.getElementById("videoModal").addEventListener("hidden.bs.modal", () => {
            document.getElementById("videoIframe").src = "";
        });

        document.getElementById("videoGrid").innerHTML = VIDEOS.map((v) => `
            <div class="col-md-4 col-sm-6">
                <div class="video-card">
                    <div class="video-thumb" onclick="openVideo('${v.title.replace(/'/g, "\\'")}', '${v.ytId}')">
                        <button type="button" class="video-play-btn"><i class="fa fa-play"></i></button>
                    </div>
                    <div class="video-caption">${v.label}</div>
                </div>
            </div>
        `).join("");
    </script>
</body>
</html>
