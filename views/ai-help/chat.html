<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Help | Amader Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/ai-help.css">
</head>
<body>
<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<main class="main-content">
    <section class="ai-chat-layout">
        <aside class="ai-chat-sidebar">
            <button type="button" id="newAiChat" class="ai-new-chat">＋ New conversation</button>
            <h2>Recent conversations</h2>
            <div id="chatHistoryList" class="ai-chat-history-list">
                <p class="ai-muted-note">Loading conversations...</p>
            </div>
            <a href="/ai-help/settings" class="ai-settings-link">AI Help Settings</a>
        </aside>

        <section class="ai-chat-container">
            <header class="ai-chat-header">
                <div class="ai-assistant-avatar" aria-hidden="true">AI</div>
                <div>
                    <span class="ai-eyebrow">AMADER BILL SUPPORT</span>
                    <h1>AI Help Assistant</h1>
                    <p>Ask about verified software features and procedures.</p>
                </div>
                <span class="ai-readonly-label">Read-only support</span>
            </header>

            <div class="ai-suggestion-list" id="aiSuggestions">
                <button type="button" data-question="Customer recharge সম্পর্কে কীভাবে সাহায্য করতে পারো?">Customer Recharge</button>
                <button type="button" data-question="MikroTik offline হলে software billing কীভাবে কাজ করে?">MikroTik Offline</button>
                <button type="button" data-question="OLT Customer Sync এবং ONU Sync-এর পার্থক্য কী?">OLT Sync</button>
            </div>

            <section id="chatMessages" class="ai-chat-messages" aria-live="polite" aria-label="Chat messages"></section>

            <form id="aiChatForm" class="ai-chat-form">
                <textarea id="chatQuestion" rows="2" maxlength="4000"
                          placeholder="আপনার প্রশ্ন লিখুন..." required></textarea>
                <button type="submit" id="sendQuestion">Send</button>
                <small>AI Help is read-only. Do not share passwords, OTPs, API keys or customer private data.</small>
            </form>
        </section>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
<script src="/assets/js/ai-help-chat.js"></script>
</body>
</html>
