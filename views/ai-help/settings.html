
<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Help Settings</title>
    <link rel="stylesheet" href="/assets/css/ai-help.css">
</head>
<body>

<div id="sidebarContainer"></div>
<div id="topbarContainer"></div>

<main class="main-content">
    <main class="ai-help-container">
        <h2>AI Help Settings</h2>

        <div id="settingsMessage" class="ai-message"></div>

        <form id="aiHelpSettingsForm">
            <label>
                AI Help Status
                <select id="aiEnabled">
                    <option value="1">Enabled</option>
                    <option value="0">Disabled</option>
                </select>
            </label>

            <label>
                AI Provider
                <input value="OpenAI" disabled>
            </label>

            <label>
                API Key
                <input type="password" id="apiKey" placeholder="Enter OpenAI API Key">
            </label>

            <label>
                Model
                <input type="text" id="aiModel" placeholder="gpt-4o-mini">
            </label>

            <button type="submit">Save Settings</button>
        </form>
    </main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/ai-help-settings.js"></script>
<script src="/assets/js/sidebar-loader.js"></script>
<script src="/assets/js/topbar-loader.js"></script>
</body>
</html>
