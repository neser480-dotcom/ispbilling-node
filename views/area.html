<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Area</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/assets/css/area.css"
    >

</head>


<body>


<!-- SIDEBAR -->

<div id="sidebarContainer"></div>


<!-- TOPBAR -->

<div id="topbarContainer"></div>


<!-- MAIN -->

<div class="main-content">


    <div class="card shadow-sm border-0 rounded-3">


        <!-- HEADER -->

        <div class="card-header bg-primary text-white py-3">

            <div
                class="d-flex justify-content-between align-items-center flex-wrap gap-2"
            >


                <h4 class="mb-0 fw-bold fs-4">

                    <i class="fa fa-map-marker-alt me-2"></i>

                    Area

                </h4>


                <div class="d-flex gap-2">


                    <!-- ADD -->

                    <button
                        type="button"
                        class="btn btn-light btn-sm fw-bold text-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#addAreaModal"
                    >

                        <i class="fa fa-plus-circle me-1"></i>

                        Add Area

                    </button>


                    <!-- RELOAD -->

                    <button
                        type="button"
                        class="btn btn-light btn-sm fw-bold text-primary"
                        id="reloadArea"
                    >

                        <i class="fa fa-refresh me-1"></i>

                        Reload

                    </button>


                    <!-- LOCATION -->

                    <button
                        type="button"
                        class="btn btn-light btn-sm fw-bold text-primary"
                        id="locationArea"
                        title="Location"
                    >

                        <i class="fa fa-location-dot"></i>

                    </button>


                    <!-- TUTORIAL -->

                    <button
                        type="button"
                        class="btn btn-light btn-sm fw-bold text-primary"
                        id="tutorialArea"
                        title="Tutorial"
                    >

                        <i class="fa fa-circle-question"></i>

                    </button>


                </div>

            </div>

        </div>


        <!-- BODY -->

        <div class="card-body p-4">


            <!-- DATA STRIP -->

            <div class="area-data-strip mb-3">


                <strong>

                    <i class="fa fa-database me-2"></i>

                    Total Area

                    <span id="totalAreaCount">0</span>

                </strong>


                <div class="area-search-wrap">

                    <i class="fa fa-search"></i>


                    <input
                        type="text"
                        id="areaSearch"
                        class="form-control"
                        placeholder="Search Area..."
                        autocomplete="off"
                    >

                </div>


            </div>


            <!-- TABLE -->

            <div class="table-responsive">


                <table
                    class="table table-hover align-middle mb-0"
                    id="areaTable"
                >


                    <thead class="table-dark">

                        <tr>

                            <th width="70">
                                #
                            </th>

                            <th>
                                Area
                            </th>

                            <th
                                class="company-column d-none"
                            >
                                Company
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Sub Area
                            </th>

                            <th>
                                Remarks
                            </th>

                            <th
                                width="100"
                                class="text-end pe-4"
                            >
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="areaTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="text-center py-5 text-muted"
                            >

                                <i
                                    class="fa fa-spinner fa-spin fa-2x mb-2 d-block"
                                ></i>

                                Loading...

                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>


        </div>


    </div>


</div>


<!-- ==================================================
     ADD AREA MODAL
================================================== -->

<div
    class="modal fade"
    id="addAreaModal"
    tabindex="-1"
    aria-hidden="true"
>


    <div class="modal-dialog modal-dialog-centered">


        <div class="modal-content border-0 shadow">


            <form id="addAreaForm">


                <div class="modal-header bg-primary text-white">


                    <h5 class="modal-title fw-bold">

                        <i class="fa fa-plus-circle me-2"></i>

                        Add New Area

                    </h5>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                    ></button>


                </div>


                <div class="modal-body">


                    <!-- COMPANY -->

                    <div
                        class="mb-3"
                        id="companyFieldWrap"
                        style="display:none;"
                    >


                        <label
                            class="form-label fw-semibold"
                            for="areaCompany"
                        >
                            Company
                        </label>


                        <select
                            name="company_id"
                            id="areaCompany"
                            class="form-select"
                        >

                            <option value="">
                                Select Company
                            </option>

                        </select>


                    </div>


                    <!-- NAME -->

                    <div class="mb-3">


                        <label
                            class="form-label fw-semibold"
                            for="addAreaName"
                        >

                            Area Name

                            <span class="text-danger">
                                *
                            </span>

                        </label>


                        <input
                            type="text"
                            name="name"
                            id="addAreaName"
                            class="form-control"
                            required
                        >


                    </div>


                    <!-- REMARKS -->

                    <div class="mb-3">


                        <label
                            class="form-label fw-semibold"
                            for="addAreaRemarks"
                        >

                            Remarks

                        </label>


                        <textarea
                            name="remarks"
                            id="addAreaRemarks"
                            rows="4"
                            class="form-control"
                        ></textarea>


                    </div>


                </div>


                <div class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="fa fa-save me-1"></i>

                        Save Area

                    </button>


                </div>


            </form>


        </div>


    </div>


</div>


<!-- DYNAMIC EDIT / DELETE MODALS -->

<div id="areaModals"></div>


<!-- JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script src="/assets/js/sidebar-loader.js"></script>

<script src="/assets/js/topbar-loader.js"></script>

<script src="/assets/js/area.js"></script>


</body>

</html>
